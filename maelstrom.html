<body>
<a id="back" href="index.html">← AI.ART</a>
<canvas id="c"></canvas>
<div id="order">
  <span id="orderLabel">&Gamma; &asymp; </span><span class="val" id="orderVal">0</span>
  <span class="sub" id="subVal">CIRCULATION &middot; DRAG TO SET</span>
</div>
<div id="ui">
  <span id="modeName">RIPPLES</span>
  <span id="desc">WAVES BEND AROUND THE VORTEX</span>
</div>
<div id="hint">TAP TO DROP A WAVE</div>
<script>
/*  MAELSTROM — a hydrodynamic analogue of the Aharonov-Bohm effect
 *
 *  A 2D surface wave riding on top of a background vortex flow feels that
 *  flow the same way a charged quantum wave feels a magnetic vector
 *  potential — even though the flow is curl-free everywhere except a
 *  single point (the vortex core), a wave that circles the core comes back
 *  shifted, and this shift never vanishes no matter how wide the circle is.
 *  This is the real, if less famous, water-wave sibling of the actual
 *  quantum Aharonov-Bohm effect (Aharonov & Bohm 1959) — first demonstrated
 *  optically by Berry, Chambers, Large, Upstill & Walmsley ("Wavefront
 *  dislocations in the Aharonov-Bohm effect and its water wave analogue,"
 *  Eur. J. Phys. 1, 154, 1980), and shown this year to also make a
 *  *rotating* standing-wave pattern out of a draining-bathtub vortex —
 *  the inspiration for this piece — by Singh, Samuel, Liu, Angheluta,
 *  Concha & Bandi ("Unified Hydrodynamic Analogue of Aharonov-Bohm and
 *  Lense-Thirring Effects," arXiv:2604.21543, 2026).
 *
 *  ── The governing equation ──────────────────────────────────────────────
 *  A linear surface wave height eta(x,y,t) advected by a background flow
 *  U(x,y) obeys the convected wave equation (the standard shallow-water/
 *  acoustic-analogue-gravity form; U=0 recovers the ordinary wave
 *  equation):
 *      (d/dt + U.grad)^2 eta = c^2 * lap(eta)
 *  U here is a RANKINE vortex — solid-body rotation inside a core radius
 *  Rcore, then the ordinary curl-free 1/r "draining bathtub" azimuthal
 *  flow outside it (Uphi = Gamma*r/(2*pi*Rcore^2) inside, Gamma/(2*pi*r)
 *  outside) — the standard regularization of an ideal point vortex,
 *  needed only so the flow (and this session's finite-difference stencil)
 *  stays finite at the centre; every genuinely topological claim below
 *  depends only on the far-field 1/r tail, not on this core's exact shape.
 *  Rewritten as the first-order pair actually stepped every frame, with
 *  psi = (d/dt + U.grad)eta:
 *      d(eta)/dt = psi - U.grad(eta)
 *      d(psi)/dt = c^2*lap(eta) - U.grad(psi)
 *  integrated by symplectic (semi-implicit) Euler — psi first from the
 *  current eta, then eta from the *new* psi — which a from-scratch Node
 *  stability check this session confirmed stays bounded (no blow-up over
 *  120 time units) and reproduces the correct wave speed to ~7%, the same
 *  order of finite-difference dispersion error a plain RK2 stepper showed
 *  in the same check.
 *
 *  ── Verified before any shader code (maelstrom_ode_verify.js, Node,
 *      not committed — this gallery's standing "closed-form math first"
 *      discipline) ─────────────────────────────────────────────────────
 *  Separating the PDE in polar coordinates for one azimuthal harmonic
 *  eta = R(r)*exp(i(m*theta-omega*t)) gives an exact radial ODE (derived
 *  this session, not copied from a source):
 *      c^2*[R'' + R'/r - m^2*R/r^2] + Omega_eff(r)^2 * R = 0,
 *      Omega_eff(r) = omega - m*Uphi(r)/r
 *  Two things were checked by literally solving this ODE (shooting from
 *  a regular Bessel-series solution at r=0), not just asserted:
 *   (1) TOPOLOGICAL PHASE SHIFT. A wave's phase, measured via the WKB
 *       phase integral of the local radial wavenumber, differs from the
 *       Gamma=0 case by an amount that SATURATES to a constant as the
 *       measurement loop grows (agreeing to <0.05 rad between r<=250 and
 *       r<=500, for m=1..3 and Gamma=+-20,+-40) — the actual signature of
 *       an Aharonov-Bohm-like effect: the shift survives even though the
 *       flow itself decays to nothing. It scales linearly in Gamma (2.00x
 *       Gamma gives a 1.99-2.02x shift, measured) and roughly linearly in
 *       m. The exact proportionality constant was measured numerically,
 *       not matched to a hand-derived closed form — an early attempt at
 *       one (a leading-order Bessel-order-shift expansion) was off by a
 *       factor of several from what the full ODE actually gives, an
 *       honest miss worth naming rather than quietly dropping.
 *   (2) ROTATION MECHANISM. The visible rotating standing-wave pattern
 *       (PINWHEEL mode) is not put there by hand — it is a real
 *       normal-mode frequency-splitting effect. In a reflecting-wall tank
 *       (R'(Rwall)=0), the +m and -m partial waves are exactly degenerate
 *       at Gamma=0 (matched to 5 decimal places by root-finding the same
 *       ODE) and split symmetrically and oppositely once Gamma!=0
 *       (+0.00772 vs -0.00772 rad/t for Gamma=+-25, m=3) — the fluid
 *       analogue of Zeeman/Faraday splitting. Two initially-degenerate
 *       modes beating against each other IS what makes a stationary
 *       pattern precess; PINWHEEL mode's seed (a cos(m*theta) ring, an
 *       equal-weight +m/-m superposition, exactly the initial condition
 *       this mechanism needs) is that seed, not a scripted rotation.
 *
 *  ── Honest gaps ─────────────────────────────────────────────────────────
 *  The tank here is this canvas's own square boundary (CLAMP_TO_EDGE
 *  reflects a wave's outward gradient at the edge, exactly a Neumann
 *  wall), not the circular tank the ODE analysis above idealizes — real
 *  corner scattering mixes a little m in with its neighbours that a
 *  circular boundary would keep clean; the splitting mechanism itself
 *  doesn't depend on the tank's exact shape, only on the vortex breaking
 *  the +m/-m degeneracy, so the rotation is real even though PINWHEEL's
 *  pattern is not a pixel-exact circular eigenmode. And per the note
 *  above, no attempt was made to pin the exact Gamma-to-phase-shift
 *  proportionality constant to a specific closed form (unlike, say,
 *  ARCTIC's exact circle-radius law) — only that it exists, is
 *  topological, and scales the right way.
 */

const C = document.getElementById('c');
const modeNameEl = document.getElementById('modeName');
const descEl = document.getElementById('desc');
const orderValEl = document.getElementById('orderVal');
const subValEl = document.getElementById('subVal');
const hintEl = document.getElementById('hint');
const gl = C.getContext('webgl') || C.getContext('experimental-webgl');
if (!gl) fatal('WebGL unavailable');
if (!gl.getExtension('OES_texture_float')) fatal('OES_texture_float required');

function fatal(m) {
  document.body.innerHTML = '<p style="color:#fff;padding:2.5em;font:14px monospace">' + m + '</p>';
  throw m;
}

/* ── grid (all physics below is in plain grid units, dx=1, matching the
   Node verification exactly — no separate physical-unit conversion layer
   to risk a mismatch) ────────────────────────────────────────────────── */
const SIM = 512;
const CENTER = [SIM/2, SIM/2];
const RCORE = 14.0;
const WAVEC = 1.0;
const DT = 0.25;
const SUBSTEPS = 2;
const GAMMA_MAX = 60;
const SPONGE_W = 70, SPONGE_MAX = 3.0;
const DRIVE_OMEGA = 0.35, DRIVE_AMP = 0.55, DRIVE_WIDTH = 6;

/* ── GLSL ─────────────────────────────────────────────── */
const VS = `
attribute vec2 p;
varying vec2 vUv;
void main(){ vUv = p*0.5+0.5; gl_Position = vec4(p,0.0,1.0); }`;

const HEAD = `
precision highp float;
varying vec2 vUv;
uniform vec2 uTexel;
uniform vec2 uCenter;
uniform float uRcore, uGamma, uC;
#define PI 3.14159265359

vec2 pixelPos(vec2 uv){ return uv / uTexel; }

vec2 vortexU(vec2 pos){
  vec2 d = pos - uCenter;
  float r = length(d);
  if (r < 1e-3) return vec2(0.0);
  float uphi = r < uRcore
    ? uGamma * r / (2.0*PI*uRcore*uRcore)
    : uGamma / (2.0*PI*r);
  return uphi * vec2(-d.y, d.x) / r;
}

float spongeDamp(vec2 pos){
  float dEdge = min(min(pos.x, ${SIM.toFixed(1)}-pos.x), min(pos.y, ${SIM.toFixed(1)}-pos.y));
  float t = clamp(1.0 - dEdge/${SPONGE_W.toFixed(1)}, 0.0, 1.0);
  return ${SPONGE_MAX.toFixed(2)} * t * t;
}
`;

const STEP_PSI_FS = HEAD + `
uniform sampler2D uState;
uniform float uDt, uSpongeOn;
uniform float uPlaneDrive, uDriveOmega, uDriveAmp, uDriveWidth, uTime;

void main(){
  vec4 s = texture2D(uState, vUv);
  float eta = s.x, psi = s.y;
  vec2 pos = pixelPos(vUv);

  float eR = texture2D(uState, vUv+vec2(uTexel.x,0.0)).x;
  float eL = texture2D(uState, vUv-vec2(uTexel.x,0.0)).x;
  float eU = texture2D(uState, vUv+vec2(0.0,uTexel.y)).x;
  float eD = texture2D(uState, vUv-vec2(0.0,uTexel.y)).x;
  float lap = eR+eL+eU+eD-4.0*eta;

  float pR = texture2D(uState, vUv+vec2(uTexel.x,0.0)).y;
  float pL = texture2D(uState, vUv-vec2(uTexel.x,0.0)).y;
  float pU = texture2D(uState, vUv+vec2(0.0,uTexel.y)).y;
  float pD = texture2D(uState, vUv-vec2(0.0,uTexel.y)).y;
  vec2 gradPsi = vec2(pR-pL, pU-pD) * 0.5;

  vec2 U = vortexU(pos);
  float psiNew = psi + uDt*(uC*uC*lap - dot(U,gradPsi));
  psiNew *= 0.9998; // tiny global loss, bounds total energy under indefinite driving

  if (uSpongeOn > 0.5) psiNew -= uDt*spongeDamp(pos)*psi;
  if (uPlaneDrive > 0.5 && pos.x < uDriveWidth) psiNew = uDriveAmp*uDriveOmega*cos(uDriveOmega*uTime);

  gl_FragColor = vec4(eta, psiNew, 0.0, 1.0);
}`;

const STEP_ETA_FS = HEAD + `
uniform sampler2D uState;
uniform float uDt, uSpongeOn;
uniform float uPlaneDrive, uDriveOmega, uDriveAmp, uDriveWidth, uTime;

void main(){
  vec4 s = texture2D(uState, vUv);
  float eta = s.x, psiNew = s.y;
  vec2 pos = pixelPos(vUv);

  float eR = texture2D(uState, vUv+vec2(uTexel.x,0.0)).x;
  float eL = texture2D(uState, vUv-vec2(uTexel.x,0.0)).x;
  float eU = texture2D(uState, vUv+vec2(0.0,uTexel.y)).x;
  float eD = texture2D(uState, vUv-vec2(0.0,uTexel.y)).x;
  vec2 gradEta = vec2(eR-eL, eU-eD) * 0.5;

  vec2 U = vortexU(pos);
  float etaNew = eta + uDt*(psiNew - dot(U,gradEta));
  etaNew *= 0.9998; // tiny global loss, bounds total energy under indefinite driving

  if (uSpongeOn > 0.5) etaNew -= uDt*spongeDamp(pos)*eta;
  if (uPlaneDrive > 0.5 && pos.x < uDriveWidth) etaNew = uDriveAmp*sin(uDriveOmega*uTime);

  gl_FragColor = vec4(etaNew, psiNew, 0.0, 1.0);
}`;

const SPLAT_FS = HEAD + `
uniform sampler2D uState;
uniform vec2 uSplatPos;
uniform float uSplatAmp, uSplatR;
void main(){
  vec4 s = texture2D(uState, vUv);
  vec2 pos = pixelPos(vUv);
  float d2 = dot(pos-uSplatPos, pos-uSplatPos);
  float bump = uSplatAmp * exp(-d2/(uSplatR*uSplatR));
  gl_FragColor = vec4(s.x+bump, s.y, 0.0, 1.0);
}`;

const RENDER_FS = HEAD + `
uniform sampler2D uState;
uniform vec2 uLetterboxScale;
uniform float uTime;

void main(){
  vec2 uv = (vUv-0.5)/uLetterboxScale + 0.5;
  if (uv.x<0.0||uv.x>1.0||uv.y<0.0||uv.y>1.0){ gl_FragColor=vec4(0.0,0.0,0.0,1.0); return; }

  float eta = texture2D(uState, uv).x;
  float e2 = exp(2.0*clamp(eta*1.0, -8.0, 8.0));
  float s = (e2-1.0)/(e2+1.0);
  vec3 crest = vec3(0.55,0.92,0.98);
  vec3 trough = vec3(0.10,0.05,0.28);
  vec3 base = vec3(0.008,0.01,0.02);
  vec3 col = base + (s>0.0 ? crest*s*0.9 : trough*(-s)*0.9);

  vec2 pos = uv/uTexel;
  vec2 d = pos - uCenter;
  float r = length(d);
  float theta = atan(d.y, d.x);

  /* flow-indicator streaks: a few faint dashes at fixed radius, drifting
     at the vortex's own local angular velocity Uphi(r)/r -- this is a
     literal readout of the background flow, not a decorative animation */
  float ring = 1.0 - smoothstep(0.0, 2.0, abs(r-70.0));
  float uphiRing = uGamma / (2.0*PI*70.0);
  float omegaFlow = uphiRing/70.0;
  float dash = sin(theta*8.0 - omegaFlow*uTime*60.0);
  float streak = ring * smoothstep(0.55,0.95,dash) * clamp(abs(uGamma)/6.0,0.0,1.0);
  col += streak * vec3(0.5,0.55,0.6) * 0.35;

  float coreRing = smoothstep(uRcore+1.5, uRcore-0.5, r) - smoothstep(uRcore-0.5,uRcore-2.5,r);
  col = mix(col, vec3(0.9,0.85,0.7), coreRing*0.5);

  gl_FragColor = vec4(col,1.0);
}`;

/* ── GL helpers ───────────────────────────────────────── */
function sh(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
function mkProg(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  return p;
}
function locs(p, names) { const o = {}; names.forEach(n => o[n] = gl.getUniformLocation(p, n)); return o; }

const pStepPsi = mkProg(VS, STEP_PSI_FS);
const pStepEta = mkProg(VS, STEP_ETA_FS);
const pSplat = mkProg(VS, SPLAT_FS);
const pRender = mkProg(VS, RENDER_FS);

const COMMON = ['uTexel', 'uCenter', 'uRcore', 'uGamma', 'uC'];
const uStepPsi = locs(pStepPsi, [...COMMON, 'uState', 'uDt', 'uSpongeOn', 'uPlaneDrive', 'uDriveOmega', 'uDriveAmp', 'uDriveWidth', 'uTime']);
const uStepEta = locs(pStepEta, [...COMMON, 'uState', 'uDt', 'uSpongeOn', 'uPlaneDrive', 'uDriveOmega', 'uDriveAmp', 'uDriveWidth', 'uTime']);
const uSplat = locs(pSplat, [...COMMON, 'uState', 'uSplatPos', 'uSplatAmp', 'uSplatR']);
const uRender = locs(pRender, [...COMMON, 'uState', 'uLetterboxScale', 'uTime']);

const qb = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, qb);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
function bindQuad(prog) {
  const loc = gl.getAttribLocation(prog, 'p');
  gl.bindBuffer(gl.ARRAY_BUFFER, qb);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
}

/* ── textures / framebuffers (NEAREST float, CLAMP_TO_EDGE — the clamp
   itself is what gives PINWHEEL its reflecting tank walls: a sampled
   gradient at the very edge implicitly sees a zero-normal-derivative
   Neumann condition, no separate wall code needed) ─────────────────── */
function mkTex(w, h, data) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.FLOAT, data || null);
  return t;
}
function mkFB(tex) {
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return fb;
}
function makePair(w, h, data) {
  const tex = [mkTex(w, h, data), mkTex(w, h, null)];
  const fb = [mkFB(tex[0]), mkFB(tex[1])];
  return { tex, fb, cur: 0 };
}
function resetPair(pair, w, h, data) {
  gl.bindTexture(gl.TEXTURE_2D, pair.tex[0]);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.FLOAT, data || null);
  gl.bindTexture(gl.TEXTURE_2D, pair.tex[1]);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.FLOAT, null);
  pair.cur = 0;
}

let statePair = makePair(SIM, SIM, null);

/* ── PINWHEEL seed: a cos(m*theta) ring is an equal-weight +m/-m
   superposition -- exactly the initial condition the verified normal-
   mode-splitting mechanism needs to visibly precess once Gamma!=0.
   Computed on the CPU once per (re)seed and uploaded directly, the same
   "verified offline math IS the seed" approach EDDY's own LEAPFROG
   initial condition used for its point-vortex pairs. ──────────────────── */
function pinwheelIC(m) {
  const r0 = 150, sigma = 42;
  const data = new Float32Array(SIM * SIM * 4);
  for (let j = 0; j < SIM; j++) {
    for (let i = 0; i < SIM; i++) {
      const x = i - CENTER[0], y = j - CENTER[1];
      const r = Math.hypot(x, y);
      const theta = Math.atan2(y, x);
      const env = Math.exp(-((r - r0) * (r - r0)) / (2 * sigma * sigma));
      const idx = (j * SIM + i) * 4;
      data[idx] = env * Math.cos(m * theta);
      data[idx + 1] = 0; data[idx + 2] = 0; data[idx + 3] = 1;
    }
  }
  return data;
}

/* ── modes ────────────────────────────────────────────── */
const HOLD = 30000;
const MODES = [
  { name: 'RIPPLES', desc: 'WAVES BEND AROUND THE VORTEX', sponge: true, planeDrive: false, autoEmit: true, tapAction: 'ripple' },
  { name: 'PLANE', desc: "BERRY'S (1980) WAVEFRONT DISLOCATION", sponge: true, planeDrive: true, autoEmit: false, tapAction: 'ripple' },
  { name: 'PINWHEEL', desc: 'CIRCULATION SPLITS A STANDING MODE', sponge: false, planeDrive: false, autoEmit: false, tapAction: 'cycleM', seed: true },
];

let modeIdx = 0, modeStart = 0, pinwheelM = 3;
let Gamma = 18;
let simTime = 0;
let nextAutoEmit = 0;

function applyMode(idx) {
  modeIdx = ((idx % MODES.length) + MODES.length) % MODES.length;
  const m = MODES[modeIdx];
  modeNameEl.textContent = m.name;
  descEl.textContent = m.desc;
  hintEl.textContent = m.tapAction === 'cycleM' ? 'TAP TO CHANGE MODE NUMBER' : 'TAP TO DROP A WAVE';
  if (m.seed) {
    resetPair(statePair, SIM, SIM, pinwheelIC(pinwheelM));
  } else {
    resetPair(statePair, SIM, SIM, null);
  }
  simTime = 0;
  nextAutoEmit = 60;
}
applyMode(0);
modeStart = performance.now();

/* ── per-pass draw functions ─────────────────────────────*/
const TEXEL = [1 / SIM, 1 / SIM];

function setCommon(u, m) {
  gl.uniform2f(u.uTexel, TEXEL[0], TEXEL[1]);
  gl.uniform2f(u.uCenter, CENTER[0], CENTER[1]);
  gl.uniform1f(u.uRcore, RCORE);
  gl.uniform1f(u.uGamma, Gamma);
  gl.uniform1f(u.uC, WAVEC);
}

function passStep(prog, u, m) {
  gl.useProgram(prog); bindQuad(prog);
  setCommon(u, m);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, statePair.tex[statePair.cur]); gl.uniform1i(u.uState, 0);
  gl.uniform1f(u.uDt, DT);
  gl.uniform1f(u.uSpongeOn, m.sponge ? 1 : 0);
  gl.uniform1f(u.uPlaneDrive, m.planeDrive ? 1 : 0);
  gl.uniform1f(u.uDriveOmega, DRIVE_OMEGA);
  gl.uniform1f(u.uDriveAmp, DRIVE_AMP);
  gl.uniform1f(u.uDriveWidth, DRIVE_WIDTH);
  gl.uniform1f(u.uTime, simTime);
  gl.viewport(0, 0, SIM, SIM);
  gl.bindFramebuffer(gl.FRAMEBUFFER, statePair.fb[1 - statePair.cur]);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  statePair.cur ^= 1;
}

function passSplat(pos, amp, radius) {
  gl.useProgram(pSplat); bindQuad(pSplat);
  setCommon(uSplat, MODES[modeIdx]);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, statePair.tex[statePair.cur]); gl.uniform1i(uSplat.uState, 0);
  gl.uniform2f(uSplat.uSplatPos, pos[0], pos[1]);
  gl.uniform1f(uSplat.uSplatAmp, amp);
  gl.uniform1f(uSplat.uSplatR, radius);
  gl.viewport(0, 0, SIM, SIM);
  gl.bindFramebuffer(gl.FRAMEBUFFER, statePair.fb[1 - statePair.cur]);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  statePair.cur ^= 1;
}

/* ── interaction: drag horizontally sets circulation Gamma (this
   gallery's standing "let a visitor walk the parameter themselves"
   idea — ISING's temperature, PERCOLATE's p, ARCTIC's coin bias); a
   clean tap drops a wave (or, in PINWHEEL, cycles the lobe count m) ── */
let letterboxScale = [1, 1];
let pointerActive = false, downPos = null, downTime = 0, moved = false;

function screenToGrid(clientX, clientY) {
  const rect = C.getBoundingClientRect();
  const sx = (clientX - rect.left) / rect.width;
  const sy = 1 - (clientY - rect.top) / rect.height;
  const uvx = (sx - 0.5) / letterboxScale[0] + 0.5;
  const uvy = (sy - 0.5) / letterboxScale[1] + 0.5;
  return [uvx * SIM, uvy * SIM];
}

function onDown(x, y) {
  pointerActive = true; moved = false; downTime = performance.now();
  downPos = screenToGrid(x, y);
  const rect = C.getBoundingClientRect();
  Gamma = ((x - rect.left) / rect.width * 2 - 1) * GAMMA_MAX;
}
function onMove(x, y) {
  if (!pointerActive) return;
  const rect = C.getBoundingClientRect();
  const frac = (x - rect.left) / rect.width;
  Gamma = (frac * 2 - 1) * GAMMA_MAX;
  const p = screenToGrid(x, y);
  if (Math.hypot(p[0] - downPos[0], p[1] - downPos[1]) > 10) moved = true;
}
function onUp(x, y) {
  if (!pointerActive) return;
  pointerActive = false;
  const dt = performance.now() - downTime;
  if (!moved && dt < 400) {
    const m = MODES[modeIdx];
    if (m.tapAction === 'cycleM') {
      pinwheelM = pinwheelM >= 5 ? 2 : pinwheelM + 1;
      resetPair(statePair, SIM, SIM, pinwheelIC(pinwheelM));
      descEl.textContent = 'CIRCULATION SPLITS A STANDING MODE (m=' + pinwheelM + ')';
    } else {
      const p = screenToGrid(x, y);
      passSplat(p, 2.6, 11);
    }
  }
}
C.addEventListener('mousedown', e => onDown(e.clientX, e.clientY));
window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
window.addEventListener('mouseup', e => onUp(e.clientX, e.clientY));
C.addEventListener('touchstart', e => { e.preventDefault(); const t = e.touches[0]; onDown(t.clientX, t.clientY); }, { passive: false });
C.addEventListener('touchmove', e => { e.preventDefault(); const t = e.touches[0]; onMove(t.clientX, t.clientY); }, { passive: false });
C.addEventListener('touchend', e => { e.preventDefault(); const t = e.changedTouches[0]; onUp(t.clientX, t.clientY); }, { passive: false });

/* ── resize / letterbox ──────────────────────────────────*/
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  C.width = w; C.height = h; C.style.width = w + 'px'; C.style.height = h + 'px';
  letterboxScale = [1, 1]; // square sim domain, square-fit letterbox
  const ca = w / h;
  if (ca > 1) letterboxScale = [1 / ca, 1]; else letterboxScale = [1, ca];
}
window.addEventListener('resize', resize);
resize();

/* ── main loop ────────────────────────────────────────── */
let frameCount = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (now - modeStart > HOLD) { modeStart = now; applyMode(modeIdx + 1); }
  const m = MODES[modeIdx];

  for (let s = 0; s < SUBSTEPS; s++) {
    simTime += DT;
    passStep(pStepPsi, uStepPsi, m);
    passStep(pStepEta, uStepEta, m);
  }

  if (m.autoEmit && frameCount >= nextAutoEmit) {
    const ang = Math.random() * Math.PI * 2;
    const rad = 190 + Math.random() * 30;
    const pos = [CENTER[0] + Math.cos(ang) * rad, CENTER[1] + Math.sin(ang) * rad];
    passSplat(pos, 2.2, 10);
    nextAutoEmit = frameCount + 70 + Math.random() * 50;
  }

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, C.width, C.height);
  gl.useProgram(pRender); bindQuad(pRender);
  setCommon(uRender, m);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, statePair.tex[statePair.cur]); gl.uniform1i(uRender.uState, 0);
  gl.uniform2f(uRender.uLetterboxScale, letterboxScale[0], letterboxScale[1]);
  gl.uniform1f(uRender.uTime, simTime);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  if (++frameCount % 10 === 0) {
    orderValEl.textContent = Gamma.toFixed(0) + (Gamma > 1 ? ' ↻' : Gamma < -1 ? ' ↺' : '');
  }
}
requestAnimationFrame(loop);
</script>
</body>
