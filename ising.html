<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISING — AI.ART</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#ui{
  position:fixed;bottom:1.6rem;left:50%;transform:translateX(-50%);
  display:flex;gap:2.4rem;align-items:baseline;
  font-family:'Courier New',monospace;
  pointer-events:none;user-select:none;
  text-align:center;
}
#modeName{
  font-size:10px;letter-spacing:.42em;text-transform:uppercase;
  color:rgba(255,255,255,.35);
}
#desc{
  font-size:9px;letter-spacing:.28em;text-transform:uppercase;
  color:rgba(255,255,255,.13);
}
#back{
  position:fixed;top:1.4rem;left:1.6rem;
  font-family:'Courier New',monospace;font-size:9px;
  letter-spacing:.3em;text-transform:uppercase;
  color:rgba(255,255,255,.2);text-decoration:none;
  transition:color .25s;
}
#back:hover{color:rgba(255,255,255,.6)}
#order{
  position:fixed;top:1.4rem;right:1.6rem;
  font-family:'Courier New',monospace;font-size:9px;
  letter-spacing:.24em;text-transform:uppercase;text-align:right;
  color:rgba(255,255,255,.22);
  pointer-events:none;user-select:none;
}
#order .val{color:rgba(255,255,255,.45)}
</style>
</head>
<body>
<a id="back" href="index.html">← AI.ART</a>
<canvas id="c"></canvas>
<div id="order"><span id="orderLabel">M = </span><span class="val" id="orderVal">—</span></div>
<div id="ui">
  <span id="modeName">FERROMAGNET</span>
  <span id="desc">CURIE · T &lt; Tc · ORDERED</span>
</div>
<script>
/*  ISING — the 2D lattice-spin model of ferromagnetism
 *
 *  Ernst Ising solved the 1D chain in his 1924 thesis (and, misleadingly,
 *  found NO phase transition there); the 2D square-lattice version he
 *  named for does have one, exactly solved in closed form by Lars Onsager
 *  in 1944 — one of the most celebrated exact results in statistical
 *  mechanics. Every site holds a spin s = +/-1; neighboring spins prefer
 *  to align (ferromagnetic coupling J); the system is held at a bath
 *  temperature T. Below a critical Tc the spins spontaneously agree over
 *  macroscopic distances (magnetized); above Tc thermal noise wins and
 *  the lattice is a patternless flicker; AT Tc, domains of every size
 *  coexist at once — the same scale-invariant "critical opalescence"
 *  seen at the liquid-gas critical point, in binary alloys, and (this
 *  gallery's own SANDPILE) neuronal/earthquake/avalanche statistics.
 *
 *  Why this piece is architecturally different: every earlier piece in
 *  the gallery is DETERMINISTIC given its random seed — a PDE Laplacian,
 *  a toppling threshold, a force law, a closed-form wave sum. This is
 *  the first STOCHASTIC update rule: whether a spin flips is decided by
 *  a Boltzmann-weighted coin flip (Metropolis, 1953) against the local
 *  energy change, not by any smooth or threshold function of the state.
 *  It is also the first piece needing a CHECKERBOARD (red-black)
 *  sublattice decomposition rather than a single synchronous update —
 *  see the tuning trap below, a genuinely new GPU-simulation technique
 *  for this gallery.
 *
 *  State lives in a ping-ponged float texture exactly like MEMBRANE/
 *  LENIA/EXCITABLE/SANDPILE (R = spin, G = a decaying "just flipped"
 *  flash), but two draw calls per sweep update disjoint halves of the
 *  lattice (see below) instead of one pass updating everything at once.
 *
 *  5 modes reuse the identical Metropolis rule with different coupling
 *  sign, bond disorder, and temperature — the same "one engine, different
 *  constants" economy as CHLADNI's mode numbers or SANDPILE's drive
 *  geometry — each one a real, separately-named phenomenon in the
 *  Ising literature.
 */

const C = document.getElementById('c');
const modeNameEl = document.getElementById('modeName');
const descEl = document.getElementById('desc');
const orderLabelEl = document.getElementById('orderLabel');
const orderValEl = document.getElementById('orderVal');
const gl = C.getContext('webgl') || C.getContext('experimental-webgl');
if (!gl) fatal('WebGL unavailable');
if (!gl.getExtension('OES_texture_float')) fatal('Float textures unavailable');
const colorBufferFloatExt = gl.getExtension('WEBGL_color_buffer_float');

function fatal(m) {
  document.body.innerHTML = '<p style="color:#fff;padding:2.5em;font:14px monospace">' + m + '</p>';
  throw m;
}

/* ── GLSL ──────────────────────────────────────────────── */
const VS = `
attribute vec2 p;
varying vec2 uv;
void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;

const N_PULSES = 6;

/* One Metropolis sub-sweep: updates ONLY the sites whose (x+y) parity
   matches 'parity', reading the OTHER parity's spins (which are stable
   this pass) as fixed neighbors. Two passes — parity 0 then parity 1,
   each ping-ponging into the other buffer — make one full sweep where
   every site gets exactly one flip attempt. This checkerboard split is
   required: a naive single pass that reads and writes the whole lattice
   at once lets two adjacent spins each decide to flip "at the same time"
   based on each other's PRE-flip value, which can synchronize the whole
   lattice into a flickering checkerboard artifact that never actually
   relaxes (a well-known pitfall in parallel Ising/Monte Carlo codes) —
   see the write-up in memories.txt from this session. */
const SIM = `
precision highp float;
uniform sampler2D tex;
uniform vec2 res;
uniform float parity;
uniform float T;
uniform float Jsign;
uniform float glass;
uniform float seed;
uniform float time;
uniform vec2 bondSeed;
uniform float extH;
uniform float extHStag;
uniform vec2 pulseP[${N_PULSES}];
uniform float pulseT[${N_PULSES}];
varying vec2 uv;

float hash2(vec3 p){ return fract(sin(dot(p, vec3(127.1,311.7,74.7))) * 43758.5453123); }

/* Quenched (time-independent) bond sign: uniform +/-Jsign everywhere for
   the clean ferro/antiferro modes, or a fixed-per-edge random +/-1 for
   the spin-glass mode (Edwards-Anderson) — same disorder every sweep,
   only spins evolve. 'axis' (0=horizontal,1=vertical) keeps horizontal
   and vertical bonds sharing the same midpoint key from colliding. */
float bondSign(vec2 key, float axis){
  if (glass < 0.5) return Jsign;
  return hash2(vec3(key + bondSeed, axis)) < 0.5 ? -1.0 : 1.0;
}

void main(){
  vec2 cell = floor(uv * res);
  float par = mod(cell.x + cell.y, 2.0);
  vec4 self = texture2D(tex, uv);
  float s = self.r;
  float flash = self.g * 0.80;

  if (abs(par - parity) > 0.5) {
    gl_FragColor = vec4(s, flash, 0.0, 1.0);
    return;
  }

  vec2 d = 1.0 / res;
  float sR = texture2D(tex, fract(uv + vec2(d.x, 0.0))).r;
  float sL = texture2D(tex, fract(uv - vec2(d.x, 0.0))).r;
  float sU = texture2D(tex, fract(uv + vec2(0.0, d.y))).r;
  float sD = texture2D(tex, fract(uv - vec2(0.0, d.y))).r;

  float jR = bondSign(vec2(cell.x + 0.5, cell.y), 0.0);
  float jL = bondSign(vec2(cell.x - 0.5, cell.y), 0.0);
  float jU = bondSign(vec2(cell.x, cell.y + 0.5), 1.0);
  float jD = bondSign(vec2(cell.x, cell.y - 0.5), 1.0);

  float field = jR * sR + jL * sL + jU * sU + jD * sD;

  /* A vanishingly weak, uniform symmetry-breaking field — real magnets
     are "field-cooled" through Tc for exactly this reason (see the
     domain-pinning trap in memories.txt). Without it, a periodic torus
     quenched from random noise settles into a FEW large domains whose
     flat shared walls have zero curvature and barely move, so the
     lattice looks locally perfectly ordered while the naive mean
     magnetization stays pinned near zero indefinitely. extHStag flips
     the field's sign every other site (checkerboard pattern) so the
     same trick also selects one of the two equivalent Neel sublattice
     assignments for ANTIFERROMAGNET. */
  float stag = (mod(cell.x + cell.y, 2.0) < 0.5) ? 1.0 : -1.0;
  field += extH * (extHStag > 0.5 ? stag : 1.0);

  /* click/touch: a localized decaying external field nucleates a +1
     domain — same "pure function of elapsed time" ring-buffer pattern
     as every earlier piece's strike/ripple/spark interaction. Whether
     the nucleus survives or dissolves back into the bath is real physics
     (below Tc it grows, above Tc it melts), not scripted. */
  for (int i = 0; i < ${N_PULSES}; i++) {
    float age = time - pulseT[i];
    if (age > 0.0 && age < 3.0) {
      float r = length(uv - pulseP[i]);
      float w = exp(-age * 1.3) * exp(-r * r * 180.0);
      field += 6.0 * w;
    }
  }

  float dE = 2.0 * s * field;
  float prob = exp(-dE / max(T, 0.01));
  /* 'seed' MUST stay small — sin(dot(p, ...)) loses so much precision once
     its argument reaches the tens-of-thousands range (float32 can't hold
     enough mantissa bits to resolve a phase mod 2*pi) that the "random"
     output stops being random and drifts toward a fixed biased value.
     An earlier build fed a seed that grew by a fixed increment every pass
     for the whole page's lifetime — invisible in a short test, but over a
     sustained real run (this is a piece meant to play indefinitely) the
     lattice quietly drifted toward all-one-spin even in PARAMAGNET, no
     console error, no visual glitch until you compared histograms across
     runs of different lengths. Keeping seed wrapped into a small range
     (see the JS-side mod below) keeps the hash argument in the same safe
     regime this gallery's other pieces already use for grid coordinates. */
  float rnd = hash2(vec3(cell, seed));
  bool doFlip = (dE <= 0.0) || (rnd < prob);
  float sNew = doFlip ? -s : s;
  float flashNew = doFlip ? 1.0 : flash;

  gl_FragColor = vec4(sNew, flashNew, 0.0, 1.0);
}`;

const RENDER = `
precision highp float;
uniform sampler2D tex;
uniform vec3 colUp;
uniform vec3 colDown;
varying vec2 uv;
void main(){
  vec4 s = texture2D(tex, uv);
  float t = s.r * 0.5 + 0.5;
  vec3 col = mix(colDown, colUp, t);
  col += vec3(1.0, 0.95, 0.85) * s.g * 0.35;
  float vign = 1.0 - 0.35 * pow(length(uv - 0.5) * 1.5, 2.0);
  col *= vign;
  gl_FragColor = vec4(col, 1.0);
}`;

/* ── GL helpers ───────────────────────────────────────── */
function sh(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
function mkProg(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  return p;
}

const SP = mkProg(VS, SIM);
const RP = mkProg(VS, RENDER);

const qb = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, qb);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
function bindP(prog) {
  const a = gl.getAttribLocation(prog, 'p');
  gl.bindBuffer(gl.ARRAY_BUFFER, qb);
  gl.enableVertexAttribArray(a);
  gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
}
const u = (prog, name) => gl.getUniformLocation(prog, name);

/* ── Ping-pong buffers ───────────────────────────────── */
let W, H, tx = [], fb = [], ping = 0, readBuf = null;

function initSim() {
  W = C.width; H = C.height;
  const MX = 320;
  if (W > MX || H > MX) { const sc = MX / Math.max(W, H); W = Math.max(2, W * sc | 0); H = Math.max(2, H * sc | 0); }

  tx.forEach(t => gl.deleteTexture(t));
  fb.forEach(f => gl.deleteFramebuffer(f));
  tx = []; fb = [];

  const dat = randomSpins();
  for (let i = 0; i < 2; i++) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.FLOAT, i === 0 ? dat : null);
    tx.push(t);
    const f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    fb.push(f);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  ping = 0;
  readBuf = new Float32Array(W * H * 4);
}

function randomSpins() {
  const dat = new Float32Array(W * H * 4);
  for (let i = 0; i < W * H; i++) dat[i*4] = Math.random() < 0.5 ? -1 : 1;
  return dat;
}

function reseed() {
  const dat = randomSpins();
  gl.bindTexture(gl.TEXTURE_2D, tx[0]);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.FLOAT, dat);
  gl.bindTexture(gl.TEXTURE_2D, tx[1]);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.FLOAT, dat);
  ping = 0;
}

/* ── Modes ──────────────────────────────────────────────
   Onsager's 1944 exact solution gives the critical temperature of the
   2D square-lattice Ising model in closed form: Tc = 2/ln(1+sqrt(2)).
   Unlike SANDPILE's self-organized criticality — which tunes ITSELF to
   the critical point with no external knob — this system must be dialed
   to Tc by hand from outside; the two pieces demonstrate opposite routes
   to the same scale-invariant mathematics. */
const TC = 2 / Math.log(1 + Math.sqrt(2)); // ~2.269

const MODES = [
  { name: 'FERROMAGNET',    desc: 'CURIE POINT · T &lt; Tc · ORDERED',
    Jsign: 1, glass: 0, T: 1.6,  staggered: false, sweeps: 5, extH: 0.06, extHStag: 0,
    colUp: [1.00, 0.62, 0.18], colDown: [0.02, 0.02, 0.05] },
  { name: 'CRITICAL',       desc: 'ONSAGER EXACT SOLUTION · 1944',
    Jsign: 1, glass: 0, T: TC,  staggered: false, sweeps: 9, extH: 0, extHStag: 0,
    colUp: [1.00, 0.95, 0.85], colDown: [0.04, 0.01, 0.07] },
  { name: 'PARAMAGNET',     desc: 'T &gt; Tc · DISORDERED',
    Jsign: 1, glass: 0, T: 4.5,  staggered: false, sweeps: 5, extH: 0, extHStag: 0,
    colUp: [0.35, 0.65, 0.95], colDown: [0.02, 0.03, 0.09] },
  { name: 'ANTIFERROMAGNET', desc: 'NÉEL ORDER · 1936',
    Jsign: -1, glass: 0, T: 1.6, staggered: true, sweeps: 5, extH: 0.06, extHStag: 1,
    colUp: [0.85, 0.25, 0.55], colDown: [0.02, 0.09, 0.08] },
  { name: 'SPIN GLASS',     desc: 'EDWARDS-ANDERSON · FROZEN FRUSTRATION',
    Jsign: 1, glass: 1, T: 1.0,  staggered: false, sweeps: 5, extH: 0, extHStag: 0,
    colUp: [0.65, 0.85, 0.25], colDown: [0.06, 0.02, 0.09] },
];
const HOLD = 32 * 60;
let mi = 0, mt = 0;
const bondSeed = [Math.random() * 1000, Math.random() * 1000];

function applyMode(idx) {
  mi = idx;
  const m = MODES[mi];
  modeNameEl.textContent = m.name;
  descEl.innerHTML = m.desc;
  orderLabelEl.textContent = m.staggered ? 'M(stag) = ' : 'M = ';
  reseed();
}
applyMode(0);

function switchMode() { applyMode((mi + 1) % MODES.length); }

/* ── Input: click/touch drops a nucleating field pulse ─── */
const pulseP = new Float32Array(N_PULSES * 2);
const pulseT = new Float32Array(N_PULSES).fill(-1000);
let pulseIdx = 0;
const t0 = performance.now();

function pulseAt(cx, cy) {
  const b = C.getBoundingClientRect();
  const x = (cx - b.left) / b.width;
  const y = 1.0 - (cy - b.top) / b.height;
  pulseP[pulseIdx*2] = x; pulseP[pulseIdx*2+1] = y;
  pulseT[pulseIdx] = (performance.now() - t0) / 1000;
  pulseIdx = (pulseIdx + 1) % N_PULSES;
}
C.addEventListener('mousedown', e => pulseAt(e.clientX, e.clientY));
C.addEventListener('touchstart', e => { e.preventDefault(); pulseAt(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });

/* ── Resize ─────────────────────────────────────────── */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  C.width  = window.innerWidth  * dpr | 0;
  C.height = window.innerHeight * dpr | 0;
  C.style.width  = window.innerWidth  + 'px';
  C.style.height = window.innerHeight + 'px';
  initSim();
}
window.addEventListener('resize', resize);
resize();

/* ── Live order parameter ───────────────────────────────
   Plain mean magnetization M = |mean(s)| correctly reads ~0.9+ for
   FERROMAGNET and ~0 for PARAMAGNET/CRITICAL/SPIN GLASS, but is WRONG
   for ANTIFERROMAGNET: a perfect Néel checkerboard has exactly as many
   up as down spins, so raw M reads ~0 even in the fully ordered state.
   The honest fix (not a shortcut) is the staggered magnetization
   M(stag) = |mean(s_i * (-1)^(x+y))|, which reads ~0.9+ for a clean
   Néel lattice — the same "the obvious readout can't see this state"
   lesson SWARMALATOR's order parameter R hit for its phase-wave ring. */
let orderReadOk = colorBufferFloatExt !== null;
let frameCount = 0;

function readOrderParam() {
  if (!orderReadOk) return;
  try {
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb[ping]);
    if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) { orderReadOk = false; return; }
    gl.readPixels(0, 0, W, H, gl.RGBA, gl.FLOAT, readBuf);
  } catch (e) { orderReadOk = false; return; }
  const staggered = MODES[mi].staggered;
  let sum = 0;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const s = readBuf[(y*W + x)*4];
      sum += staggered ? s * (((x + y) & 1) ? -1 : 1) : s;
    }
  }
  const m = Math.abs(sum / (W*H));
  orderValEl.textContent = m.toFixed(2);
}

/* ── Main loop ──────────────────────────────────────── */
let simSeed = 0;
(function loop() {
  requestAnimationFrame(loop);

  if (++mt > HOLD) { mt = 0; switchMode(); }

  const m = MODES[mi];
  const tSec = (performance.now() - t0) / 1000;

  gl.useProgram(SP); bindP(SP);
  gl.viewport(0, 0, W, H);
  gl.uniform2f(u(SP,'res'), W, H);
  gl.uniform1f(u(SP,'T'), m.T);
  gl.uniform1f(u(SP,'Jsign'), m.Jsign);
  gl.uniform1f(u(SP,'glass'), m.glass);
  gl.uniform1f(u(SP,'extH'), m.extH);
  gl.uniform1f(u(SP,'extHStag'), m.extHStag);
  gl.uniform2f(u(SP,'bondSeed'), bondSeed[0], bondSeed[1]);
  gl.uniform1f(u(SP,'time'), tSec);
  gl.uniform2fv(u(SP,'pulseP'), pulseP);
  gl.uniform1fv(u(SP,'pulseT'), pulseT);
  gl.uniform1i(u(SP,'tex'), 0);

  for (let sweep = 0; sweep < m.sweeps; sweep++) {
    for (let parity = 0; parity < 2; parity++) {
      const pong = 1 - ping;
      gl.uniform1f(u(SP,'parity'), parity);
      gl.uniform1f(u(SP,'seed'), (simSeed = (simSeed + 1.0) % 479));
      gl.bindFramebuffer(gl.FRAMEBUFFER, fb[pong]);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, tx[ping]);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      ping = pong;
    }
  }

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, C.width, C.height);
  gl.useProgram(RP); bindP(RP);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tx[ping]);
  gl.uniform1i(u(RP,'tex'), 0);
  gl.uniform3fv(u(RP,'colUp'), m.colUp);
  gl.uniform3fv(u(RP,'colDown'), m.colDown);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  if (++frameCount % 20 === 0) readOrderParam();
})();
</script>
</body>
</html>
