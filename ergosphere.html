<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERGOSPHERE — AI.ART</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%}
#ui{
  position:fixed;bottom:1.6rem;left:50%;transform:translateX(-50%);
  display:flex;gap:2.4rem;align-items:baseline;
  font-family:'Courier New',monospace;
  pointer-events:none;user-select:none;
  text-align:center;
}
#modeName{
  font-size:10px;letter-spacing:.42em;text-transform:uppercase;
  color:rgba(255,255,255,.35);
}
#desc{
  font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.13);
}
#back{
  position:fixed;top:1.4rem;left:1.6rem;
  font-family:'Courier New',monospace;font-size:9px;
  letter-spacing:.3em;text-transform:uppercase;
  color:rgba(255,255,255,.2);text-decoration:none;
  transition:color .25s;
}
#back:hover{color:rgba(255,255,255,.6)}
#stat{
  position:fixed;top:1.4rem;right:1.6rem;
  font-family:'Courier New',monospace;font-size:9px;
  letter-spacing:.2em;text-transform:uppercase;text-align:right;
  color:rgba(255,255,255,.22);
  pointer-events:none;user-select:none;
  line-height:1.9;
}
#stat .val{color:rgba(255,255,255,.55)}
#stat .super{color:rgb(255,150,70)}
#stat .normal{color:rgb(90,170,235)}
#stat .sub{display:block;margin-top:.4em;font-size:8px;opacity:.75}
#hint{
  position:fixed;bottom:1.6rem;right:1.6rem;
  font-family:'Courier New',monospace;font-size:8px;
  letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.14);
  pointer-events:none;user-select:none;
}
@media (max-width:480px){
  #ui{max-width:84vw}
  #hint{display:none}
}
</style>
</head>
<body>
<a id="back" href="index.html">← AI.ART</a>
<canvas id="c"></canvas>
<div id="stat">
  <span id="statLabel">&Omega; </span><span class="val" id="statVal">0.0</span>
  <span class="sub" id="statSub">&omega; 0.0 &middot; m 1 &middot; NORMAL</span>
</div>
<div id="ui">
  <span id="modeName">RING</span>
  <span id="desc">NO PART OF THIS DEVICE MOVES</span>
</div>
<div id="hint">drag: set &omega; (x) &amp; &Omega; (y) &middot; tap: change mode</div>
<script>
/*  ERGOSPHERE — extracting energy from a ring that never turns
 *
 *  Roger Penrose showed in 1969 that a particle dropped into a rotating
 *  black hole's ergosphere can split in two, one half falling in, the
 *  other escaping with MORE energy than it arrived with -- the hole's own
 *  rotational energy pays the difference. Yakov Zel'dovich (1971) found
 *  the same trick works for ordinary waves off ordinary rotating matter:
 *  a wave scattering off a rotating, absorbing body is not absorbed but
 *  AMPLIFIED whenever its frequency undercuts the body's own rotation
 *  rate. Misner (1972) carried the argument to gravitational waves off a
 *  Kerr black hole and the phenomenon became known as "superradiance" --
 *  the wave-mechanical cousin of the Penrose process.
 *
 *  On 8 July 2026, Nasari, Moussa, Kasahara, Thielens & Alù ("Observation
 *  of Floquet rotational super-radiance," Nature, DOI
 *  10.1038/s41586-026-10725-y, CUNY Advanced Science Research Center)
 *  reported the first clean observation of exactly this, and sidestepped
 *  the experiment's oldest obstacle -- no real object can be spun fast
 *  enough by hand to satisfy the amplification condition at an accessible
 *  wave frequency. Their device never turns at all. It is a stationary
 *  ring of electronic resonators whose properties are modulated in a
 *  travelling, timed sequence -- a pattern that sweeps around the ring
 *  in TIME rather than the ring itself moving in SPACE. An electromagnetic
 *  wave scattering off that ring cannot tell the difference: it responds
 *  exactly as if the ring were physically spinning, at a rate limited
 *  only by the modulation electronics, not by inertia or material
 *  strength. Their measured result: 7.8 dB of power gain (~6x), with
 *  nothing moving. This session's web wander surfaced it via ScienceDaily
 *  and EurekAlert's July 2026 coverage; the Nature article itself sits
 *  behind a login wall this session could not get past (WebFetch redirected
 *  to an authentication page), and no arXiv preprint was found, so none of
 *  the paper's own circuit equations, resonator count, or modulation
 *  frequency reached this session -- everything below is this session's
 *  OWN reconstruction of the general theory the experiment demonstrates,
 *  not a transcription of the paper's specific numbers. The 7.8 dB figure
 *  above is the one hard number this session's wander did surface (via
 *  press coverage, not the paper) and is NOT what this piece's own
 *  gamma/kappa choice below reproduces.
 *
 *  ── The physics actually implemented here, derived from scratch ───────
 *  Consider any object that is a perfectly ordinary, passive absorber --
 *  it can only ever soak up energy, never spontaneously emit it -- in the
 *  frame that co-rotates with its own modulation pattern at rate Omega.
 *  A wave of lab-frame frequency omega and azimuthal number m (m
 *  wavefronts arranged around the ring) looks, in that co-rotating frame,
 *  like a wave of frequency omega' = omega - m*Omega (an ordinary Doppler
 *  shift for going into a rotating frame). Energy and wave-action flux are
 *  related by E = omega * N in any one frame, and N itself (the flux of
 *  wave quanta) is the same number in both frames, since relabelling lab
 *  time/angle as co-rotating time/angle is just a phase change and does
 *  not touch the field's amplitude. So the energy ABSORBED by the ring,
 *  measured in its own frame where it is honestly passive, is
 *      E'_abs = omega' * (1 - |R|^2) * N_in   ,   R = amplitude reflection
 *  and passivity demands E'_abs >= 0 (matter can't hand back more than it
 *  receives, in its own rest frame). When omega' > 0 that forces the
 *  ordinary result |R|^2 <= 1 (partial absorption). But when omega' < 0 --
 *  i.e. omega < m*Omega, the ring's synthetic spin outrunning the wave --
 *  the SAME inequality forces |R|^2 >= 1: amplification, not absorption.
 *  This is Zel'dovich's argument, stripped to its model-independent core
 *  (matches the derivations in Bekenstein & Schiffer, "The many faces of
 *  superradiance," Phys. Rev. D 58, 064014, 1998, and Brito, Cardoso &
 *  Pani, "Superradiance," Lecture Notes in Physics 906, 2015) -- it says
 *  nothing about HOW MUCH amplification, only that the sign must flip
 *  exactly at omega = m*Omega. That crossing is drawn as a real line on
 *  GAIN mode's own heatmap, not just implied.
 *
 *  For an actual number, this piece supplies its OWN closed form for the
 *  ring's absorptivity as a function of the co-rotating frequency
 *  omega' = omega-m*Omega:
 *      A(omega') = gamma * omega' / (omega'^2 + kappa^2)      [kappa=0.9, gamma=2*kappa]
 *      |R(omega,m,Omega)|^2 = 1 - A(omega - m*Omega)
 *  chosen because the dissipative part of ANY causal linear passive
 *  response is required (Kramers-Kronig) to be an ODD function of
 *  frequency, and this is the simplest odd, single-peaked shape with that
 *  property -- not a fit to the real device, which this session never saw.
 *  gamma=2*kappa was picked so |R|^2 ranges over exactly [0,2] (peak
 *  2x/-3dB power gain), a round illustrative number, NOT the paper's own
 *  measured 7.8 dB/~6x. Verified in Node before any shader code
 *  (verify.js, this session's scratchpad, not committed): A(x) is odd to
 *  machine precision; its extremum sits at x=+-kappa with value
 *  gamma/(2*kappa) exactly; |R|^2 stays within [0,2] over a wide sweep;
 *  |R|^2=1 exactly at omega=m*Omega for several (omega,m,Omega) triples;
 *  sign(1-|R|^2) matches sign(omega-m*Omega) over 20,000 random samples
 *  with zero violations; the superradiant condition omega<m*Omega gives
 *  |R|^2>1 in all 922 sampled cases and the normal condition omega>m*Omega
 *  gives |R|^2<1 in all 758 sampled cases, across m=1..4.
 *
 *  SCATTER mode renders the resulting field as an explicit steady-state
 *  superposition of incoming and outgoing 2D cylindrical waves, using
 *  their standard large-argument (far-field) asymptotic form -- amplitude
 *  falling as 1/sqrt(kr), the two branches sharing the same m*phi-omega*t
 *  envelope:
 *      eta(r,phi,t) = Re[ (exp(-ikr) + R*exp(+ikr)) * exp(i(m*phi-omega*t)) ] / sqrt(kr)
 *  with R taken as the real, non-negative sqrt(|R|^2) derived above. The
 *  passivity argument fixes only the MAGNITUDE |R|; it says nothing about
 *  R's phase, which this piece locks to zero -- a disclosed simplification,
 *  not a claim about any real device's phase response. This is a
 *  steady-state analytic construction, not a time-stepped PDE, so the
 *  rendered field is exact given the formula above; the near-field
 *  structure actually AT the ring (r close to R0) is not modeled at all,
 *  only the far-field asymptotic form, applied uniformly for all r>R0.
 *
 *  Three modes, one shared 2D drag cursor (omega horizontal, Omega
 *  vertical) and one auto-cycling integer m (1..4, changing every 8s,
 *  the ring's own azimuthal wavefront count):
 *   RING    the mechanism itself -- N stationary segments, a brightness
 *           pattern with m lobes sweeping around them at rate Omega. No
 *           segment moves; only the PATTERN travels.
 *   GAIN    |R(omega,m,Omega)|^2 as a live 2D heatmap, the omega=m*Omega
 *           threshold drawn as an explicit line, current (omega,Omega)
 *           marked live.
 *   SCATTER the consequence: an incident wave meeting the ring, its
 *           reflected rings visibly brighter than the incoming ones
 *           whenever the drag point sits in the superradiant half-plane.
 *
 *  ── Honest gaps ─────────────────────────────────────────────────────
 *  Real superradiant scattering (Zel'dovich's rotating cylinder, or a Kerr
 *  black hole) also requires the WAVE to actually have angular momentum
 *  matched in sign to the rotation, which this piece's m>0-only convention
 *  already builds in (negative Omega, spinning the "wrong way," never
 *  crosses omega<m*Omega here since omega>0 always) -- a real, not merely
 *  cosmetic, consequence of the formula, not a separate rule bolted on.
 *  Nothing here reproduces the paper's actual multi-resonator circuit
 *  dynamics, its 7.8 dB measured gain, or its real modulation frequency;
 *  see the paywall note above.
 */

const C = document.getElementById('c');
const modeNameEl = document.getElementById('modeName');
const descEl = document.getElementById('desc');
const statLabelEl = document.getElementById('statLabel');
const statValEl = document.getElementById('statVal');
const statSubEl = document.getElementById('statSub');
const gl = C.getContext('webgl') || C.getContext('experimental-webgl');
if (!gl) fatal('WebGL unavailable');
function fatal(m) {
  document.body.innerHTML = '<p style="color:#fff;padding:2.5em;font:14px monospace">' + m + '</p>';
  throw m;
}

/* ── shared parameter ranges ─────────────────────────────── */
const OMEGA_MIN = 0.4, OMEGA_MAX = 6.0;
const ROT_MIN = -3.0, ROT_MAX = 3.0;
const M_SEQ = [1, 2, 3, 4];
const M_HOLD = 8000;

const VS = `
attribute vec2 p;
varying vec2 vUv;
void main(){ vUv = p*0.5+0.5; gl_Position = vec4(p,0.0,1.0); }`;

const FS = `
precision highp float;
varying vec2 vUv;
uniform vec2 uLetterboxScale;
uniform int uMode;
uniform float uTime;
uniform float uOmega, uOmegaRot, uM;
uniform float uDragX, uDragY;
#define PI 3.14159265359
#define TWOPI 6.28318530718
#define OMEGA_MIN ${OMEGA_MIN.toFixed(3)}
#define OMEGA_MAX ${OMEGA_MAX.toFixed(3)}
#define ROT_MIN ${ROT_MIN.toFixed(3)}
#define ROT_MAX ${ROT_MAX.toFixed(3)}
#define KAPPA 0.9
#define GAMMA 1.8
#define R0 1.6
#define VIEWR 8.5
#define CWAVE 0.55

float superR2(float omega, float m, float Omega){
  float x = omega - m*Omega;
  float Aabs = GAMMA*x/(x*x+KAPPA*KAPPA);
  return 1.0 - Aabs;
}

vec3 diverge(float t){
  t = clamp(t, -1.0, 1.0);
  vec3 neg = vec3(0.22,0.47,0.95);
  vec3 pos = vec3(1.00,0.55,0.14);
  vec3 zero = vec3(0.035,0.035,0.05);
  return t < 0.0 ? mix(zero, neg, -t) : mix(zero, pos, t);
}

vec3 ringScene(vec2 pos, float m, float Omega, float t){
  float r = length(pos);
  float phi = atan(pos.y, pos.x);
  float ringR = 2.6;
  float nSeg = 40.0;
  float u = (phi+PI)/TWOPI*nSeg;
  float segIdx = floor(u);
  float segCenter = (segIdx+0.5)/nSeg*TWOPI - PI;
  float gapMask = smoothstep(0.5,0.38,abs(fract(u)-0.5));

  float band = smoothstep(0.34,0.0,abs(r-ringR)) * gapMask;
  float lobe = 0.5 + 0.5*cos(m*segCenter - m*Omega*t);
  float bright = pow(lobe, 3.5);
  vec3 col = vec3(0.04,0.04,0.055);
  col += vec3(1.0,0.62,0.22) * band * bright * 1.7;
  col += vec3(0.18,0.15,0.26) * band * (0.05+0.22*(1.0-bright));
  float hub = smoothstep(0.5,0.0,r);
  col += vec3(0.08,0.08,0.11) * hub;
  float vign = smoothstep(VIEWR*1.15, VIEWR*0.15, r);
  return col * (0.25+0.75*vign);
}

vec3 gainScene(vec2 uv, float m){
  float omega = OMEGA_MIN + uv.x*(OMEGA_MAX-OMEGA_MIN);
  float Omega = ROT_MIN + uv.y*(ROT_MAX-ROT_MIN);
  float r2 = superR2(omega, m, Omega);
  vec3 col = diverge(r2-1.0);

  float OmegaThr = omega/m;
  float yThr = (OmegaThr-ROT_MIN)/(ROT_MAX-ROT_MIN);
  float lineD = abs(uv.y-yThr);
  col = mix(col, vec3(1.0), smoothstep(0.0035,0.0,lineD)*0.85);

  float zeroY = (0.0-ROT_MIN)/(ROT_MAX-ROT_MIN);
  col = mix(col, vec3(1.0), smoothstep(0.0015,0.0,abs(uv.y-zeroY))*0.18);

  vec2 mark = vec2(uDragX, uDragY);
  float dMark = length((uv-mark)/vec2(1.0,1.0)*vec2(1.0));
  float ring = smoothstep(0.011,0.014,dMark) - smoothstep(0.014,0.017,dMark);
  col += vec3(1.0) * ring;
  return col;
}

vec3 scatterScene(vec2 pos, float omega, float m, float Omega, float t){
  float r = length(pos);
  float phi = atan(pos.y, pos.x);
  float r2 = clamp(superR2(omega,m,Omega), 0.0, 2.5);
  float Rmag = sqrt(r2);

  if (r < R0){
    float band = smoothstep(0.30,0.0, abs(r-R0*0.9));
    float lobe = 0.5+0.5*cos(m*phi - m*Omega*t*0.6);
    vec3 col = vec3(0.04,0.04,0.055);
    col += vec3(1.0,0.6,0.2) * band * pow(lobe,1.6) * 1.1;
    return col;
  }

  float k = omega / CWAVE;
  float ang = m*phi - omega*t*0.6;
  float phaseIn = -k*r, phaseOut = k*r;
  float reIn = cos(phaseIn), imIn = sin(phaseIn);
  float reOut = Rmag*cos(phaseOut), imOut = Rmag*sin(phaseOut);
  float reSum = reIn+reOut, imSum = imIn+imOut;
  float ca = cos(ang), sa = sin(ang);
  float field = (reSum*ca - imSum*sa) / sqrt(max(k*r,0.05));

  vec3 col = diverge(field*1.6);
  float vign = smoothstep(VIEWR*1.12, VIEWR*0.12, r);
  float rim = smoothstep(0.05,0.0, abs(r-R0));
  col += vec3(1.0,0.85,0.6) * rim * 0.5;
  return col * (0.18+0.82*vign);
}

void main(){
  vec2 uv = (vUv - 0.5) / uLetterboxScale + 0.5;
  vec3 col;
  if (uMode == 0){
    vec2 pos = (uv-0.5) * 2.0 * VIEWR;
    col = ringScene(pos, uM, uOmegaRot, uTime);
  } else if (uMode == 1){
    col = gainScene(clamp(uv,0.0,1.0), uM);
  } else {
    vec2 pos = (uv-0.5) * 2.0 * VIEWR;
    col = scatterScene(pos, uOmega, uM, uOmegaRot, uTime);
  }
  gl_FragColor = vec4(col, 1.0);
}`;

function sh(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
function mkProg(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  return p;
}
const prog = mkProg(VS, FS);
const U = {};
['uLetterboxScale','uMode','uTime','uOmega','uOmegaRot','uM','uDragX','uDragY']
  .forEach(n => U[n] = gl.getUniformLocation(prog, n));

const qb = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, qb);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const pLoc = gl.getAttribLocation(prog, 'p');

/* ── modes ────────────────────────────────────────────── */
const MODES = [
  { name: 'RING', desc: 'NO PART OF THIS DEVICE MOVES' },
  { name: 'GAIN', desc: '|R|² OVER (ω, Ω) — THE THRESHOLD IS A LINE' },
  { name: 'SCATTER', desc: 'WATCH THE OUTGOING RINGS AGAINST THE INCOMING ONES' },
];
let modeIdx = 0;
let dragOmega = 1.4, dragRot = 2.0;
let mIdx = 1, mLastSwitch = 0;

function applyMode(idx) {
  modeIdx = ((idx % MODES.length) + MODES.length) % MODES.length;
  modeNameEl.textContent = MODES[modeIdx].name;
  descEl.textContent = MODES[modeIdx].desc;
}
applyMode(0);

function currentM() { return M_SEQ[mIdx]; }

function updateStat() {
  const m = currentM();
  const x = dragOmega - m*dragRot;
  const kappa = 0.9, gamma = 1.8;
  const r2 = 1 - gamma*x/(x*x+kappa*kappa);
  const superradiant = dragOmega < m*dragRot;
  statLabelEl.textContent = 'Ω ';
  statValEl.textContent = dragRot.toFixed(2);
  statValEl.className = 'val ' + (superradiant ? 'super' : 'normal');
  statSubEl.innerHTML = 'ω ' + dragOmega.toFixed(2) + ' &middot; m ' + m +
    ' &middot; |R|² ' + r2.toFixed(2) + ' &middot; ' + (superradiant ? 'SUPERRADIANT' : 'NORMAL');
}
updateStat();

/* ── interaction: drag sets (omega, Omega); tap advances mode ── */
let letterboxScale = [1, 1];
let dragging = false, dragged = false, downXY = {x:0,y:0};
function xyFromEvent(e){ const t = e.touches ? e.touches[0] : e; return {x:t.clientX,y:t.clientY}; }
function applyDrag(x, y) {
  const fx = Math.min(1, Math.max(0, x / window.innerWidth));
  const fy = Math.min(1, Math.max(0, 1 - y / window.innerHeight));
  dragOmega = OMEGA_MIN + fx*(OMEGA_MAX-OMEGA_MIN);
  dragRot = ROT_MIN + fy*(ROT_MAX-ROT_MIN);
  updateStat();
}
function onDown(e){ const p = xyFromEvent(e); downXY = p; dragging = true; dragged = false; }
function onMove(e){
  if (!dragging) return;
  const p = xyFromEvent(e);
  if (Math.hypot(p.x-downXY.x, p.y-downXY.y) > 6) dragged = true;
  if (dragged) applyDrag(p.x, p.y);
}
function onUp(){ if (dragging && !dragged) applyMode(modeIdx+1); dragging = false; }
C.addEventListener('mousedown', onDown);
window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
C.addEventListener('touchstart', e => { e.preventDefault(); onDown(e); }, {passive:false});
C.addEventListener('touchmove',  e => { e.preventDefault(); onMove(e); }, {passive:false});
C.addEventListener('touchend',   e => { e.preventDefault(); onUp(); }, {passive:false});

/* ── resize / letterbox ──────────────────────────────────*/
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  C.width = w; C.height = h;
  const ca = w / h;
  letterboxScale = ca > 1 ? [1/ca, 1] : [1, ca];
}
window.addEventListener('resize', resize);
resize();

/* ── main loop ────────────────────────────────────────── */
let startTime = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  if (now - mLastSwitch > M_HOLD) { mLastSwitch = now; mIdx = (mIdx+1) % M_SEQ.length; updateStat(); }

  gl.viewport(0, 0, C.width, C.height);
  gl.clearColor(0,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, qb);
  gl.enableVertexAttribArray(pLoc);
  gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);

  gl.uniform2f(U.uLetterboxScale, letterboxScale[0], letterboxScale[1]);
  gl.uniform1i(U.uMode, modeIdx);
  gl.uniform1f(U.uTime, (now-startTime)/1000);
  gl.uniform1f(U.uOmega, dragOmega);
  gl.uniform1f(U.uOmegaRot, dragRot);
  gl.uniform1f(U.uM, currentM());
  gl.uniform1f(U.uDragX, (dragOmega-OMEGA_MIN)/(OMEGA_MAX-OMEGA_MIN));
  gl.uniform1f(U.uDragY, (dragRot-ROT_MIN)/(ROT_MAX-ROT_MIN));

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
