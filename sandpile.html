<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SANDPILE — AI.ART</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#ui{
  position:fixed;bottom:1.6rem;left:50%;transform:translateX(-50%);
  display:flex;gap:2.4rem;align-items:baseline;
  font-family:'Courier New',monospace;
  pointer-events:none;user-select:none;
  text-align:center;
}
#modeName{
  font-size:10px;letter-spacing:.42em;text-transform:uppercase;
  color:rgba(255,255,255,.35);
}
#desc{
  font-size:9px;letter-spacing:.28em;text-transform:uppercase;
  color:rgba(255,255,255,.13);
}
#back{
  position:fixed;top:1.4rem;left:1.6rem;
  font-family:'Courier New',monospace;font-size:9px;
  letter-spacing:.3em;text-transform:uppercase;
  color:rgba(255,255,255,.2);text-decoration:none;
  transition:color .25s;
}
#back:hover{color:rgba(255,255,255,.6)}
</style>
</head>
<body>
<a id="back" href="index.html">← AI.ART</a>
<canvas id="c"></canvas>
<div id="ui">
  <span id="modeName">CLASSIC</span>
  <span id="desc">BAK · TANG · WIESENFELD · 1987</span>
</div>
<script>
/*  SANDPILE — the Abelian sandpile model / self-organized criticality
 *
 *  Bak, Tang & Wiesenfeld (Phys. Rev. Lett., 1987) proposed the sandpile
 *  as the simplest system that tunes ITSELF to a critical point without
 *  any external parameter to adjust: grains are added one at a time to a
 *  finite lattice; any site holding 4 or more grains "topples," giving
 *  one grain to each of its 4 neighbours; a toppled neighbour may itself
 *  become unstable, so a single grain can trigger a cascade of any size,
 *  from nothing at all to a cascade spanning the whole lattice. The pile
 *  organizes itself to the edge of stability, where cascade sizes follow
 *  a power law with no characteristic scale — the mechanism now cited
 *  to explain avalanches, earthquakes, forest fires, neuronal cascades
 *  and market crashes as instances of the same underlying mathematics.
 *
 *  Implementation note: a real BTW sandpile drives infinitely slowly
 *  (one grain, then full relaxation, repeat) so cascades never overlap.
 *  For a continuously-animated piece this is approximated by a steady
 *  trickle of fractional grains plus several relaxation passes every
 *  frame — a quasi-static approximation, not exact separation of time
 *  scales, the same kind of honest simplification as CHLADNI's mode
 *  shape or MEMBRANE's kernel. Each relaxation pass allows at most ONE
 *  topple per site (rather than draining a tall stack all at once), so
 *  a cascade visibly propagates outward one cell per pass instead of
 *  flooding the screen in a single frame.
 *
 *  Height and "just toppled" activity live in a single ping-ponged float
 *  texture (R = grains, G = decaying topple-activity pulse), the same
 *  architecture MEMBRANE/LENIA/EXCITABLE use for their PDE fields — but
 *  the update rule here is a discrete integer threshold automaton, not
 *  a continuous diffusion equation. Rendered with NEAREST filtering so
 *  the lattice reads as flat colour cells, true to Bak's original
 *  sandpile figures, rather than smoothed like this gallery's other
 *  continuous fields.
 *
 *  5 modes reuse the identical toppling rule with a different drive
 *  pattern, dissipation, or boundary — the same "one engine, different
 *  constants" approach as CHLADNI's mode numbers or GYRUS's repulsion
 *  radii — each pointing at a real system where the same mathematics
 *  has been observed or proposed.
 */

const C = document.getElementById('c');
const modeNameEl = document.getElementById('modeName');
const descEl = document.getElementById('desc');
const gl = C.getContext('webgl') || C.getContext('experimental-webgl');
if (!gl) fatal('WebGL unavailable');
if (!gl.getExtension('OES_texture_float')) fatal('Float textures unavailable');

function fatal(m) {
  document.body.innerHTML = '<p style="color:#fff;padding:2.5em;font:14px monospace">' + m + '</p>';
  throw m;
}

/* ── GLSL ──────────────────────────────────────────────── */
const VS = `
attribute vec2 p;
varying vec2 uv;
void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;

/* One relaxation pass: at most one topple per site.
   R channel: grain count. G channel: decaying "just toppled" pulse. */
const SIM = `
precision highp float;
uniform sampler2D tex;
uniform vec2 res;
uniform float dissip;
uniform float wrap;
uniform vec2 srcPos[8];
uniform float srcOn[8];
uniform float srcRate;
uniform vec2 mouse;
uniform float pourActive;
uniform float pourRate;
varying vec2 uv;

void main(){
  vec2 d = 1.0 / res;
  vec4 self = texture2D(tex, uv);
  float h = self.r;
  float act = self.g;

  float topSelf = h >= 4.0 ? 1.0 : 0.0;
  float hNew = h - topSelf * 4.0;

  vec2 tcL = uv - vec2(d.x, 0.0);
  vec2 tcR = uv + vec2(d.x, 0.0);
  vec2 tcD = uv - vec2(0.0, d.y);
  vec2 tcU = uv + vec2(0.0, d.y);
  bool okL = tcL.x >= 0.0, okR = tcR.x <= 1.0, okD = tcD.y >= 0.0, okU = tcU.y <= 1.0;
  if (wrap > 0.5) { tcL = fract(tcL); tcR = fract(tcR); tcD = fract(tcD); tcU = fract(tcU); okL = true; okR = true; okD = true; okU = true; }

  if (okL && texture2D(tex, tcL).r >= 4.0) hNew += dissip;
  if (okR && texture2D(tex, tcR).r >= 4.0) hNew += dissip;
  if (okD && texture2D(tex, tcD).r >= 4.0) hNew += dissip;
  if (okU && texture2D(tex, tcU).r >= 4.0) hNew += dissip;

  /* steady per-mode drip sources */
  for (int i = 0; i < 8; i++) {
    if (srcOn[i] > 0.5) {
      float dist = length(uv - srcPos[i]);
      float m = 1.0 - smoothstep(0.0, 0.014, dist);
      hNew += srcRate * m;
    }
  }

  /* press-and-hold pour */
  if (pourActive > 0.5) {
    float dist = length(uv - mouse);
    float m = 1.0 - smoothstep(0.0, 0.03, dist);
    hNew += pourRate * m;
  }

  float actNew = act * 0.82 + topSelf * 0.95;
  actNew = min(actNew, 3.0);

  gl_FragColor = vec4(hNew, actNew, 0.0, 1.0);
}`;

/* Render: flat quantized colour per grain count (0-3 stable range),
   hot flash overlay on cells that just toppled. */
const RENDER = `
precision highp float;
uniform sampler2D tex;
varying vec2 uv;

vec3 pileColor(float h){
  vec3 c0 = vec3(0.000,0.000,0.000);
  vec3 c1 = vec3(0.040,0.060,0.200);
  vec3 c2 = vec3(0.000,0.400,0.520);
  vec3 c3 = vec3(0.860,0.640,0.160);
  vec3 c4 = vec3(1.000,0.340,0.100);
  float t = clamp(h, 0.0, 4.0);
  if (t < 1.0) return mix(c0, c1, t);
  if (t < 2.0) return mix(c1, c2, t - 1.0);
  if (t < 3.0) return mix(c2, c3, t - 2.0);
  return mix(c3, c4, t - 3.0);
}

void main(){
  vec4 s = texture2D(tex, uv);
  vec3 col = pileColor(s.r);
  col += vec3(1.0, 0.92, 0.80) * s.g * 0.5;

  float vign = 1.0 - 0.4 * pow(length(uv - 0.5) * 1.6, 2.0);
  col *= vign;

  gl_FragColor = vec4(col, 1.0);
}`;

/* ── GL helpers ───────────────────────────────────────── */
function sh(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    console.error(gl.getShaderInfoLog(s));
  return s;
}
function mkProg(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS))
    console.error(gl.getProgramInfoLog(p));
  return p;
}

const SP = mkProg(VS, SIM);
const RP = mkProg(VS, RENDER);

const qb = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, qb);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

function bindP(prog) {
  const a = gl.getAttribLocation(prog, 'p');
  gl.bindBuffer(gl.ARRAY_BUFFER, qb);
  gl.enableVertexAttribArray(a);
  gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
}
const u = (prog, name) => gl.getUniformLocation(prog, name);

/* ── Ping-pong buffers ───────────────────────────────── */
let W, H, tx = [], fb = [], ping = 0;

function initSim() {
  W = C.width; H = C.height;
  const MX = 384;
  if (W > MX || H > MX) { const s = MX / Math.max(W, H); W = W * s | 0; H = H * s | 0; }

  tx.forEach(t => gl.deleteTexture(t));
  fb.forEach(f => gl.deleteFramebuffer(f));
  tx = []; fb = [];

  const dat = new Float32Array(W * H * 4);
  for (let i = 0; i < 2; i++) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.FLOAT, dat);
    tx.push(t);
    const f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    fb.push(f);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  ping = 0;
}

function reseed() {
  const dat = new Float32Array(W * H * 4);
  gl.bindTexture(gl.TEXTURE_2D, tx[0]);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.FLOAT, dat);
  gl.bindTexture(gl.TEXTURE_2D, tx[1]);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.FLOAT, dat);
  ping = 0;
}

/* ── Modes: same toppling rule, different drive/dissipation/boundary ─
   dissip < 1 loses a fraction of each grain on transfer (friction),
   after Olami-Feder-Christensen's non-conservative earthquake variant.
   wrap = periodic (no-sink) boundary instead of an open, dissipative edge. */
const MODES = [
  { name: 'CLASSIC',   desc: 'BAK · TANG · WIESENFELD · 1987',       dissip: 1.00, wrap: false, sources: () => [[0.5, 0.5]] },
  { name: 'RICE PILE', desc: 'FRETTE ET AL. · REAL GRAIN PILES · 1996', dissip: 1.00, wrap: false, sources: () => [[0.30,0.35],[0.68,0.40],[0.42,0.68],[0.62,0.62]] },
  { name: 'SEISMIC',   desc: 'OLAMI · FEDER · CHRISTENSEN · 1992',   dissip: 0.90, wrap: false, sources: () => [[0.5, 0.5]] },
  { name: 'NEURONAL',  desc: 'BEGGS & PLENZ · CORTICAL AVALANCHES · 2003', dissip: 1.00, wrap: false,
    sources: () => Array.from({length: 8}, () => [0.18 + Math.random()*0.64, 0.18 + Math.random()*0.64]) },
  { name: 'TOROIDAL',  desc: 'DHAR · NO-SINK CLOSED LATTICE · 1990',  dissip: 1.00, wrap: true,  sources: () => [[0.5, 0.5]] },
];
const HOLD = 34 * 60;
let mi = 0, mt = 0;
const srcPosFlat = new Float32Array(16);
const srcOnFlat = new Float32Array(8);

function applySources(mode) {
  const pts = mode.sources();
  srcPosFlat.fill(0); srcOnFlat.fill(0);
  pts.slice(0, 8).forEach((pt, i) => {
    srcPosFlat[i*2] = pt[0]; srcPosFlat[i*2+1] = pt[1];
    srcOnFlat[i] = 1;
  });
}
applySources(MODES[0]);
modeNameEl.textContent = MODES[0].name;
descEl.textContent = MODES[0].desc;

function switchMode() {
  mi = (mi + 1) % MODES.length;
  applySources(MODES[mi]);
  modeNameEl.textContent = MODES[mi].name;
  descEl.textContent = MODES[mi].desc;
  reseed();
}

/* ── Input: press-and-hold pours sand at the cursor ─────── */
const M = { x: 0.5, y: 0.5, on: false };
function setM(cx, cy) {
  const b = C.getBoundingClientRect();
  M.x = (cx - b.left) / b.width;
  M.y = 1.0 - (cy - b.top) / b.height;
}
C.addEventListener('mousedown', e => { setM(e.clientX, e.clientY); M.on = true; });
window.addEventListener('mousemove', e => { if (M.on) setM(e.clientX, e.clientY); });
window.addEventListener('mouseup', () => { M.on = false; });
C.addEventListener('touchstart', e => { e.preventDefault(); setM(e.touches[0].clientX, e.touches[0].clientY); M.on = true; }, { passive: false });
C.addEventListener('touchmove',  e => { e.preventDefault(); setM(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
C.addEventListener('touchend',   () => { M.on = false; });

/* ── Resize ─────────────────────────────────────────── */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  C.width  = window.innerWidth  * dpr | 0;
  C.height = window.innerHeight * dpr | 0;
  C.style.width  = window.innerWidth  + 'px';
  C.style.height = window.innerHeight + 'px';
  initSim();
}
window.addEventListener('resize', resize);
resize();

/* ── Main loop ──────────────────────────────────────── */
const RELAX_STEPS = 24;
(function loop() {
  requestAnimationFrame(loop);

  if (++mt > HOLD) { mt = 0; switchMode(); }

  gl.useProgram(SP); bindP(SP);
  gl.viewport(0, 0, W, H);
  gl.uniform2f(u(SP,'res'), W, H);
  gl.uniform1f(u(SP,'dissip'), MODES[mi].dissip);
  gl.uniform1f(u(SP,'wrap'), MODES[mi].wrap ? 1 : 0);
  gl.uniform2fv(u(SP,'srcPos'), srcPosFlat);
  gl.uniform1fv(u(SP,'srcOn'), srcOnFlat);
  gl.uniform1f(u(SP,'srcRate'), 0.93);
  gl.uniform2f(u(SP,'mouse'), M.x, M.y);
  gl.uniform1f(u(SP,'pourActive'), M.on ? 1 : 0);
  gl.uniform1f(u(SP,'pourRate'), 4.0);
  gl.uniform1i(u(SP,'tex'), 0);

  for (let i = 0; i < RELAX_STEPS; i++) {
    const pong = 1 - ping;
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb[pong]);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tx[ping]);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    ping = pong;
  }

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, C.width, C.height);
  gl.useProgram(RP); bindP(RP);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tx[ping]);
  gl.uniform1i(u(RP,'tex'), 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
})();
</script>
</body>
</html>
