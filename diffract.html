/*  DIFFRACT — chiral Bragg diffraction of the aperiodic monotile
 *
 *  "Chiral diffraction from aperiodic monotile structure" (Nature
 *  Communications, 2026) nanofabricated this gallery's own SPECTRE tile
 *  (Smith, Myers, Kaplan & Goodman-Strauss, "A chiral aperiodic monotile,"
 *  arXiv:2305.17743, 2023) in silicon nitride by electron-beam lithography
 *  and illuminated it with coherent laser light: the far-field diffraction
 *  pattern shows sharp quasiperiodic Bragg peaks arranged with a chiral,
 *  pinwheel-like asymmetry — no mirror line anywhere in the pattern —
 *  because the real-space tiling itself has none. SPECTRE's own header (see
 *  this gallery's SPECTRE piece) already established WHY: the tile's curved
 *  edge can't legally sit beside a reflected copy of itself, so every valid
 *  tiling uses one handedness only, unlike the "hat" tile EINSTEIN renders
 *  (which needs a ~12.7% mix of reflected copies to close up). This piece
 *  renders that tiling's actual far-field pattern, computed from the same
 *  substitution grammar SPECTRE draws in real space, rather than
 *  illustrating the paper's own photograph.
 *
 *  Physics: for coherent illumination, the far-field (Fraunhofer) intensity
 *  scattered by a set of point-like scatterers at positions r_j is the
 *  kinematic structure factor I(k) = |sum_j exp(i k.r_j)|^2 / N^2 — the
 *  same quantity that explained quasicrystal electron diffraction after
 *  Shechtman's 1982 discovery (this gallery's QUASICRYSTAL piece renders
 *  the REAL-space wave-interference construction of an aperiodic lattice;
 *  this piece is its reciprocal-space complement, computed here from an
 *  actual substitution tiling rather than a hand-picked sum of plane
 *  waves).
 *
 *  Tile geometry and the 9-category substitution grammar (Mat class,
 *  RULES_CHILD_MATRIX/RULES_CHILD_CATEGORY/RULES_KEY_POINT) are ported
 *  verbatim from this gallery's own SPECTRE piece, itself ported from
 *  kerupani129s' spectre-monotile-js (MIT License, (c) 2025,
 *  github.com/kerupani129s/spectre-monotile-js) — full attribution text in
 *  SPECTRE's own header, reproduced here in condensed form:
 *
 *    MIT License. Copyright (c) 2025 kerupani129s. Permission is hereby
 *    granted, free of charge, to any person obtaining a copy of this
 *    software to deal in the Software without restriction, subject to
 *    including the above copyright notice. THE SOFTWARE IS PROVIDED "AS
 *    IS", WITHOUT WARRANTY OF ANY KIND.
 *
 *  This piece's own contribution on top of that port: the substitution
 *  grammar is run once (offline, in this session's generate.js scratch
 *  script, not shipped) to depth 3 / root category 1 (matching SPECTRE
 *  mode's own default) — 559 leaf tiles — and each leaf's CENTROID
 *  (not its full 14-vertex outline) is treated as one point scatterer, the
 *  standard simplification used to compute quasicrystal diffraction from a
 *  tiling's vertex/site set. The resulting point positions are baked into
 *  this page as plain data (REAL mode's point cloud) and, unrolled, as the
 *  BRAGG-mode fragment shader's per-point contribution to sum_j exp(i
 *  k.r_j) — WebGL1 fragment shaders need a compile-time loop bound, and a
 *  559-vec2 uniform array risks WebGL1's low guaranteed uniform-vector
 *  minimum on old/mobile GPUs, so unrolling to 559 literal-coordinate
 *  `if(j<uCount){...}` terms (one per point, gated by the live aperture
 *  count) was chosen over both, at the cost of a long generated shader
 *  source rather than a short parametric one — the same "ported, generated,
 *  disclosed" tradeoff this gallery's SPECTRE/EINSTEIN pieces already made
 *  for their own reference ports.
 *
 *  Verified in Node before any shader code (generate.js/verify.js, this
 *  session's scratchpad, not committed): (1) Friedel's law I(k)=I(-k) holds
 *  to floating-point precision for ANY real point set — a mathematical
 *  identity, not a property special to this tiling — confirmed so the
 *  pattern's true 180-degree rotational symmetry (visible on screen) isn't
 *  mistaken for a mirror line; (2) mirror asymmetry — mean relative
 *  difference between I(kx,ky) and I(-kx,ky) sampled across the shown
 *  k-range — measures roughly 50-80% for this chiral tiling across the
 *  FULL range this piece's drag control sweeps (8 to 559 illuminated
 *  tiles), against a periodic triangular-lattice control built the
 *  identical way (same point count, same mean spacing a=2.64):
 *  under 6% everywhere in that same range, exactly 0% at aperture sizes
 *  landing on a complete symmetric shell — LATTICE mode renders that
 *  control directly, not merely asserts the contrast; (3) Bragg-peak
 *  sharpening with aperture size — real, textbook finite-coherence-length
 *  behaviour — verified directly at a fixed strong peak (found by an
 *  exhaustive search over the full 559-tile pattern): peak-to-local-
 *  background ratio rises monotonically from ~60x at 84 illuminated tiles
 *  to ~1000x at all 559, tracked live on screen as PEAK/BG in BRAGG mode.
 *
 *  Honest simplifications, disclosed: (a) this is a SCALAR kinematic
 *  calculation (point scatterers, no vector fields, no near-field or
 *  finite-aperture diffraction integral) — the paper's own reported
 *  circular-polarization-dependent response is a genuinely VECTORIAL
 *  optical effect this piece does not attempt, the same near-field-vs-
 *  scalar gap SKYRMION's own header discloses for its POISSON mode; (b)
 *  collapsing each tile to one centroid point reproduces the Bragg peak
 *  POSITIONS and the mirror-asymmetry signature but not the paper's own
 *  measured peak intensities or envelope, which depend on the tile's full
 *  extended shape; (c) the "spot size" drag control changes how many
 *  tiles are summed (a real finite-illuminated-area effect) but is not
 *  literally the paper's own published beam-width parameter, which this
 *  session could not extract in numerical form from the paper alone; (d)
 *  the reported "perfect threefold rotational symmetry" of the real
 *  diffraction pattern was NOT verified this session — an early attempt at
 *  a live check (comparing point-sampled intensities of the pattern
 *  against a 120-degree-rotated copy) gave large apparent mismatches that
 *  turned out to be a measurement-method artifact (narrow Bragg peaks are
 *  extremely sensitive to exact k-alignment, so comparing individual
 *  sampled intensities rather than matching peak-to-peak is the wrong
 *  test), not a real disproof of the paper's claim — left undone rather
 *  than shipped with a misleading number.
 */

/* ── shared CPU-side structure-factor helper, used only for the small
 * on-screen stat readouts (mirror asymmetry %, peak/background ratio) —
 * a coarse independent cross-check of what the GPU shader is drawing,
 * not the renderer itself ─────────────────────────────────────────────── */
function structureFactor(pts, count, kx, ky) {
  let re = 0, im = 0;
  for (let i = 0; i < count; i++) {
    const p = pts[i];
    const ph = kx*p[0] + ky*p[1];
    re += Math.cos(ph); im += Math.sin(ph);
  }

}
function mirrorAsymmetry(pts, count, res) {
  let num = 0, den = 0;
  for (let iy = 0; iy < res; iy++) {
    const ky = -KMAX + 2*KMAX*iy/(res-1);
    for (let ix = 0; ix < res; ix++) {
      const kx = -KMAX + 2*KMAX*ix/(res-1);
      const I1 = structureFactor(pts, count, kx, ky);
      const I2 = structureFactor(pts, count, -kx, ky);
      num += Math.abs(I1-I2); den += I1+I2;

  return den > 0 ? num/den : 0;

  const Ipeak = structureFactor(pts, count, peak.kx, peak.ky);
  let bg = 0;
  for (let a2 = 0; a2 < 8; a2++) {
    const ang = a2/8*2*Math.PI, dk = 0.6;
    bg += structureFactor(pts, count, peak.kx+dk*Math.cos(ang), peak.ky+dk*Math.sin(ang));

  bg /= 8;

}

const progSpectre = link(QUAD_VS, FRAG_SPECTRE);
const progHex = link(QUAD_VS, FRAG_HEX);

const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

const POINT_VS = `
attribute vec2 aClip;
attribute float aRank;
uniform float uFrac;
varying float vIncluded;
void main(){
  vIncluded = step(aRank, uFrac);
  gl_Position = vec4(aClip, 0.0, 1.0);
  gl_PointSize = mix(2.2, 5.5, vIncluded);
}
`;
const POINT_FS = `
precision mediump float;
varying float vIncluded;
uniform vec3 uColorDim, uColorLit;
void main(){
  vec2 d = gl_PointCoord - vec2(0.5);
  float r = length(d);
  if (r > 0.5) discard;
  float a = smoothstep(0.5, 0.15, r);
  vec3 col = mix(uColorDim, uColorLit, vIncluded);
  gl_FragColor = vec4(col, a * mix(0.35, 1.0, vIncluded));
}
`;
const progPoints = link(POINT_VS, POINT_FS);
const pointBuf = gl.createBuffer(); // aClip.xy, aRank — rebuilt on resize/mode

/* ── modes ────────────────────────────────────────────────────────────── */
const MODES = [
  { name:'REAL', desc:N + ' CHIRAL SPECTRE-TILE CENTROIDS', kind:'real', pts:PTS_SPECTRE, hue:[0.15,0.85,0.95] },
  { name:'BRAGG', desc:'STRUCTURE FACTOR OF THE ILLUMINATED SPOT · NO MIRROR LINE', kind:'diffract', prog:progSpectre, pts:PTS_SPECTRE, peak:PEAK_SPECTRE, colorLo:[0.02,0.04,0.06], colorHi:[0.45,0.95,1.0] },
  { name:'LATTICE', desc:'SAME CALCULATION · PERIODIC HEX CONTROL · MIRROR-SYMMETRIC', kind:'diffract', prog:progHex, pts:PTS_HEX, peak:PEAK_HEX, colorLo:[0.06,0.03,0.01], colorHi:[1.0,0.75,0.25] },
];
let modeIdx = 0;
let fracPos = 1.0; // 0..1 aperture drag fraction, shared across modes
let dirty = true;
let W, H;

function countFromFrac(f) { return Math.max(MIN_COUNT, Math.round(MIN_COUNT + f*(N-MIN_COUNT))); }

function resize() {
  W = canvas.width = Math.round(window.innerWidth * Math.min(1.5, window.devicePixelRatio||1));
  H = canvas.height = Math.round(window.innerHeight * Math.min(1.5, window.devicePixelRatio||1));
  canvas.style.width = window.innerWidth+'px';
  canvas.style.height = window.innerHeight+'px';
  buildPointBuffer();
  dirty = true;
}
window.addEventListener('resize', resize);

function buildPointBuffer() {
  const w = 94.05, h = 106.59; // bbox in tiling units, both point sets share this framing
  const fit = Math.min(W, H) / Math.max(w, h) * 0.86;
  const arr = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const p = PTS_SPECTRE[i];
    arr[i*3+0] = (p[0] * fit) / (W/2);
    arr[i*3+1] = (p[1] * fit) / (H/2);
    arr[i*3+2] = i / (N-1);
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, pointBuf);
  gl.bufferData(gl.ARRAY_BUFFER, arr, gl.DYNAMIC_DRAW);
}

function drawReal() {
  gl.viewport(0,0,W,H);
  gl.clearColor(0.01,0.01,0.014,1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(progPoints);
  gl.bindBuffer(gl.ARRAY_BUFFER, pointBuf);
  const aClip = gl.getAttribLocation(progPoints, 'aClip');
  const aRank = gl.getAttribLocation(progPoints, 'aRank');
  gl.enableVertexAttribArray(aClip);
  gl.vertexAttribPointer(aClip, 2, gl.FLOAT, false, 12, 0);
  gl.enableVertexAttribArray(aRank);
  gl.vertexAttribPointer(aRank, 1, gl.FLOAT, false, 12, 8);
  gl.uniform1f(u(progPoints,'uFrac'), fracPos);
  gl.uniform3f(u(progPoints,'uColorDim'), 0.22, 0.22, 0.26);
  gl.uniform3f(u(progPoints,'uColorLit'), 0.35, 0.92, 1.0);
  gl.drawArrays(gl.POINTS, 0, N);
  gl.disable(gl.BLEND);
}

function drawDiffract(m) {
  gl.viewport(0,0,W,H);
  gl.useProgram(m.prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  const aPos = gl.getAttribLocation(m.prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  const aspectX = W >= H ? W/H : 1.0;
  const aspectY = H >= W ? H/W : 1.0;
  gl.uniform1f(u(m.prog,'uKmax'), KMAX);
  gl.uniform1f(u(m.prog,'uAspectX'), aspectX);
  gl.uniform1f(u(m.prog,'uAspectY'), aspectY);
  gl.uniform1f(u(m.prog,'uCount'), countFromFrac(fracPos));
  gl.uniform3f(u(m.prog,'uColorLo'), m.colorLo[0], m.colorLo[1], m.colorLo[2]);
  gl.uniform3f(u(m.prog,'uColorHi'), m.colorHi[0], m.colorHi[1], m.colorHi[2]);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

function updateStats() {
  const m = MODES[modeIdx];
  const count = countFromFrac(fracPos);
  if (m.kind === 'real') {
    statLabelEl.textContent = 'ILLUMINATED ';
    statValEl.textContent = count + '/' + N;
    statSubEl.textContent = 'DRAG TO SET SPOT SIZE';
  } else {
    const asym = mirrorAsymmetry(m.pts, count, 22);
    const pb = peakToBg(m.pts, count, m.peak);
    statLabelEl.textContent = 'MIRROR ASYMMETRY ';
    statValEl.textContent = (asym*100).toFixed(1) + '%';
    statSubEl.textContent = 'PEAK/BG ' + pb.toFixed(0) + 'x · N=' + count + (m.name==='LATTICE' ? ' (CONTROL)' : '');
  }
}

function render() {
  const m = MODES[modeIdx];
  if (m.kind === 'real') {
    drawReal();
  } else if (dirty) {
    drawDiffract(m);
  }
  dirty = false;
}

function setMode(idx) {
  modeIdx = ((idx % MODES.length) + MODES.length) % MODES.length;
  const m = MODES[modeIdx];
  modeNameEl.textContent = m.name;
  descEl.textContent = m.desc;
  dirty = true;
  updateStats();
}

let lastFracCount = -1;
function setFrac(f) {
  fracPos = Math.min(1, Math.max(0, f));
  const c = countFromFrac(fracPos);
  if (c !== lastFracCount) {
    lastFracCount = c;
    dirty = true;
    updateStats();
  }
}

resize();
setMode(0);

function loop() {
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ── interaction: horizontal drag anywhere sets the aperture fraction
 * (shared across modes); tap without drag advances to the next mode ──── */
let dragStartX = null, dragged = false;
function onDown(e) {
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  dragStartX = x; dragged = false;
}
function onMove(e) {
  if (dragStartX === null) return;
  const x = e.touches ? e.touches[0].clientX : e.clientX;
  if (Math.abs(x - dragStartX) > 4) dragged = true;
  if (dragged) setFrac(x / window.innerWidth);
}
function onUp() {
  if (!dragged) setMode(modeIdx + 1);
  dragStartX = null;
}
canvas.addEventListener('mousedown', onDown);
window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', e => { e.preventDefault(); onDown(e); }, {passive:false});
canvas.addEventListener('touchmove', e => { e.preventDefault(); onMove(e); }, {passive:false});
canvas.addEventListener('touchend', e => { e.preventDefault(); onUp(); }, {passive:false});
