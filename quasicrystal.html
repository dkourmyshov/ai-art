<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUASICRYSTAL — AI.ART</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#ui{
  position:fixed;bottom:1.6rem;left:50%;transform:translateX(-50%);
  display:flex;gap:2.4rem;align-items:baseline;
  font-family:'Courier New',monospace;
  pointer-events:none;user-select:none;
}
#modeName{
  font-size:10px;letter-spacing:.42em;text-transform:uppercase;
  color:rgba(255,255,255,.35);
}
#desc{
  font-size:9px;letter-spacing:.28em;text-transform:uppercase;
  color:rgba(255,255,255,.13);
}
#back{
  position:fixed;top:1.4rem;left:1.6rem;
  font-family:'Courier New',monospace;font-size:9px;
  letter-spacing:.3em;text-transform:uppercase;
  color:rgba(255,255,255,.2);text-decoration:none;
  transition:color .25s;
}
#back:hover{color:rgba(255,255,255,.6)}
</style>
</head>
<body>
<a id="back" href="index.html">← AI.ART</a>
<canvas id="c"></canvas>
<div id="ui">
  <span id="modeName">PENTAGONAL</span>
  <span id="desc">FORBIDDEN FIVEFOLD SYMMETRY</span>
</div>
<script>
/*  QUASICRYSTAL — superposition of plane waves
 *
 *  field(p) = (1/N) · Σ cos( p · dir_i · freq + phase_i )
 *  for N directions evenly spaced over a half-turn (dir_i at i·π/N).
 *
 *  When N is not a multiple of 4 the resulting field is aperiodic —
 *  a quasicrystal: long-range order without translational symmetry,
 *  the structure Dan Shechtman found in an Al-Mn alloy in 1982
 *  (forbidden fivefold diffraction symmetry, 2011 Nobel Prize in
 *  Chemistry), and the kind of lattice produced today by laser
 *  interference lithography for photonic bandgap materials.
 *
 *  Unlike every earlier piece in this gallery (Gray-Scott, Lenia,
 *  FitzHugh-Nagumo, Physarum — all iterative PDE/agent simulations
 *  needing a ping-pong framebuffer), this is a single closed-form
 *  expression evaluated fresh per pixel per frame. No simulation
 *  state, no history, no framebuffers — just wave arithmetic.
 */

const MODES = [
  { name:'PENTAGONAL',   desc:'FORBIDDEN FIVEFOLD SYMMETRY',   n:5,  freq:3.2, disp:0.035, rot: 0.015, phase:0.12, lines:3.5, fringe:0.16,
    c0:[0.008,0.010,0.025], c1:[0.09,0.15,0.40], c2:[0.75,0.85,1.00] },
  { name:'HEPTAGONAL',   desc:'QUASIPERIODIC ALLOY LATTICE',   n:7,  freq:3.6, disp:0.045, rot:-0.020, phase:0.15, lines:4.0, fringe:0.18,
    c0:[0.020,0.010,0.004], c1:[0.44,0.21,0.03], c2:[1.00,0.84,0.44] },
  { name:'OCTAGONAL',    desc:'PHOTONIC BANDGAP INTERFERENCE', n:8,  freq:4.0, disp:0.030, rot: 0.010, phase:0.10, lines:4.0, fringe:0.15,
    c0:[0.004,0.018,0.016], c1:[0.02,0.36,0.28], c2:[0.55,1.00,0.83] },
  { name:'DECAGONAL',    desc:'AL-NI-CO TENFOLD LATTICE',      n:10, freq:4.4, disp:0.050, rot:-0.012, phase:0.18, lines:4.5, fringe:0.20,
    c0:[0.022,0.004,0.016], c1:[0.40,0.05,0.27], c2:[1.00,0.55,0.83] },
  { name:'DODECAGONAL',  desc:'APERIODIC TILING LIMIT',        n:12, freq:4.8, disp:0.080, rot: 0.025, phase:0.22, lines:5.0, fringe:0.42,
    c0:[0.014,0.012,0.022], c1:[0.28,0.14,0.42], c2:[1.00,1.00,1.00] },
];

const MODE_MS = 32000;
const N_RIPPLES = 6;

/* ── WebGL bootstrap ────────────────────────────────────────────────────── */

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
if (!gl) { document.body.innerHTML='<p style="color:#fff;padding:2rem">WebGL not available</p>'; throw 0; }

/* ── shaders ────────────────────────────────────────────────────────────── */

const VS = `
attribute vec2 a;
varying vec2 uv;
void main(){ uv = a*.5+.5; gl_Position = vec4(a,0.,1.); }
`;

const FS = `
precision highp float;
uniform vec2  uRes;
uniform float uTime;
uniform int   uN;
uniform float uFreq, uRot, uPhase, uDisp, uLines, uFringeAmt;
uniform vec3  uC0, uC1, uC2;
uniform vec2  uRippleP[${N_RIPPLES}];
uniform float uRippleT[${N_RIPPLES}];
varying vec2 uv;

const float PI = 3.14159265359;

float quasi(vec2 p, float freq, float t){
  float field = 0.0;
  float baseAngle = t * uRot;
  for (int i = 0; i < 12; i++){
    if (i >= uN) break;
    float angle = float(i) * PI / float(uN) + baseAngle;
    vec2 dir = vec2(cos(angle), sin(angle));
    float ph = float(i) * 2.399963 + t * uPhase;   // golden-angle desync per wave
    field += cos(dot(p, dir) * freq + ph);
  }
  field /= float(uN);

  for (int j = 0; j < ${N_RIPPLES}; j++){
    float age = t - uRippleT[j];
    if (age > 0.0 && age < 5.0) {
      float d = length(p - uRippleP[j]);
      field += 0.85 * exp(-age * 0.7) * exp(-d * 0.10) * cos(d * 2.4 - age * 4.0);
    }
  }
  return field;
}

// smooth 3-stop gradient: near-black trough -> jewel mid-tone -> bright peak
vec3 palette(float t){
  vec3 col = uC0;
  col = mix(col, uC1, smoothstep(0.38, 0.68, t));
  col = mix(col, uC2, smoothstep(0.74, 0.98, t));
  return col;
}

void main(){
  vec2 p = uv * 2.0 - 1.0;
  p.x *= uRes.x / uRes.y;
  float scale = 3.2 + 0.15 * sin(uTime * 0.07);
  p *= scale;

  float fR = quasi(p, uFreq * (1.0 + uDisp), uTime);
  float fG = quasi(p, uFreq,                  uTime);
  float fB = quasi(p, uFreq * (1.0 - uDisp), uTime);

  float tCol = fG * 0.5 + 0.5;
  vec3 base = palette(tCol);
  float peakMask = smoothstep(0.35, 0.9, tCol);

  // chromatic fringe: dispersion between R/G/B sampling frequencies,
  // confined near ridges — mimics how interference lithography splits
  // by wavelength at high-intensity fringes
  vec3 fringe = vec3(fR, fG, fB) - fG;
  base += fringe * uFringeAmt * peakMask;

  // thin faceted crystal edge lines along field iso-contours, brightest at ridges
  float gridv = abs(fract(fG * uLines) - 0.5);
  float edge = 1.0 - smoothstep(0.0, 0.018, gridv);
  base += edge * 0.30 * peakMask * vec3(1.0, 0.97, 0.92);

  vec2 q = uv * 2.0 - 1.0;
  base *= 1.0 - 0.45 * smoothstep(0.4, 1.35, dot(q, q));

  gl_FragColor = vec4(base, 1.0);
}
`;

/* ── GL helpers ─────────────────────────────────────────────────────────── */

function mkShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
function mkProg(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, mkShader(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, mkShader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  return p;
}

const prog = mkProg(VS, FS);
gl.useProgram(prog);

const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

function bindQuad() {
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  const loc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
}

function locs(names) {
  const o = {};
  names.forEach(n => o[n] = gl.getUniformLocation(prog, n));
  return o;
}
const U = locs(['uRes','uTime','uN','uFreq','uRot','uPhase','uDisp','uLines','uFringeAmt','uC0','uC1','uC2','uRippleP','uRippleT']);

/* ── state ──────────────────────────────────────────────────────────────── */

let modeIdx   = 0;
let modeStart = performance.now();
let t0        = performance.now();

const rippleP = new Float32Array(N_RIPPLES * 2);
const rippleT = new Float32Array(N_RIPPLES).fill(-1000);
let rippleIdx = 0;
let lastRippleMs = 0;

function applyMode(idx) {
  modeIdx = ((idx % MODES.length) + MODES.length) % MODES.length;
  const m = MODES[modeIdx];
  document.getElementById('modeName').textContent = m.name;
  document.getElementById('desc').textContent     = m.desc;
}
applyMode(0);

/* ── render ─────────────────────────────────────────────────────────────── */

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

function drawFrame(tSec) {
  const m = MODES[modeIdx];
  gl.useProgram(prog);
  bindQuad();
  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uTime, tSec);
  gl.uniform1i(U.uN, m.n);
  gl.uniform1f(U.uFreq, m.freq);
  gl.uniform1f(U.uRot, m.rot);
  gl.uniform1f(U.uPhase, m.phase);
  gl.uniform1f(U.uDisp, m.disp);
  gl.uniform1f(U.uLines, m.lines);
  gl.uniform1f(U.uFringeAmt, m.fringe);
  gl.uniform3f(U.uC0, m.c0[0], m.c0[1], m.c0[2]);
  gl.uniform3f(U.uC1, m.c1[0], m.c1[1], m.c1[2]);
  gl.uniform3f(U.uC2, m.c2[0], m.c2[1], m.c2[2]);
  gl.uniform2fv(U.uRippleP, rippleP);
  gl.uniform1fv(U.uRippleT, rippleT);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

function loop(now) {
  if (now - modeStart > MODE_MS) {
    modeStart = now;
    applyMode(modeIdx + 1);
  }
  drawFrame((now - t0) / 1000);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ── interaction: click/touch drops a ripple into the lattice ─────────────── */

function worldPoint(clientX, clientY, tSec) {
  const u = clientX / window.innerWidth;
  const v = 1 - clientY / window.innerHeight;
  let x = (u * 2 - 1) * (canvas.width / canvas.height);
  let y = (v * 2 - 1);
  const scale = 3.2 + 0.15 * Math.sin(tSec * 0.07);
  return [x * scale, y * scale];
}

function addRipple(clientX, clientY) {
  const tSec = (performance.now() - t0) / 1000;
  const [x, y] = worldPoint(clientX, clientY, tSec);
  rippleP[rippleIdx * 2]     = x;
  rippleP[rippleIdx * 2 + 1] = y;
  rippleT[rippleIdx]         = tSec;
  rippleIdx = (rippleIdx + 1) % N_RIPPLES;
}

function onPointerDown(e) {
  const x = e.clientX ?? e.touches[0].clientX;
  const y = e.clientY ?? e.touches[0].clientY;
  addRipple(x, y);
}
function onPointerMove(e) {
  const now = performance.now();
  if (now - lastRippleMs < 140) return;
  lastRippleMs = now;
  const x = e.clientX ?? e.touches[0].clientX;
  const y = e.clientY ?? e.touches[0].clientY;
  addRipple(x, y);
}

canvas.addEventListener('mousedown', onPointerDown);
canvas.addEventListener('mousemove', e => { if (e.buttons) onPointerMove(e); });
canvas.addEventListener('touchstart', e => { e.preventDefault(); onPointerDown(e); }, { passive: false });
canvas.addEventListener('touchmove',  e => { e.preventDefault(); onPointerMove(e); }, { passive: false });
</script>
</body>
</html>
