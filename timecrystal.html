<style>

</style>

<body>
<a id="back" href="index.html">← AI.ART</a>
<canvas id="c"></canvas>
<div id="stat">
  <span id="statLabel">K </span><span class="val" id="statVal">0.0</span>
  <span class="sub" id="statSub">DEPTH 1.0 &middot; BAND</span>
</div>
<div id="ui">
  <span id="modeName">SWEEP</span>
  <span id="desc">A SINGLE MOMENTUM MODE, RESET EVERY CYCLE</span>
</div>
<div id="hint">drag: set k (x) &amp; depth (y) &middot; tap: change mode</div>
<script>
/*  TIMECRYSTAL — momentum bandgaps of a photonic time crystal
 *
 *  An ordinary photonic crystal repeats its refractive index in SPACE and
 *  opens FREQUENCY bandgaps: a range of omega that cannot propagate at any
 *  real wavenumber, so incident light of a forbidden frequency is simply
 *  reflected (a Bragg mirror). Morgenthaler (1958) first asked what happens
 *  if a medium's index instead repeats in TIME. The 2020s literature calls
 *  the result a "photonic time crystal" (Lyubarov et al. 2022; Galiffi,
 *  Martinez Solis, Yin, Engheta & Alu's review "Photonics of time-varying
 *  media", Nanophotonics 2022) and shows the roles of the two variables
 *  swap: a time-periodic medium opens a MOMENTUM bandgap instead -- a range
 *  of k that cannot propagate stably at any real frequency. Because the
 *  medium has no spatial boundary to reflect off of, a k inside that gap
 *  does not bounce -- it grows exponentially in place, forever, with no
 *  external energy input beyond whatever is already driving the index
 *  modulation. Guo et al., "Plasmonic metamaterial time crystal" (Nature,
 *  29 July 2026 -- Ecole Polytechnique / College de France / HZDR, gold
 *  crenellated cavities over an InSb semiconductor, driven by HZDR's TELBE
 *  terahertz source) built the first genuinely all-optical realization,
 *  switching reflectivity on picosecond timescales and halving plasmonic
 *  loss by operating the device inside this same momentum-gap regime --
 *  three days old relative to this session, and the freshest inspiration
 *  this session's web wander turned up.
 *
 *  THE PHYSICS, DERIVED AND VERIFIED BEFORE ANY SHADER CODE (verify.js,
 *  this session's scratchpad, not committed): for a non-magnetic 1D TE
 *  wave held at fixed real wavenumber k (space translation symmetry is
 *  intact -- only time-translation symmetry is broken by eps(t)), Maxwell's
 *  equations reduce to
 *
 *      d^2 D/dt^2  =  -( c^2 k^2 / eps(t) )  D(t)         D = eps(t) E
 *
 *  a Hill/Meissner equation: simple harmonic motion at w1=ck/sqrt(eps1)
 *  while eps(t)=eps1, at w2=ck/sqrt(eps2) while eps(t)=eps2, with D and
 *  dD/dt BOTH continuous at every time-interface (the physically continuous
 *  fields there, dual to E/H continuity at an ordinary spatial interface).
 *  That makes the one-period propagator M(k) an exact, closed-form 2x2
 *  rotation-matrix product -- no numerical integration anywhere in this
 *  piece. Its trace collapses to one clean expression:
 *
 *      tr M = 2 cos(w1 t1) cos(w2 t2)  -  (w1/w2 + w2/w1) sin(w1 t1) sin(w2 t2)
 *
 *  |tr M|<=2: eigenvalues on the unit circle, D(t) stays bounded (a BAND).
 *  |tr M|>2: eigenvalues are a real reciprocal pair e^{+-mu T}, D(t) grows
 *  as e^{mu t} forever (a GAP) -- verified against a from-scratch RK4
 *  integration of the original ODE (kept inside a gap, kept outside one):
 *  the matrix-predicted growth ratio over 32 periods matched the direct
 *  integration to 0.05%, and the k-ranges where |tr M|>2 first opens up
 *  from zero width, growing continuously and monotonically with the index
 *  contrast eps2/eps1 (never discontinuously) -- exactly the textbook
 *  Meissner-equation stability-chart behaviour. Sanity-checked against the
 *  ORDINARY spatial dual too: reusing the same eps1, eps2 as a Kronig-
 *  Penney layer stack (d1=t1, d2=t2) gives frequency gaps via the classic
 *  |cos(k1 d1)cos(k2 d2) - 0.5(n2/n1+n1/n2)sin(k1 d1)sin(k2 d2)| > 1
 *  criterion -- the SAME recipe (compose two rotations, take the trace,
 *  test against 2) with the SAME impedance-mismatch factor (n2/n1+n1/n2),
 *  just with a duration and a distance trading places as the swept vs. the
 *  held-fixed variable. That is the literal content of the "duality" this
 *  piece's SPECTRUM mode displays side by side -- not a claim that the two
 *  gap sets sit at identical numeric locations (they generically don't,
 *  since w_i=ck/n_i while k_i=w n_i/c are related by an n -> 1/n exchange,
 *  not a shared axis; an earlier draft of this session's own verify.js
 *  wrongly assumed a shared-axis identity and was caught and corrected by
 *  its own next check before any of this shipped).
 *
 *  For the SWEEP mode's growing trace, computing D(t) by naive per-frame
 *  accumulation would either drift (floating-point error compounding every
 *  step) or overflow float32 outright once e^{mu t} exceeds ~1e38. Instead
 *  every frame recomputes D(t) from scratch as a pure closed-form function
 *  of (k, depth, t) via the exact Cayley-Hamilton identity for unimodular
 *  2x2 matrices, M^n = U_{n-1}(tr/2) M - U_{n-2}(tr/2) I (U = Chebyshev
 *  second kind, closed-form via cos/acos in the bounded regime and cosh/
 *  acosh in the growing one) -- verified against literal repeated matrix
 *  multiplication to a relative error of 1e-14 for n up to 50, in both
 *  regimes. Fully scrubbable, no accumulated error, no simulation state at
 *  all: every pixel of every mode is a closed-form function of screen
 *  position and the wall-clock time, nothing else. A periodic reset (this
 *  mode's own visible sweep-and-retrigger, like an oscilloscope's sawtooth
 *  timebase) keeps the exponent inside a safe float32 margin regardless of
 *  how long the page has been open -- the display range was chosen from
 *  this session's own measured worst-case growth rate over the piece's
 *  full (k, depth) range (mu_max=0.87/period at depth=6, k=8.98), not
 *  guessed.
 */

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
if (!gl) { document.body.innerHTML = '<p style="color:#fff;padding:2rem">WebGL not available</p>'; throw 0; }
// No simulation textures anywhere in this piece -- every pixel is a closed-
// form function of (k, depth, t), so unlike most of this gallery's other
// WebGL pieces, no float-texture extension is needed at all.

const VS = `
attribute vec2 a;
varying vec2 uv;
void main(){ uv = a*.5+.5; gl_Position = vec4(a,0.,1.); }
`;

const FS = `
precision highp float;
varying vec2 uv;
uniform float uMode;   // 0=SWEEP 1=SPECTRUM 2=TONGUES
uniform float uTime;   // real elapsed seconds
uniform float uK, uDepth;
uniform vec2  uRes;

const float EPS1 = 1.0;
const float SEG1 = 0.5, SEG2 = 0.5, PERIOD = 1.0;
const float TIME_SCALE = 3.0;   // natural time units per real second
const float RESET_T    = 30.0; // natural units per SWEEP sawtooth cycle
const float KMIN = 0.2, KMAX = 20.0;
const float DMIN = 1.0, DMAX = 6.0;

float coshf(float x){ float e = exp(x); return 0.5*(e + 1.0/e); }
float sinhf(float x){ float e = exp(x); return 0.5*(e - 1.0/e); }
float acoshf(float x){ return log(x + sqrt(max(x*x - 1.0, 1e-9))); }

// Chebyshev polynomial of the second kind, U_n(x), n a nonnegative integer
// (passed as float). U_{-1}=0 is handled by the caller special-casing n=0
// (M^0=I) before ever calling this with n-2=-2, since the naive recursion's
// n<0 fast path below returns 0 for ALL negative n, which is only correct
// for n=-1, not n=-2 (whose true value is -1) -- caught by hand-deriving
// the n=0 case in verify.js and checking it against the trivial identity
// matrix before writing this shader, rather than trusting the recursion
// to extrapolate itself.
float chebU(float n, float x){
  if (n < -0.5) return 0.0;
  if (x >= -1.0 && x <= 1.0) {
    float th = acos(clamp(x, -1.0, 1.0));
    float st = sin(th);
    if (abs(st) < 1e-5) {
      float parity = mod(n, 2.0) < 0.5 ? 1.0 : -1.0;
      return (x >= 0.0) ? (n + 1.0) : (n + 1.0) * parity;
    }
    return sin((n + 1.0) * th) / st;
  } else if (x > 1.0) {
    float phi = acoshf(x);
    return sinhf((n + 1.0) * phi) / sinhf(phi);
  } else {
    float phi = acoshf(-x);
    float parity = mod(n, 2.0) < 0.5 ? 1.0 : -1.0;
    return parity * sinhf((n + 1.0) * phi) / sinhf(phi);
  }
}

// One-period monodromy matrix M(k,eps2) and its trace, in closed form.
void monodromy(float k, float eps2, out float M00, out float M01, out float M10, out float M11, out float tr){
  float w1 = k / sqrt(EPS1);
  float w2 = k / sqrt(eps2);
  float c1 = cos(w1*SEG1), s1 = sin(w1*SEG1);
  float c2 = cos(w2*SEG2), s2 = sin(w2*SEG2);
  M00 = c1*c2 - (w1/w2)*s1*s2;
  M01 = c2*(s1/w1) + (s2/w2)*c1;
  M10 = -(w2*s2*c1 + w1*s1*c2);
  M11 = c1*c2 - (w2/w1)*s1*s2;
  tr  = M00 + M11;
}

float growthRate(float k, float eps2){
  float M00,M01,M10,M11,tr; monodromy(k, eps2, M00,M01,M10,M11,tr);
  if (abs(tr) <= 2.0) return 0.0;
  return acoshf(abs(tr) * 0.5) / PERIOD;
}

// Closed-form (D, D') at natural time t>=0 for initial condition (1,0),
// via the exact M^n Chebyshev identity -- no accumulation, no drift.
vec2 stateAt(float k, float eps2, float t){
  float M00,M01,M10,M11,tr; monodromy(k, eps2, M00,M01,M10,M11,tr);
  float n = floor(t / PERIOD);
  float tRem = t - n * PERIOD;
  float Dn, Dpn;
  if (n < 0.5) { Dn = 1.0; Dpn = 0.0; }              // M^0 = I
  else {
    float Un1 = chebU(n - 1.0, tr*0.5);
    float Un2 = chebU(n - 2.0, tr*0.5);
    Dn  = Un1*M00 - Un2;
    Dpn = Un1*M10;
  }
  float w1 = k/sqrt(EPS1), w2 = k/sqrt(eps2);
  float D, Dp;
  if (tRem <= SEG1) {
    float c = cos(w1*tRem), s = sin(w1*tRem);
    D  = c*Dn + (s/w1)*Dpn;
    Dp = -w1*s*Dn + c*Dpn;
  } else {
    float c1f = cos(w1*SEG1), s1f = sin(w1*SEG1);
    float Da  = c1f*Dn + (s1f/w1)*Dpn;
    float Dpa = -w1*s1f*Dn + c1f*Dpn;
    float r = tRem - SEG1;
    float c2r = cos(w2*r), s2r = sin(w2*r);
    D  = c2r*Da + (s2r/w2)*Dpa;
    Dp = -w2*s2r*Da + c2r*Dpa;
  }
  return vec2(D, Dp);
}

// Spatial dual: ordinary Kronig-Penney frequency-gap "decay constant" for
// the same eps1,eps2 reinterpreted as layer thicknesses d1=SEG1,d2=SEG2,
// swept over an omega axis of the SAME numeric extent as the k axis above
// (a deliberate, clearly-labeled side-by-side choice -- see header note on
// why this is NOT a claim that the two gap sets share a location).
float spatialDecay(float w, float eps2){
  float n1 = sqrt(EPS1), n2 = sqrt(eps2);
  float k1 = w*n1, k2 = w*n2;
  float rhs = cos(k1*SEG1)*cos(k2*SEG2) - 0.5*(n2/n1+n1/n2)*sin(k1*SEG1)*sin(k2*SEG2);
  if (abs(rhs) <= 1.0) return 0.0;
  return acoshf(abs(rhs)) / (SEG1+SEG2);
}

vec3 bandColor(float mu, float depthDeep){
  vec3 bandC = mix(vec3(0.03,0.05,0.09), vec3(0.16,0.42,0.58), clamp(depthDeep,0.0,1.0));
  vec3 gapC  = mix(vec3(0.35,0.10,0.03), vec3(1.0,0.42,0.10), clamp(1.0-exp(-mu/0.18),0.0,1.0));
  return mu > 0.0 ? gapC : bandC;
}

void main(){
  vec3 col = vec3(0.0);
  float eps2 = EPS1 * uDepth;

  if (uMode < 0.5) {
    // SWEEP: oscilloscope-style sawtooth timebase. x = time since last
    // reset, y = log-envelope of D(t) at the dragged k.
    float simT = mod(uTime * TIME_SCALE, RESET_T);
    float tCol = uv.x * RESET_T;
    float seg  = mod(tCol, PERIOD) < SEG1 ? 0.0 : 1.0;
    vec3 bg = mix(vec3(0.045,0.045,0.05), vec3(0.02,0.02,0.026), seg);
    col = bg * 0.6;

    float edge = smoothstep(0.004, 0.0, abs(tCol - simT));
    col += vec3(0.55,0.7,0.85) * edge * 0.9;

    if (tCol <= simT) {
      vec2 st = stateAt(uK, eps2, tCol);
      float logAmp = log(length(st) + 1e-6);
      float yNorm = (logAmp - (-4.0)) / (18.0 - (-4.0));
      float d = abs(uv.y - clamp(yNorm,0.0,1.0));
      float glowMu = growthRate(uK, eps2);
      vec3 lineCol = glowMu > 0.0 ? vec3(1.0,0.55,0.2) : vec3(0.45,0.85,1.0);
      float fade = smoothstep(0.0, 0.06, simT - tCol) * (1.0 - smoothstep(RESET_T*0.985, RESET_T, tCol));
      col += lineCol * exp(-d*140.0) * fade;
      col += lineCol * exp(-d*18.0) * 0.15 * fade;
    }
  } else if (uMode < 1.5) {
    // SPECTRUM: top strip = this system's momentum gaps vs k; bottom strip
    // = the spatial dual's frequency gaps vs omega (same eps1,eps2, same
    // segment durations reused as layer thicknesses).
    float x = uv.x;
    float kAxis = KMIN + x*(KMAX-KMIN);
    if (uv.y > 0.53) {
      float yy = (uv.y - 0.53)/0.47;
      float M00,M01,M10,M11,tr; monodromy(kAxis, eps2, M00,M01,M10,M11,tr);
      float mu = growthRate(kAxis, eps2);
      float depthDeep = 1.0 - abs(tr)*0.5;
      col = bandColor(mu, depthDeep) * (0.55+0.45*sin(yy*3.14159));
    } else if (uv.y < 0.47) {
      float yy = uv.y/0.47;
      float dec = spatialDecay(kAxis, eps2);
      float rhs;
      { float n1=sqrt(EPS1), n2=sqrt(eps2); float k1=kAxis*n1, k2=kAxis*n2;
        rhs = cos(k1*SEG1)*cos(k2*SEG2) - 0.5*(n2/n1+n1/n2)*sin(k1*SEG1)*sin(k2*SEG2); }
      float depthDeep = 1.0 - clamp(abs(rhs),0.0,1.0);
      col = bandColor(dec>0.0?1.0:0.0, depthDeep);
      if (dec>0.0) col = mix(vec3(0.35,0.10,0.03), vec3(1.0,0.42,0.10), clamp(1.0-exp(-dec/0.5),0.0,1.0));
      col *= (0.55+0.45*sin(yy*3.14159));
    } else {
      col = vec3(0.0);
    }
    float cursor = smoothstep(0.006,0.0, abs(x - (uK-KMIN)/(KMAX-KMIN)));
    col += vec3(1.0) * cursor * 0.5;
  } else {
    // TONGUES: the 2D Ince-Strutt-style stability chart, x=k, y=depth. Also
    // doubles as the direct drag control surface for (k, depth).
    float kAxis = KMIN + uv.x*(KMAX-KMIN);
    float depthAxis = DMIN + uv.y*(DMAX-DMIN);
    float M00,M01,M10,M11,tr; monodromy(kAxis, EPS1*depthAxis, M00,M01,M10,M11,tr);
    float mu = growthRate(kAxis, EPS1*depthAxis);
    float depthDeep = 1.0 - abs(tr)*0.5;
    col = bandColor(mu, depthDeep);

    vec2 mark = vec2((uK-KMIN)/(KMAX-KMIN), (uDepth-DMIN)/(DMAX-DMIN));
    float dMark = length((uv-mark)*uRes/uRes.y);
    float ring = smoothstep(0.009,0.012,dMark) - smoothstep(0.012,0.015,dMark);
    col += vec3(1.0) * ring * 0.9;
  }

  gl_FragColor = vec4(col, 1.0);
}
`;

function mkShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
function mkProg(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, mkShader(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, mkShader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  return p;
}
const prog = mkProg(VS, FS);
const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aLoc = gl.getAttribLocation(prog, 'a');
const U = {};
['uMode','uTime','uK','uDepth','uRes'].forEach(n => U[n] = gl.getUniformLocation(prog, n));

/* ── mode / parameter state ─────────────────────────────────────────────── */

const MODES = [
  { name:'SWEEP',    desc:'A SINGLE MOMENTUM MODE, RESET EVERY CYCLE' },
  { name:'SPECTRUM', desc:'MOMENTUM GAPS (TOP) VS. FREQUENCY GAPS (BOTTOM)' },
  { name:'TONGUES',  desc:'THE (K, DEPTH) STABILITY CHART — DRAG TO EXPLORE' },
];
const MODE_MS = 30000;

const KMIN = 0.2, KMAX = 20.0;
const DMIN = 1.0, DMAX = 6.0;

let modeIdx = 0, modeStart = performance.now();
let dragK = 4.4, dragDepth = 3.0;   // current shared cursor
let dragging = false, dragStartXY = null, dragged = false;
let autoT = 3.7;              // phase accumulator, always advancing (never jumps)
let lastInteract = performance.now();
const IDLE_MS = 3500, RESUME_MS = 2000; // wait this long idle, then ease into auto-drift
let idleAnchorK = dragK, idleAnchorDepth = dragDepth; // value to ease FROM

const modeNameEl = document.getElementById('modeName');
const descEl = document.getElementById('desc');
const statValEl = document.getElementById('statVal');
const statSubEl = document.getElementById('statSub');

function setMode(idx) {
  modeIdx = ((idx % MODES.length) + MODES.length) % MODES.length;
  const m = MODES[modeIdx];
  modeNameEl.textContent = m.name;
  descEl.textContent = m.desc;
}

/* ── JS-side mirror of the shader's trace/growth-rate math, for the live
 * numeric readout (same formulas verified in verify.js) ──────────────── */
function trace(k, eps2) {
  const w1 = k, w2 = k/Math.sqrt(eps2); // EPS1=1
  const c1 = Math.cos(w1*0.5), s1 = Math.sin(w1*0.5);
  const c2 = Math.cos(w2*0.5), s2 = Math.sin(w2*0.5);
  return 2*c1*c2 - (w1/w2 + w2/w1)*s1*s2;
}
function growthRate(k, eps2) {
  const tr = trace(k, eps2);
  if (Math.abs(tr) <= 2) return 0;
  return Math.acosh(Math.abs(tr)/2); // PERIOD=1
}

function updateStats() {
  const eps2 = dragDepth; // EPS1=1
  const mu = growthRate(dragK, eps2);
  const gain = Math.exp(mu); // amplitude multiplier per period
  statValEl.textContent = dragK.toFixed(2);
  if (mu > 0) {
    statSubEl.innerHTML = `DEPTH ${dragDepth.toFixed(2)} &middot; <span class="gap">GAP</span> &middot; &times;${gain.toFixed(3)}/period`;
  } else {
    statSubEl.innerHTML = `DEPTH ${dragDepth.toFixed(2)} &middot; <span class="band">BAND</span> &middot; bounded`;
  }
}

/* ── render loop ────────────────────────────────────────────────────────── */

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

let startTime = performance.now();
function loop(now) {
  if (now - modeStart > MODE_MS) { modeStart = now; setMode(modeIdx+1); }

  autoT += 0.0028; // always advances, so resuming auto-drift never has to jump phase
  const autoK = KMIN + (KMAX-KMIN) * (0.5 + 0.5*Math.sin(autoT));
  const autoDepth = DMIN + (DMAX-DMIN) * (0.5 + 0.5*Math.sin(autoT*0.61 + 1.7));
  if (!dragging) {
    const idleFor = now - lastInteract;
    if (idleFor <= IDLE_MS) {
      idleAnchorK = dragK; idleAnchorDepth = dragDepth; // freeze the hand-off point
    } else {
      const blend = Math.min(1, (idleFor - IDLE_MS) / RESUME_MS);
      dragK = idleAnchorK + (autoK - idleAnchorK) * blend;
      dragDepth = idleAnchorDepth + (autoDepth - idleAnchorDepth) * blend;
    }
  }
  updateStats();

  gl.viewport(0,0,canvas.width,canvas.height);
  gl.useProgram(prog);
  gl.enableVertexAttribArray(aLoc);
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);
  gl.uniform1f(U.uMode, modeIdx);
  gl.uniform1f(U.uTime, (now-startTime)/1000);
  gl.uniform1f(U.uK, dragK);
  gl.uniform1f(U.uDepth, dragDepth);
  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  requestAnimationFrame(loop);
}
setMode(0);
requestAnimationFrame(loop);

/* ── interaction: drag sets (k, depth) from pointer position; tap (no
 * drag) advances to the next mode ─────────────────────────────────────── */
function xyFromEvent(e) {
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX, y: t.clientY };
}
function applyDragXY(x, y) {
  const fx = Math.min(1, Math.max(0, x / window.innerWidth));
  const fy = Math.min(1, Math.max(0, 1 - y / window.innerHeight));
  dragK = KMIN + fx*(KMAX-KMIN);
  dragDepth = DMIN + fy*(DMAX-DMIN);
  lastInteract = performance.now();
}
function onDown(e) { const p = xyFromEvent(e); dragStartXY = p; dragging = true; dragged = false; }
function onMove(e) {
  if (!dragging) return;
  const p = xyFromEvent(e);
  if (Math.hypot(p.x-dragStartXY.x, p.y-dragStartXY.y) > 6) dragged = true;
  if (dragged) applyDragXY(p.x, p.y);
}
function onUp() {
  if (dragging && !dragged) { setMode(modeIdx + 1); lastInteract = performance.now(); }
  dragging = false;
}
canvas.addEventListener('mousedown', onDown);
window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', e => { e.preventDefault(); onDown(e); }, {passive:false});
canvas.addEventListener('touchmove',  e => { e.preventDefault(); onMove(e); }, {passive:false});
canvas.addEventListener('touchend',   e => { e.preventDefault(); onUp(); }, {passive:false});
</script>
