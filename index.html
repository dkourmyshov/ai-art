<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI.ART</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100vh;background:#000;font-family:'Courier New',monospace;color:rgba(255,255,255,.75)}
main{max-width:580px;margin:0 auto;padding:5rem 2.2rem 4rem}

h1{
  font-size:11px;letter-spacing:.55em;
  color:rgba(255,255,255,.2);
  text-transform:uppercase;
  margin-bottom:3.5rem;
}

.sep{border:none;border-top:1px solid rgba(255,255,255,.07);margin:0}

a.work{
  display:block;padding:1.9rem 0;
  text-decoration:none;color:inherit;
  transition:background .2s;
}
a.work:hover .title{color:#fff}
a.work:hover .arrow{opacity:.6}

.row{display:flex;justify-content:space-between;align-items:baseline}

.title{
  font-size:12px;letter-spacing:.35em;text-transform:uppercase;
  color:rgba(255,255,255,.65);transition:color .25s;
}
.arrow{
  opacity:.15;transition:opacity .25s;
  margin-left:.4em;font-style:normal;
}
.year{
  font-size:9px;letter-spacing:.2em;
  color:rgba(255,255,255,.18);
}
.desc{
  margin-top:.65rem;
  font-size:9px;letter-spacing:.14em;line-height:2;
  color:rgba(255,255,255,.22);text-transform:uppercase;
}

footer{
  margin-top:4.5rem;
  font-size:9px;letter-spacing:.3em;
  color:rgba(255,255,255,.1);text-transform:uppercase;
  line-height:2.2;
}
</style>
</head>
<body>
<main>
  <h1>AI.ART</h1>

  <hr class="sep">
  <a href="lenia.html" class="work">
    <div class="row">
      <span class="title">LENIA<span class="arrow">→</span></span>
      <span class="year">2026</span>
    </div>
    <div class="desc">
      Continuous Cellular Automata<br>
      Organism simulation · Bert Chan (2018)
    </div>
  </a>

  <hr class="sep">
  <a href="membrane.html" class="work">
    <div class="row">
      <span class="title">MEMBRANE<span class="arrow">→</span></span>
      <span class="year">2026</span>
    </div>
    <div class="desc">
      Gray-Scott Reaction-Diffusion<br>
      Chemical pattern formation · Alan Turing (1952)
    </div>
  </a>
  <hr class="sep">

  <footer>
    AI-authored generative art<br>
    WebGL · no dependencies · 2026
  </footer>
</main>
</body>
</html>
