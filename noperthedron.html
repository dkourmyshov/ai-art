<script>
/*  NOPERTHEDRON — a convex polyhedron without Rupert's property
 *
 *  In the 1690s Prince Rupert of the Rhine won a bet that a hole could be
 *  cut through a cube wide enough to pass an equal-size copy of that same
 *  cube through it. Wallis proved it in 1693 (drill along the space
 *  diagonal); by the 20th century every convex solid anyone checked — the
 *  five Platonic solids, the truncated icosahedron, dozens more — turned
 *  out to have this "Rupert property" too, and by 2017 it was formally
 *  conjectured that EVERY convex polyhedron has it. Steininger & Yurkevich,
 *  "A convex polyhedron without Rupert's property" (arXiv:2508.18475,
 *  August 2025 / widely covered mid-2026), disproved that conjecture: they
 *  built an explicit 90-vertex convex solid — the Noperthedron — and proved
 *  by an exhaustive computer-assisted case split (roughly 18 million
 *  orientation regions, formally verified in SageMath and partly in Lean)
 *  that NO orientation of a hole through it ever lets an identical copy
 *  pass through. First shape ever proven not-Rupert.
 *
 *  This gallery has flagged a literal, rotatable 3D rendering as an open
 *  itch across nine straight sessions (SPINODAL/FLAME/ATTRACTOR/SOFTCELL/
 *  LICHTENBERG/EDDY/AXOLOTL/ARCTIC/SPRINKLER/TKACHENKO each wanted true 3D
 *  and didn't build it; HORIZON answered its own instance via raymarching,
 *  an illusion of depth with no actual mesh). NOPERTHEDRON is this
 *  gallery's first genuine rasterized 3D solid: an actual vertex/face mesh,
 *  a real MVP matrix pipeline, a depth buffer, flat-shaded lit triangles —
 *  because the paper's own object is inescapably 3-dimensional, unlike
 *  every earlier "3D itch" piece where the underlying phenomenon was
 *  itself 2D or a 2D field extruded.
 *
 *  Construction (Definitions 5-6 of the paper, reproduced EXACTLY, not
 *  approximated): C30 is the cyclic group of order 30 generated by
 *  z-rotations Rz(2*pi*k/15), k=0..14 (fifteen 24-degree steps), combined
 *  with the point reflection -Id (the l=0,1 factor) — 30 elements total.
 *  Three exact rational seed points C1,C2,C3 in Q^3 (quoted verbatim from
 *  the paper's Definition 5, |C1|=1 exactly, |C2|,|C3| in (0.98,0.99)) are
 *  each orbited under C30; the union of the three 30-point orbits is the
 *  Noperthedron's 90-vertex set, computed live in this page's own
 *  constructVertices() at load time — not baked/precomputed data, since
 *  unlike DIFFRACT's SPECTRE substitution grammar this construction is
 *  cheap enough (30 3x3 matrix-vector products x 3 seeds) to run directly
 *  in the browser, the same "generate it for real, in front of the
 *  visitor" choice QUASICRYSTAL and quite a few other pieces in this
 *  gallery already make for their own generative structure.
 *
 *  The convex hull of those 90 points (an incremental Barber-Dobkin-
 *  Huhdanpaa-style algorithm, buildHull(), also run live) is the mesh
 *  SOLID mode renders. Rupert's property itself is tested using the
 *  paper's own projection parametrization (its Theorem 2 / eq. 3-4):
 *  X(theta,phi) is the unit view direction, M(theta,phi) an orthonormal
 *  2x3 basis of the plane perpendicular to it, so M(theta,phi).P is a
 *  solid's 2D "shadow" along that direction. CUBE and NOPERTHEDRON modes
 *  both implement the actual geometric test a Rupert passage requires:
 *  does a same-size copy of the shadow, freely rotated and translated,
 *  fit strictly inside another shadow of the same solid taken from a
 *  different direction? This piece computes that EXACTLY, not
 *  approximately: for two convex polygons A (the hole) and B (the copy,
 *  after a chosen in-plane rotation), the set of translations t with
 *  t+B subset-of A is itself an exact convex region — the intersection of
 *  A's own edge half-planes, each tightened by B's support function in
 *  that edge's outward normal direction (t+B subset A  iff  for every
 *  vertex b of B, t+b in A  iff  n_i.t <= c_i - max_b(n_i.b) for every
 *  edge i of A) — computed here by literal half-plane intersection
 *  (halfPlaneIntersection()), and the largest scale s with a nonempty
 *  feasible region found by bisection (maxFitScale()). No physics-style
 *  approximation anywhere in this test; the only inexactness is floating
 *  point and the finite set of orientations this page has time to sample.
 *
 *  Verified in Node before any shader code (verify.js/hull.js/geometry.js/
 *  verify_rupert.js, this session's scratchpad, not committed): (1) the
 *  seed points' norms match the paper's own claims exactly (|C1|=1.0 to
 *  float precision, |C2|=0.98558, |C3|=0.98350, both inside the paper's
 *  claimed (0.98,0.99)); (2) the 90-point set is exactly point-symmetric
 *  about the origin and has no coincident vertices; (3) the computed hull
 *  matches the paper's OWN reported topology precisely: 90 vertices used,
 *  Euler V-E+F=2 satisfied on the raw triangulation (90-264+176=2), and —
 *  the strongest check — clustering the 176 raw triangles by coplanar
 *  normal collapses them into exactly 152 merged faces, splitting as 150
 *  singleton triangles and 2 clusters of 13 triangles each (a 13-triangle
 *  fan is exactly the fan-triangulation of a convex 15-gon), matching the
 *  paper's own "150 triangles and two regular 15-sided polygons" to the
 *  triangle; (4) the half-plane-intersection containment test was sanity-
 *  checked against a shadow tested for self-containment (must return
 *  scale 1.000000 exactly — it does) and then against the CLASSICAL cube
 *  Rupert passage: a coarse 9x10-direction x 6-rotation grid search over
 *  hole/copy orientations found a best passing scale of 1.048273, closing
 *  in on (though not reaching, at this grid's resolution) the literature's
 *  own exact Nieuwland constant 3*sqrt(2)/4 = 1.060660 for the largest
 *  cube that can pass through a unit cube — the live CUBE mode below runs
 *  the identical search continuously and its on-screen number keeps
 *  climbing toward that same constant the longer it runs; (5) an
 *  analogous 9600-sample random-orientation sweep against the ACTUAL
 *  Noperthedron shadows found a maximum fitting scale of 0.999999 — i.e.
 *  never once exceeding 1 — with 0% of sampled orientation pairs managing
 *  scale > 1, consistent with (though not a proof of) the paper's own
 *  impossibility result.
 *
 *  Honest simplifications, disclosed on screen and here: (a) this page
 *  does NOT reproduce the paper's actual proof — that proof rigorously
 *  covers all ~18 million regions of a continuous 5-parameter orientation
 *  space via a global/local theorem pair implemented in SageMath (and
 *  partially formalized in Lean); CUBE and NOPERTHEDRON modes instead run
 *  a live, continuous, deterministic (no Math.random — three
 *  incommensurate sweep rates on hole-theta/copy-theta/copy-phi/in-plane-
 *  rotation, echoing QUASICRYSTAL's own irrational-frequency approach)
 *  SAMPLING of that space, honestly labeled "empirical search, not the
 *  full proof" in the live stat panel — it can find that the cube fits
 *  (a real positive witness) but can only ever report "never found a fit
 *  yet" for the Noperthedron, not "provably never fits"; (b) the sampled
 *  in-plane rotation and view-direction sweep does not claim to cover the
 *  paper's own 5-dimensional parametrization exhaustively or uniformly,
 *  only broadly and continuously; (c) SOLID mode's flat shading is
 *  per-raw-triangle, not per true face — this is visually invisible
 *  (adjacent coplanar triangles on the two 15-gon caps share an identical
 *  face normal so flat shading renders them seamlessly, verified by eye
 *  in a headless screenshot) but means the mesh technically carries 176
 *  triangles, not the paper's own 152-face structure, on the GPU; (d) the
 *  CUBE comparison uses an arbitrary cube size (unrelated to the
 *  Noperthedron's own unit-ball-ish scale) since the fitting-SCALE
 *  statistic this piece measures is scale-invariant by construction, not
 *  a claim that the two solids are drawn at any meaningfully comparable
 *  absolute size.
 */

const canvas = document.getElementById('c');
const modeNameEl = document.getElementById('modeName');
const descEl = document.getElementById('desc');
const statLabelEl = document.getElementById('statLabel');
const statValEl = document.getElementById('statVal');
const statSubEl = document.getElementById('statSub');

const gl = canvas.getContext('webgl', {antialias:true, depth:true})
        || canvas.getContext('experimental-webgl', {antialias:true, depth:true});
if (!gl) { document.body.innerHTML = '<p style="color:#fff;font-family:monospace;padding:2rem">WebGL unavailable.</p>'; throw new Error('no webgl'); }

/* ── GL plumbing ──────────────────────────────────────────────────────── */
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function link(vsSrc, fsSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
function u(p, name) { return gl.getUniformLocation(p, name); }

/* ── tiny mat4 helpers (column-major, WebGL convention) ──────────────── */
function mat4Perspective(fovy, aspect, near, far) {
  const f = 1.0 / Math.tan(fovy/2), nf = 1/(near-far);
  return new Float32Array([
    f/aspect,0,0,0,
    0,f,0,0,
    0,0,(far+near)*nf,-1,
    0,0,2*far*near*nf,0
  ]);
}
function vSub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function vCross(a,b){return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];}
function vNorm(a){const n=Math.hypot(a[0],a[1],a[2])||1; return [a[0]/n,a[1]/n,a[2]/n];}
function vDot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function mat4LookAt(eye, center, up) {
  const zAxis = vNorm(vSub(eye, center));
  const xAxis = vNorm(vCross(up, zAxis));
  const yAxis = vCross(zAxis, xAxis);
  return new Float32Array([
    xAxis[0], yAxis[0], zAxis[0], 0,
    xAxis[1], yAxis[1], zAxis[1], 0,
    xAxis[2], yAxis[2], zAxis[2], 0,
    -vDot(xAxis,eye), -vDot(yAxis,eye), -vDot(zAxis,eye), 1
  ]);
}
function mat4Mul(a, b) {
  const out = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
    let s = 0;
    for (let k = 0; k < 4; k++) s += a[k*4+r] * b[c*4+k];
    out[c*4+r] = s;
  }
  return out;
}

/* ── Noperthedron construction — Definition 5/6 of arXiv:2508.18475,
 * reproduced exactly (see header). Run once at load. ──────────────────── */
function rz(a) {
  const c = Math.cos(a), s = Math.sin(a);
  return [[c,-s,0],[s,c,0],[0,0,1]];
}
function matVec(M, v) {
  return [M[0][0]*v[0]+M[0][1]*v[1]+M[0][2]*v[2],
          M[1][0]*v[0]+M[1][1]*v[1]+M[1][2]*v[2],
          M[2][0]*v[0]+M[2][1]*v[1]+M[2][2]*v[2]];
}
function vScale(v,s){return [v[0]*s,v[1]*s,v[2]*s];}

function constructC30() {
  const group = [];
  for (let k = 0; k < 15; k++) {
    const R = rz(2*Math.PI*k/15);
    group.push(v => matVec(R, v));
    group.push(v => vScale(matVec(R, v), -1));
  }
  return group;
}
function constructNopVertices() {
  const C1 = vScale([152024884, 0, 210152163], 1/259375205);
  const C2 = vScale([6632738028, 6106948881, 3980949609], 1/1e10);
  const C3 = vScale([8193990033, 5298215096, 1230614493], 1/1e10);
  const C30 = constructC30();
  const verts = [];
  for (const seed of [C1, C2, C3]) for (const g of C30) verts.push(g(seed));
  return verts;
}
const NOP_VERTS = constructNopVertices(); // 90 points, |v| in [0.983, 1.0]

/* ── incremental 3D convex hull (Barber-Dobkin-Huhdanpaa style) ─────────
 * small enough (n=90) for an O(n^2)-ish incremental approach — identical
 * algorithm to this session's Node verification (hull.js). ─────────────── */
function faceNormal(pts, f) { return vCross(vSub(pts[f[1]],pts[f[0]]), vSub(pts[f[2]],pts[f[0]])); }
function buildHull(pts) {
  const n = pts.length, EPS = 1e-9;
  let i0=0,i1=1,i2=2,i3=-1;
  for (i2 = 2; i2 < n; i2++) { if (Math.hypot(...vCross(vSub(pts[i1],pts[i0]), vSub(pts[i2],pts[i0]))) > EPS) break; }
  for (i3 = 0; i3 < n; i3++) {
    if (i3===i0||i3===i1||i3===i2) continue;
    const nrm = vCross(vSub(pts[i1],pts[i0]), vSub(pts[i2],pts[i0]));
    if (Math.abs(vDot(nrm, vSub(pts[i3],pts[i0]))) > EPS) break;
  }
  let faces = [[i0,i1,i2],[i0,i2,i3],[i0,i3,i1],[i1,i3,i2]];
  const centroid = [0,0,0];
  for (const idx of [i0,i1,i2,i3]) { centroid[0]+=pts[idx][0]/4; centroid[1]+=pts[idx][1]/4; centroid[2]+=pts[idx][2]/4; }
  faces = faces.map(f => {
    const nrm = faceNormal(pts, f);
    if (vDot(nrm, vSub(centroid, pts[f[0]])) > 0) return [f[0],f[2],f[1]];
    return f;
  });
  const used = new Set([i0,i1,i2,i3]);
  const remaining = [];
  for (let i = 0; i < n; i++) if (!used.has(i)) remaining.push(i);
  for (const pi of remaining) {
    const p = pts[pi];
    const visible = [], visibleSet = new Set();
    for (let fi = 0; fi < faces.length; fi++) {
      const nrm = faceNormal(pts, faces[fi]);
      if (vDot(nrm, vSub(p, pts[faces[fi][0]])) > EPS) { visible.push(fi); visibleSet.add(fi); }
    }
    if (!visible.length) continue;
    const edgeKey = (a,b) => a<b ? a+'_'+b : b+'_'+a;
    const edgeCount = new Map();
    for (const fi of visible) {
      const f = faces[fi];
      for (const [a,b] of [[f[0],f[1]],[f[1],f[2]],[f[2],f[0]]]) {
        const k = edgeKey(a,b);
        edgeCount.set(k, (edgeCount.get(k)||0) + 1);
      }
    }
    const horizon = [];
    for (const fi of visible) {
      const f = faces[fi];
      for (const [a,b] of [[f[0],f[1]],[f[1],f[2]],[f[2],f[0]]]) {
        if (edgeCount.get(edgeKey(a,b)) === 1) horizon.push([a,b]);
      }
    }
    faces = faces.filter((_, fi) => !visibleSet.has(fi));
    for (const [a,b] of horizon) {
      const f = [a,b,pi];
      const nrm = faceNormal(pts, f);
      faces.push(vDot(nrm, vSub(centroid, pts[a])) > 0 ? [a,pi,b] : [a,b,pi]);
    }
  }
  return faces;
}
const NOP_FACES = buildHull(NOP_VERTS);

/* ── mesh stats: used-vertex/edge count + coplanar-merged face count,
 * cross-checked against the paper's own reported 90/240/152 topology
 * (see header verification note). ──────────────────────────────────────── */
function meshStats(verts, faces) {
  const usedV = new Set();
  for (const f of faces) for (const idx of f) usedV.add(idx);

  const normals = faces.map(f => vNorm(faceNormal(verts, f)));
  const assigned = new Array(faces.length).fill(-1);
  let mergedCount = 0, capCount15 = 0;
  for (let i = 0; i < faces.length; i++) {
    if (assigned[i] !== -1) continue;
    let size = 1; assigned[i] = mergedCount;
    for (let j = i+1; j < faces.length; j++) {
      if (assigned[j] !== -1) continue;
      if (vDot(normals[i], normals[j]) > 1 - 1e-7) { assigned[j] = mergedCount; size++; }
    }
    if (size > 1) capCount15++;
    mergedCount++;
  }

  // a raw-triangulation edge is a REAL edge of the merged polyhedron only if
  // the two raw triangles sharing it belong to different merged clusters —
  // otherwise it's an internal fan diagonal inside one of the two 15-gon caps.
  const edgeTris = new Map();
  const key = (a,b) => a<b ? a+'_'+b : b+'_'+a;
  faces.forEach((f, fi) => {
    for (const [a,b] of [[f[0],f[1]],[f[1],f[2]],[f[2],f[0]]]) {
      const k = key(a,b);
      if (!edgeTris.has(k)) edgeTris.set(k, []);
      edgeTris.get(k).push(fi);
    }
  });
  let mergedEdges = 0;
  for (const tris of edgeTris.values()) {
    if (tris.length === 2 && assigned[tris[0]] !== assigned[tris[1]]) mergedEdges++;
    else if (tris.length !== 2) mergedEdges++; // shouldn't happen on a closed manifold, kept defensively
  }

  return { V: usedV.size, E: mergedEdges, Fraw: faces.length, Fmerged: mergedCount, caps: capCount15 };
}
const NOP_STATS = meshStats(NOP_VERTS, NOP_FACES);

/* ── SOLID mode: build a flat-shaded (position+normal) triangle buffer ── */
function buildMeshBuffer(verts, faces) {
  const arr = new Float32Array(faces.length * 3 * 6);
  let o = 0;
  for (const f of faces) {
    const n = vNorm(faceNormal(verts, f));
    for (const idx of f) {
      const p = verts[idx];
      arr[o++]=p[0]; arr[o++]=p[1]; arr[o++]=p[2];
      arr[o++]=n[0]; arr[o++]=n[1]; arr[o++]=n[2];
    }
  }
  return arr;
}
const meshData = buildMeshBuffer(NOP_VERTS, NOP_FACES);
const meshBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, meshBuf);
gl.bufferData(gl.ARRAY_BUFFER, meshData, gl.STATIC_DRAW);
const meshVertCount = NOP_FACES.length * 3;

const MESH_VS = `
attribute vec3 aPos, aNormal;
uniform mat4 uMVP;
varying vec3 vNormal, vWorld;
void main(){
  vNormal = aNormal;
  vWorld = aPos;
  gl_Position = uMVP * vec4(aPos, 1.0);
}`;
const MESH_FS = `precision highp float;
varying vec3 vNormal, vWorld;
uniform vec3 uLightDir, uCamPos, uColorBase;
void main(){
  vec3 n = normalize(vNormal);
  float diff = max(dot(n, normalize(uLightDir)), 0.0);
  vec3 viewDir = normalize(uCamPos - vWorld);
  float rim = pow(1.0 - max(dot(n, viewDir), 0.0), 2.4);
  vec3 col = uColorBase * (0.16 + 0.84 * diff) + rim * 0.35 * vec3(0.55, 0.82, 1.0);
  gl_FragColor = vec4(col, 1.0);
}`;
const progMesh = link(MESH_VS, MESH_FS);

/* ── 2D projection + convex hull + exact Rupert containment test ────────
 * X(theta,phi)/M(theta,phi): paper's own Theorem 2 / eq. 3-4. ──────────── */
function projDir(theta, phi) { return [Math.cos(theta)*Math.sin(phi), Math.sin(theta)*Math.sin(phi), Math.cos(phi)]; }
function projMat(theta, phi) {
  return [
    [-Math.sin(theta), Math.cos(theta), 0],
    [-Math.cos(theta)*Math.cos(phi), -Math.sin(theta)*Math.cos(phi), Math.sin(phi)],
  ];
}
function project2D(pts3, theta, phi) {
  const m = projMat(theta, phi);
  return pts3.map(p => [m[0][0]*p[0]+m[0][1]*p[1]+m[0][2]*p[2], m[1][0]*p[0]+m[1][1]*p[1]+m[1][2]*p[2]]);
}
function rot2(a) { const c=Math.cos(a), s=Math.sin(a); return [[c,-s],[s,c]]; }
function applyRot2(R, p) { return [R[0][0]*p[0]+R[0][1]*p[1], R[1][0]*p[0]+R[1][1]*p[1]]; }
function convexHull2D(points) {
  const pts = points.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cross = (o,a,b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const lower = [];
  for (const p of pts) { while (lower.length>=2 && cross(lower[lower.length-2],lower[lower.length-1],p)<=0) lower.pop(); lower.push(p); }
  const upper = [];
  for (let i=pts.length-1;i>=0;i--) { const p=pts[i]; while (upper.length>=2 && cross(upper[upper.length-2],upper[upper.length-1],p)<=0) upper.pop(); upper.push(p); }
  lower.pop(); upper.pop();
  return lower.concat(upper);
}
function supportFn(poly, dir) { let best=-Infinity; for (const p of poly){ const d=p[0]*dir[0]+p[1]*dir[1]; if (d>best) best=d; } return best; }
function edgesOf(polyCCW) {
  const n = polyCCW.length, out = [];
  for (let i=0;i<n;i++) {
    const a=polyCCW[i], b=polyCCW[(i+1)%n];
    const ex=b[0]-a[0], ey=b[1]-a[1];
    const len = Math.hypot(ey,-ex) || 1;
    const nn = [ey/len, -ex/len];
    out.push({ n: nn, c: nn[0]*a[0]+nn[1]*a[1] });
  }
  return out;
}
function halfPlaneIntersection(halfplanes, box) {
  let poly = [[-box,-box],[box,-box],[box,box],[-box,box]];
  for (const {n,c} of halfplanes) {
    if (!poly.length) break;
    const next = [];
    for (let i=0;i<poly.length;i++) {
      const cur=poly[i], nxt=poly[(i+1)%poly.length];
      const dCur = n[0]*cur[0]+n[1]*cur[1]-c, dNxt = n[0]*nxt[0]+n[1]*nxt[1]-c;
      if (dCur <= 0) next.push(cur);
      if ((dCur<0 && dNxt>0) || (dCur>0 && dNxt<0)) {
        const t = dCur/(dCur-dNxt);
        next.push([cur[0]+t*(nxt[0]-cur[0]), cur[1]+t*(nxt[1]-cur[1])]);
      }
    }
    poly = next;
  }
  return poly.length >= 3 ? poly : null;
}
function polygonCentroid(poly) {
  let a=0, cx=0, cy=0;
  for (let i=0;i<poly.length;i++) {
    const p=poly[i], q=poly[(i+1)%poly.length];
    const cr = p[0]*q[1]-q[0]*p[1];
    a += cr; cx += (p[0]+q[0])*cr; cy += (p[1]+q[1])*cr;
  }
  a *= 0.5;
  if (Math.abs(a) < 1e-9) { let sx=0,sy=0; for (const p of poly){sx+=p[0];sy+=p[1];} return [sx/poly.length, sy/poly.length]; }
  return [cx/(6*a), cy/(6*a)];
}
function testFit(hullA, hullB, box) {
  const halfplanes = edgesOf(hullA).map(({n,c}) => ({ n, c: c - supportFn(hullB, n) }));
  const region = halfPlaneIntersection(halfplanes, box);
  return { fits: !!region, region };
}
function maxFitScale(hullA, hullBBase, box, sHi, iters) {
  let lo = 0, hi = sHi;
  for (let it = 0; it < iters; it++) {
    const mid = (lo+hi)/2;
    const scaled = hullBBase.map(p => [p[0]*mid, p[1]*mid]);
    if (testFit(hullA, scaled, box).fits) lo = mid; else hi = mid;
  }
  return lo;
}

const CUBE_VERTS = (() => {
  const v = [];
  for (const x of [-0.55,0.55]) for (const y of [-0.55,0.55]) for (const z of [-0.55,0.55]) v.push([x,y,z]);
  return v;
})();
const NIEUWLAND = 3*Math.sqrt(2)/4;

/* ── 2D polygon rendering (outline + fill), shared by CUBE/NOPERTHEDRON ── */
const POLY_VS = `
attribute vec2 aPos;
uniform vec2 uOffset, uScale;
void main(){ gl_Position = vec4((aPos + uOffset) * uScale, 0.0, 1.0); }`;
const POLY_FS = `precision mediump float;
uniform vec4 uColor;
void main(){ gl_FragColor = uColor; }`;
const progPoly = link(POLY_VS, POLY_FS);
const polyBuf = gl.createBuffer();

function drawPoly2D(poly, mode2gl, color, offset, scaleXY) {
  if (!poly || poly.length < (mode2gl===gl.LINE_LOOP?2:3)) return;
  let verts;
  if (mode2gl === gl.TRIANGLE_FAN) verts = poly;
  else verts = poly;
  const arr = new Float32Array(verts.length*2);
  for (let i=0;i<verts.length;i++){ arr[i*2]=verts[i][0]; arr[i*2+1]=verts[i][1]; }
  gl.bindBuffer(gl.ARRAY_BUFFER, polyBuf);
  gl.bufferData(gl.ARRAY_BUFFER, arr, gl.DYNAMIC_DRAW);
  gl.useProgram(progPoly);
  const aPos = gl.getAttribLocation(progPoly, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  gl.uniform2f(u(progPoly,'uOffset'), offset[0], offset[1]);
  gl.uniform2f(u(progPoly,'uScale'), scaleXY[0], scaleXY[1]);
  gl.uniform4f(u(progPoly,'uColor'), color[0], color[1], color[2], color[3]);
  gl.drawArrays(mode2gl, 0, verts.length);
}
function polyBoundingRadius(poly) {
  let r = 0;
  for (const p of poly) r = Math.max(r, Math.hypot(p[0], p[1]));
  return r || 1;
}

/* ── modes ────────────────────────────────────────────────────────────── */
let W, H;
let orbitYaw = 0.7, orbitPitch = 1.15;
let holeTheta = 0.6, holePhi = 1.0, holePhiDir = 1;
let sweepT = 0;
const cubeStats = { best: 0, samples: 0 };
const nopStats = { best: 0, samples: 0 };

const MODES = [
  { name:'SOLID', desc:'90 VERTICES · C₃₀ SYMMETRY · DRAG TO ORBIT', kind:'solid' },
  { name:'CUBE', desc:"RUPERT'S CLASSICAL PASSAGE · KNOWN POSITIVE CASE", kind:'rupert', verts:CUBE_VERTS, stats:cubeStats, sHi:1.3 },
  { name:'NOPERTHEDRON', desc:'A CONVEX BODY THAT CANNOT PASS THROUGH ITSELF', kind:'rupert', verts:NOP_VERTS, stats:nopStats, sHi:1.2 },
];
let modeIdx = 0;

function resize() {
  const dpr = Math.min(1.5, window.devicePixelRatio||1);
  W = canvas.width = Math.round(window.innerWidth * dpr);
  H = canvas.height = Math.round(window.innerHeight * dpr);
  canvas.style.width = window.innerWidth+'px';
  canvas.style.height = window.innerHeight+'px';
}
window.addEventListener('resize', resize);

function drawSolid() {
  gl.viewport(0,0,W,H);
  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(0.01,0.012,0.016,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);

  const dist = 3.1;
  const eye = [
    dist*Math.sin(orbitPitch)*Math.cos(orbitYaw),
    dist*Math.cos(orbitPitch),
    dist*Math.sin(orbitPitch)*Math.sin(orbitYaw),
  ];
  const view = mat4LookAt(eye, [0,0,0], [0,1,0]);
  const aspect = W/H;
  const baseFov = 35*Math.PI/180; // intended FOV of the screen's SHORTER dimension
  const fovy = aspect >= 1 ? baseFov : 2*Math.atan(Math.tan(baseFov/2)/aspect);
  const proj = mat4Perspective(fovy, aspect, 0.1, 20);
  const mvp = mat4Mul(proj, view);

  gl.useProgram(progMesh);
  gl.bindBuffer(gl.ARRAY_BUFFER, meshBuf);
  const aPos = gl.getAttribLocation(progMesh, 'aPos');
  const aNormal = gl.getAttribLocation(progMesh, 'aNormal');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 24, 0);
  gl.enableVertexAttribArray(aNormal);
  gl.vertexAttribPointer(aNormal, 3, gl.FLOAT, false, 24, 12);
  gl.uniformMatrix4fv(u(progMesh,'uMVP'), false, mvp);
  gl.uniform3f(u(progMesh,'uLightDir'), 0.5, 0.85, 0.4);
  gl.uniform3f(u(progMesh,'uCamPos'), eye[0], eye[1], eye[2]);
  gl.uniform3f(u(progMesh,'uColorBase'), 0.32, 0.55, 0.68);
  gl.drawArrays(gl.TRIANGLES, 0, meshVertCount);
  gl.disable(gl.DEPTH_TEST);
}

function drawRupert(m) {
  gl.viewport(0,0,W,H);
  gl.clearColor(0.01,0.01,0.013,1);
  gl.clear(gl.COLOR_BUFFER_BIT);

  const holeShadow = convexHull2D(project2D(m.verts, holeTheta, holePhi));

  // continuous, deterministic, incommensurate-rate sweep over copy orientation
  const copyTheta = sweepT * 0.17;
  const copyPhi = (Math.sin(sweepT*0.083)*0.5+0.5) * Math.PI;
  const alpha = sweepT * 0.29;
  const copyBase = convexHull2D(project2D(m.verts, copyTheta, copyPhi));
  const R = rot2(alpha);
  const copyRotated = copyBase.map(p => applyRot2(R, p));

  const box = 8;
  const { fits, region } = testFit(holeShadow, copyRotated, box);
  const s = maxFitScale(holeShadow, copyRotated, box, m.sHi, 18);
  if (s > m.stats.best) m.stats.best = s;
  m.stats.samples++;

  // place the scale-1 copy at a feasible translation if one exists, else at origin
  let t = [0,0];
  if (region) t = polygonCentroid(region);
  const copyPlaced = copyRotated.map(p => [p[0]+t[0], p[1]+t[1]]);

  const rad = Math.max(polyBoundingRadius(holeShadow), polyBoundingRadius(copyPlaced));
  const fit = 0.62 / rad;
  const aspectX = W >= H ? H/W : 1.0;
  const aspectY = H >= W ? W/H : 1.0;
  const scaleXY = [fit*aspectX, fit*aspectY];

  drawPoly2D(copyPlaced, gl.TRIANGLE_FAN, fits ? [0.25,0.85,0.45,0.28] : [0.85,0.25,0.25,0.22], [0,0], scaleXY);
  drawPoly2D(copyPlaced, gl.LINE_LOOP, fits ? [0.35,0.95,0.55,0.9] : [0.95,0.35,0.35,0.85], [0,0], scaleXY);
  drawPoly2D(holeShadow, gl.LINE_LOOP, [0.85,0.9,0.95,0.85], [0,0], scaleXY);
}

function updateStats() {
  const m = MODES[modeIdx];
  if (m.kind === 'solid') {
    statLabelEl.innerHTML = 'V &middot; E &middot; F ';
    statValEl.textContent = NOP_STATS.V + ' · ' + NOP_STATS.E + ' · ' + NOP_STATS.Fmerged;
    statSubEl.textContent = (NOP_STATS.Fmerged - NOP_STATS.caps) + ' TRIANGLES + ' + NOP_STATS.caps + ' REGULAR 15-GONS · V−E+F=' + (NOP_STATS.V - NOP_STATS.E + NOP_STATS.Fmerged);
  } else {
    statLabelEl.textContent = 'BEST FIT SCALE ';
    statValEl.textContent = m.stats.best.toFixed(4);
    if (m.name === 'CUBE') {
      statSubEl.textContent = 'SAMPLES ' + m.stats.samples + ' · NIEUWLAND CONST. ' + NIEUWLAND.toFixed(4) + ' (LITERATURE)';
    } else {
      statSubEl.textContent = 'SAMPLES ' + m.stats.samples + (m.stats.best < 1 ? ' · NEVER ≥ 1.0000 YET' : '') + ' · EMPIRICAL SEARCH, NOT THE FULL PROOF';
    }
  }
}

function setMode(idx) {
  modeIdx = ((idx % MODES.length) + MODES.length) % MODES.length;
  const m = MODES[modeIdx];
  modeNameEl.textContent = m.name;
  descEl.innerHTML = m.desc;
}

resize();
setMode(0);

let lastT = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now-lastT)/1000); lastT = now;
  sweepT += dt;
  const m = MODES[modeIdx];
  if (!dragging) {
    if (m.kind === 'solid') {
      orbitYaw += 0.09*dt;
    } else {
      holeTheta += 0.045*dt;
      holePhi += holePhiDir * 0.05 * dt;
      if (holePhi > Math.PI-0.2) { holePhi = Math.PI-0.2; holePhiDir = -1; }
      if (holePhi < 0.2) { holePhi = 0.2; holePhiDir = 1; }
    }
  }
  if (m.kind === 'solid') drawSolid(); else drawRupert(m);
  if (Math.floor(sweepT*8) !== Math.floor((sweepT-dt)*8)) updateStats();
}
requestAnimationFrame(loop);

/* ── interaction: 2-axis drag orbits the camera (SOLID) or sets the hole's
 * view direction (CUBE/NOPERTHEDRON); tap without drag cycles mode. ────── */
let dragging = false, lastX = 0, lastY = 0, dragMoved = false;
function pointerDown(x,y){ dragging = true; lastX = x; lastY = y; dragMoved = false; }
function pointerMove(x,y){
  if (!dragging) return;
  const dx = x-lastX, dy = y-lastY;
  if (Math.abs(dx) + Math.abs(dy) > 4) dragMoved = true;
  const m = MODES[modeIdx];
  if (m.kind === 'solid') {
    orbitYaw += dx*0.007;
    orbitPitch = Math.max(0.15, Math.min(Math.PI-0.15, orbitPitch - dy*0.007));
  } else {
    holeTheta += dx*0.007;
    holePhi = Math.max(0.1, Math.min(Math.PI-0.1, holePhi - dy*0.007));
  }
  lastX = x; lastY = y;
}
function pointerUp(){ if (dragging && !dragMoved) setMode(modeIdx+1); dragging = false; }
canvas.addEventListener('mousedown', e => pointerDown(e.clientX, e.clientY));
window.addEventListener('mousemove', e => pointerMove(e.clientX, e.clientY));
window.addEventListener('mouseup', pointerUp);
canvas.addEventListener('touchstart', e => { e.preventDefault(); const t=e.touches[0]; pointerDown(t.clientX,t.clientY); }, {passive:false});
canvas.addEventListener('touchmove', e => { e.preventDefault(); const t=e.touches[0]; pointerMove(t.clientX,t.clientY); }, {passive:false});
canvas.addEventListener('touchend', e => { e.preventDefault(); pointerUp(); }, {passive:false});
</script>
</body>
</html>
