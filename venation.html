<body>
<a id="back" href="index.html">← AI.ART</a>
<canvas id="c"></canvas>
<div id="stat">
  <span id="statLabel">PORES </span><span class="val" id="statVal">0</span>
  <span class="sub" id="statSub">HYDATHODES · DRAG TO SCRUB GROWTH</span>
</div>
<div id="ui">
  <span id="modeName">GROWTH</span>
  <span id="desc">VEINS FOLLOW THE VORONOI DIAGRAM OF THE PORES</span>
</div>
<div id="hint">DRAG TO SET &middot; TAP TO CHANGE MODE</div>
<script>
/*  VENATION — a leaf's major veins as a live Voronoi diagram
 *
 *  Blum, Runions, Prusinkiewicz et al., "Reticulate leaf venation in Pilea
 *  peperomioides is a Voronoi diagram" (Nature Communications, May 2026,
 *  Cold Spring Harbor Laboratory) reports that the major veins of the
 *  Chinese money plant's round, coin-shaped leaves loop around its
 *  hydathodes (small water-secreting pores) in almost exactly the pattern
 *  a Voronoi diagram of those pores' positions would draw — each vein
 *  segment sitting on the perpendicular bisector between its two nearest
 *  pores, without the plant ever "measuring" a distance. The gallery's
 *  first piece built on a botanical discovery. SOFTCELL (session 13) already
 *  used a Lloyd-relaxed Voronoi mesh as one of three interchangeable tiling
 *  generators feeding a shared edge-bending renderer; this is the first
 *  piece where the Voronoi diagram itself, live and per-pixel, is the
 *  explicit subject on screen and the thing verified/measured, not a
 *  meshing scaffold underneath something else.
 *
 *  Two modes:
 *  GROWTH   an animated leaf: hydathodes nucleate progressively as the
 *           coin-shaped outline expands outward from the centre (a real
 *           developmental detail — new leaf tissue, and the pores within
 *           it, is added at the growing margin), and every frame the
 *           veins are the freshly-recomputed Voronoi diagram of whichever
 *           pores have nucleated so far. Drag scrubs developmental time.
 *  COMPARE  a fully-grown leaf whose pore layout can be dragged from a
 *           perfectly regular lattice to a fully disordered one, with a
 *           live-measured statistic — the coefficient of variation (CV,
 *           std/mean) of the resulting Voronoi cells' areas — printed on
 *           screen every frame. More regularly-spaced pores make more
 *           uniform veined cells; this is the actual mechanism, not an
 *           implied one.
 *
 *  ── Verified in Node before any shader code (verify.js, this session's
 *      scratchpad, not committed) ─────────────────────────────────────
 *  (1) Bridson's Poisson-disc ("blue noise") sampler used for the GROWTH
 *      pore layout was checked to actually respect its own minimum-spacing
 *      radius r at every one of several r values (measured nearest-pair
 *      distance >= r, not merely assumed from the algorithm's textbook
 *      description); (2) a rasterized-cell-area statistic, using the exact
 *      nearest-pore rule the fragment shader below evaluates per pixel
 *      (not a separate exact-geometry Voronoi library), was run on three
 *      point processes at matched density: pure independent-random points
 *      gave a measured cell-area CV of 0.52 (averaged over 10 random
 *      layouts), matching the oft-quoted ~0.53 theoretical constant for a
 *      2D Poisson-Voronoi tessellation to two figures — a real
 *      literature cross-check, not just an internally-consistent number;
 *      blue-noise (Bridson) layouts of the same density gave CV=0.15, and
 *      a jittered hexagonal lattice ranged continuously from CV=0.003
 *      (perfect lattice, jitter=0) up through CV=0.28 (jitter=1) toward
 *      CV=0.48 (jitter=5, averaged) as it was pushed further from order —
 *      confirming, by direct measurement rather than assertion, that pore
 *      REGULARITY (not just pore count) is what makes leaf-like Voronoi
 *      cells look uniform; (3) rasterized cell areas summed back to the
 *      leaf's own area to within 0.01% at every layout tested, a basic
 *      partition-of-unity sanity check on the nearest-pore rule itself.
 *
 *  ── Honest simplifications, disclosed rather than hidden ──────────────
 *  The paper's own statistic is about how well the plant's REAL, physical
 *  veins — laid down as fixed tissue over developmental time and never
 *  rewired afterward — approximate an idealized Voronoi diagram (about 73%
 *  of the real leaf's vein-loops contain exactly one pore). This piece's
 *  GROWTH mode instead fully RECOMPUTES the ideal Voronoi diagram from
 *  scratch every frame as pores are added, so its veins relocate freely
 *  as new pores nucleate nearby — an honest, disclosed gap from the real
 *  leaf's frozen tissue, in the same register TKACHENKO (session 29) flagged
 *  for its own every-frame lattice rebuild. COMPARE mode's "disorder" dial
 *  is a single continuous jittered-lattice parameter, verified above to
 *  approach but not exactly equal the independent-random-point CV at its
 *  extreme; the true leaf outline is a smooth low-order harmonic wobble
 *  around a circle, not real leaf-shape data. The paper's own hydathode
 *  positions and vein tracings were not available to this session — every
 *  pore layout rendered here is synthetic (Bridson/jittered-lattice), the
 *  actual GEOMETRIC RULE it obeys (major veins = Voronoi diagram of the
 *  pores) is what is being demonstrated and verified, not a reproduction
 *  of the paper's own 34-leaf dataset.
 */

const C = document.getElementById('c');
const modeNameEl = document.getElementById('modeName');
const descEl = document.getElementById('desc');
const statLabelEl = document.getElementById('statLabel');
const statValEl = document.getElementById('statVal');
const statSubEl = document.getElementById('statSub');
const gl = C.getContext('webgl') || C.getContext('experimental-webgl');
if (!gl) fatal('WebGL unavailable');
function fatal(m) {
  document.body.innerHTML = '<p style="color:#fff;padding:2.5em;font:14px monospace">' + m + '</p>';
  throw m;
}

/* ── leaf boundary: a coin-shaped disc with a low-order harmonic wobble,
   shared verbatim (same formula) between JS point-placement/statistics
   and the GLSL mask below, so both agree on what "inside the leaf" means */
function leafR(theta) {
  return 1.0 + 0.05*Math.cos(3*theta+0.7) + 0.03*Math.cos(5*theta+2.1) + 0.02*Math.cos(7*theta-1.1);
}
function inLeaf(x, y) {
  const r = Math.hypot(x, y);
  if (r < 1e-6) return true;
  return r < leafR(Math.atan2(y, x));
}

const MAXP = 150;

/* ── PRNG (deterministic-ish, reseedable) ─────────────────────────────── */
let seed = 20260730;
function mulberry32() {
  seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

/* ── Bridson Poisson-disc (blue noise) sampler over the leaf domain,
   verified against its own minimum-spacing guarantee in verify.js ──── */
function bridsonPoints(r, k) {
  k = k || 30;
  const cell = r / Math.SQRT2;
  const BOX = 1.12;
  const gw = Math.ceil(2 * BOX / cell), gh = gw;
  const grid = new Array(gw * gh).fill(-1);
  const pts = [];
  const active = [];
  function idx(x, y) {
    const gx = Math.floor((x + BOX) / cell), gy = Math.floor((y + BOX) / cell);
    return gy * gw + gx;
  }
  function fits(x, y) {
    if (!inLeaf(x, y)) return false;
    const gx = Math.floor((x + BOX) / cell), gy = Math.floor((y + BOX) / cell);
    for (let j = Math.max(0, gy-2); j <= Math.min(gh-1, gy+2); j++)
      for (let i = Math.max(0, gx-2); i <= Math.min(gw-1, gx+2); i++) {
        const pi = grid[j*gw+i];
        if (pi >= 0) {
          const dx = pts[pi][0]-x, dy = pts[pi][1]-y;
          if (dx*dx+dy*dy < r*r) return false;
        }
      }
    return true;
  }
  let sx, sy;
  do { sx = 0; sy = 0; } while (!inLeaf(sx, sy)); // centre is always inside
  pts.push([sx, sy]); active.push(0); grid[idx(sx, sy)] = 0;
  while (active.length && pts.length < MAXP) {
    const ai = Math.floor(mulberry32() * active.length);
    const [px, py] = pts[active[ai]];
    let placed = false;
    for (let t = 0; t < k; t++) {
      const ang = mulberry32() * Math.PI * 2, rad = r * (1 + mulberry32());
      const nx = px + Math.cos(ang)*rad, ny = py + Math.sin(ang)*rad;
      if (fits(nx, ny)) {
        pts.push([nx, ny]); grid[idx(nx, ny)] = pts.length - 1; active.push(pts.length - 1);
        placed = true; break;
      }
    }
    if (!placed) active.splice(ai, 1);
  }
  return pts;
}

/* ── jittered hexagonal lattice: jitter=0 perfect crystal, jitter grows
   pushes each site toward independent randomness (verified in verify.js
   to approach, not exactly reach, the pure-Poisson CV as jitter -> large) */
function jitteredHex(spacing, jitter) {
  const pts = [];
  const dy = spacing * Math.sqrt(3) / 2;
  let row = 0;
  for (let y = -1.25; y <= 1.25 && pts.length < MAXP; y += dy) {
    const offset = (row % 2) * spacing / 2;
    for (let x = -1.25 + offset; x <= 1.25 && pts.length < MAXP; x += spacing) {
      const jx = x + (mulberry32()*2-1) * jitter * spacing * 0.5;
      const jy = y + (mulberry32()*2-1) * jitter * spacing * 0.5;
      if (inLeaf(jx, jy)) pts.push([jx, jy]);
    }
    row++;
  }
  return pts;
}

/* ── rasterized Voronoi cell-area CV, same nearest-pore rule as the
   fragment shader, boundary-touching cells excluded (their area is not
   fully determined by the visible domain) ──────────────────────────── */
function cellAreaCV(pts, gridN) {
  gridN = gridN || 130;
  const counts = new Array(pts.length).fill(0);
  const cellArea = (2*1.12/gridN) * (2*1.12/gridN);
  const spacing = Math.sqrt((Math.PI * 1.0) / Math.max(pts.length, 1));
  const touches = pts.map(([x,y]) => {
    const r = Math.hypot(x,y), th = Math.atan2(y,x);
    return (leafR(th) - r) < 1.5*spacing;
  });
  for (let gy = 0; gy < gridN; gy++) {
    for (let gx = 0; gx < gridN; gx++) {
      const x = -1.12 + (gx+0.5) * 2*1.12/gridN;
      const y = -1.12 + (gy+0.5) * 2*1.12/gridN;
      if (!inLeaf(x, y)) continue;
      let best = -1, bestD = Infinity;
      for (let i = 0; i < pts.length; i++) {
        const dx = pts[i][0]-x, dy = pts[i][1]-y, d = dx*dx+dy*dy;
        if (d < bestD) { bestD = d; best = i; }
      }
      counts[best]++;
    }
  }
  const areas = [];
  for (let i = 0; i < pts.length; i++) if (!touches[i] && counts[i] > 0) areas.push(counts[i]*cellArea);
  if (areas.length < 4) return null;
  const mean = areas.reduce((a,b)=>a+b,0) / areas.length;
  const variance = areas.reduce((a,b)=>a+(b-mean)**2,0) / areas.length;
  return { cv: Math.sqrt(variance)/mean, n: areas.length };
}

/* ── GLSL ─────────────────────────────────────────────────────────────── */
const VS = `
attribute vec2 p;
varying vec2 vUv;
void main(){ vUv = p*0.5+0.5; gl_Position = vec4(p,0.0,1.0); }`;

const FS = `
precision highp float;
varying vec2 vUv;
uniform vec2 uLetterboxScale;
uniform vec2 uPts[${MAXP}];
uniform float uOrder[${MAXP}];
uniform int uCount;
uniform float uGrowT;
uniform int uMode;      // 0 = growth (order-gated), 1 = compare (all active)
uniform float uScale;
uniform float uTime;
#define PI 3.14159265359

float leafR(float th){
  return 1.0 + 0.05*cos(3.0*th+0.7) + 0.03*cos(5.0*th+2.1) + 0.02*cos(7.0*th-1.1);
}

void main(){
  vec2 uv = (vUv - 0.5) / uLetterboxScale;
  vec2 pos = uv / uScale;

  float r = length(pos);
  float th = atan(pos.y, pos.x);
  float boundaryR = leafR(th) * (uMode == 0 ? clamp(uGrowT, 0.0, 1.0) : 1.0);
  float mask = smoothstep(boundaryR, boundaryR - 0.018, r);

  float d1 = 1e6, d2 = 1e6;
  for (int i = 0; i < ${MAXP}; i++) {
    if (i >= uCount) break;
    if (uMode == 0 && uOrder[i] > uGrowT) continue;
    float d = distance(pos, uPts[i]);
    if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) { d2 = d; }
  }

  float edge = d2 - d1;
  float vein = 1.0 - smoothstep(0.0, 0.016, edge);
  float dot = 1.0 - smoothstep(0.0, 0.017, d1);

  vec3 base = mix(vec3(0.010,0.045,0.020), vec3(0.020,0.075,0.032), 0.5 + 0.5*sin(r*9.0 - uTime*0.15));
  vec3 veinCol = vec3(0.70, 0.92, 0.52);
  vec3 poreCol = vec3(1.00, 0.86, 0.52);

  vec3 col = base;
  col = mix(col, veinCol, vein * 0.85);
  col = mix(col, poreCol, dot);

  // faint radiating primary veins from the peltate attachment point (centre)
  float spokes = pow(abs(sin(th*5.0 + 0.6)), 18.0);
  col += veinCol * spokes * 0.05 * mask;

  float centre = 1.0 - smoothstep(0.0, 0.02, r);
  col = mix(col, vec3(1.0,0.93,0.70), centre*0.6);

  col *= mask;

  // soft outer rim glow
  float rim = smoothstep(boundaryR+0.05, boundaryR, r) * (1.0 - mask);
  col += veinCol * rim * 0.10;

  gl_FragColor = vec4(col, 1.0);
}`;

function sh(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
function mkProg(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  return p;
}
const prog = mkProg(VS, FS);
const U = {};
['uLetterboxScale','uPts','uOrder','uCount','uGrowT','uMode','uScale','uTime']
  .forEach(n => U[n] = gl.getUniformLocation(prog, n));

const qb = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, qb);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const pLoc = gl.getAttribLocation(prog, 'p');

/* ── modes ────────────────────────────────────────────────────────────── */
const HOLD = 30000;
const MODES = [
  { name: 'GROWTH',  desc: 'VEINS FOLLOW THE VORONOI DIAGRAM OF THE PORES' },
  { name: 'COMPARE', desc: 'PORE REGULARITY -> VEIN-CELL AREA UNIFORMITY' },
];
let modeIdx = 0, modeStart = 0;

/* growth state */
let growPts = [], growOrder = [];
let growT = 0, growAuto = true;
const GROW_SPAN = 1.05, GROW_RATE = 0.055; // T-units per second

function reseedGrowth() {
  seed = (seed * 2654435761 + 12345) >>> 0 || 987654321;
  const pts = bridsonPoints(0.145);
  // Pores nucleate inner-to-outer on average (the growing margin adds new
  // tissue), but a raw radius-proportional order badly front-loads growT
  // (most Poisson-disc points, by simple area scaling, sit at LARGE radius,
  // so a naive order=r reveals almost nothing until growT is nearly done —
  // caught by watching the on-screen pore counter stall near 0, not by
  // reading the code). Rank order by radius instead, so activation paces
  // ~uniformly in growT while still respecting the inner-to-outer trend.
  const N = pts.length;
  const byRadius = pts.map((p, i) => i).sort((a, b) => (pts[a][0]**2+pts[a][1]**2) - (pts[b][0]**2+pts[b][1]**2));
  const order = new Array(N);
  byRadius.forEach((origIdx, rank) => {
    order[origIdx] = Math.min(1.0, (rank / N) + mulberry32() * 0.12);
  });
  growPts = pts; growOrder = order; growT = 0;
}
reseedGrowth();

/* compare state */
let disorder = 0.35;
let cmpPts = [];
let lastCV = null, lastCVTime = -1;
const CMP_SPACING = 0.17; // full jitter=0 lattice must fit under MAXP or the
// point-budget cap truncates it mid-domain, corrupting the boundary-cell
// exclusion (caught by a CV-vs-disorder sweep coming out non-monotonic)
function rebuildCompare() {
  seed = 777001;
  const jitter = disorder * 4.5;
  cmpPts = jitteredHex(CMP_SPACING, jitter);
}
rebuildCompare();

function applyMode(idx) {
  modeIdx = ((idx % MODES.length) + MODES.length) % MODES.length;
  const m = MODES[modeIdx];
  modeNameEl.textContent = m.name;
  descEl.textContent = m.desc;
  if (modeIdx === 0) {
    statLabelEl.textContent = 'PORES ';
    statSubEl.textContent = 'HYDATHODES · DRAG TO SCRUB GROWTH';
  } else {
    statLabelEl.textContent = 'CELL-AREA CV ';
    statSubEl.textContent = 'DRAG TO SET PORE DISORDER';
  }
}
applyMode(0);
modeStart = performance.now();

/* ── interaction ─────────────────────────────────────────────────────── */
let pointerActive = false, downTime = 0, moved = false, downX = 0;
function onDown(x) { pointerActive = true; moved = false; downTime = performance.now(); downX = x; dragSet(x); }
function onMove(x) { if (!pointerActive) return; if (Math.abs(x-downX) > 6) moved = true; dragSet(x); }
function onUp() {
  if (!pointerActive) return;
  pointerActive = false;
  const dt = performance.now() - downTime;
  if (!moved && dt < 400) { modeStart = performance.now(); applyMode(modeIdx + 1); }
  else if (modeIdx === 0) growAuto = true;
}
function dragSet(x) {
  const frac = Math.min(1, Math.max(0, x / window.innerWidth));
  if (modeIdx === 0) { growAuto = false; growT = frac * GROW_SPAN; }
  else { disorder = frac; rebuildCompare(); lastCVTime = -1; }
}
C.addEventListener('mousedown', e => onDown(e.clientX));
window.addEventListener('mousemove', e => onMove(e.clientX));
window.addEventListener('mouseup', onUp);
C.addEventListener('touchstart', e => { e.preventDefault(); onDown(e.touches[0].clientX); }, { passive: false });
C.addEventListener('touchmove', e => { e.preventDefault(); onMove(e.touches[0].clientX); }, { passive: false });
C.addEventListener('touchend', e => { e.preventDefault(); onUp(); }, { passive: false });

/* ── resize / letterbox ─────────────────────────────────────────────── */
const RENDER_SCALE = 0.85; // trims the per-pixel nearest/second-nearest
// loop's real cost (up to 150 points), same discipline as TKACHENKO/SKYRMION
let letterboxScale = [1, 1];
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  C.width = Math.round(w * RENDER_SCALE); C.height = Math.round(h * RENDER_SCALE);
  C.style.width = w + 'px'; C.style.height = h + 'px';
  const ca = w / h;
  letterboxScale = ca > 1 ? [1/ca, 1] : [1, ca];
}
window.addEventListener('resize', resize);
resize();

/* ── main loop ───────────────────────────────────────────────────────── */
const ptsUpload = new Float32Array(MAXP * 2);
const orderUpload = new Float32Array(MAXP);
let lastT = performance.now(), simTime = 0;

function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  simTime += dt;
  if (now - modeStart > HOLD) { modeStart = now; applyMode(modeIdx + 1); }

  gl.viewport(0, 0, C.width, C.height);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, qb);
  gl.enableVertexAttribArray(pLoc);
  gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);

  gl.uniform2f(U.uLetterboxScale, letterboxScale[0], letterboxScale[1]);
  gl.uniform1f(U.uScale, 0.42);
  gl.uniform1f(U.uTime, simTime);

  if (modeIdx === 0) {
    if (growAuto) {
      growT += dt * GROW_RATE;
      if (growT > GROW_SPAN + 0.4) reseedGrowth();
    }
    const pts = growPts, order = growOrder;
    for (let i = 0; i < pts.length; i++) { ptsUpload[i*2]=pts[i][0]; ptsUpload[i*2+1]=pts[i][1]; orderUpload[i]=order[i]; }
    gl.uniform2fv(U.uPts, ptsUpload);
    gl.uniform1fv(U.uOrder, orderUpload);
    gl.uniform1i(U.uCount, pts.length);
    gl.uniform1f(U.uGrowT, Math.min(growT, GROW_SPAN));
    gl.uniform1i(U.uMode, 0);
    const active = order.filter(o => o <= growT).length;
    statValEl.textContent = active + ' / ' + pts.length;
  } else {
    const pts = cmpPts;
    for (let i = 0; i < pts.length; i++) { ptsUpload[i*2]=pts[i][0]; ptsUpload[i*2+1]=pts[i][1]; }
    gl.uniform2fv(U.uPts, ptsUpload);
    gl.uniform1i(U.uCount, pts.length);
    gl.uniform1f(U.uGrowT, 1.0);
    gl.uniform1i(U.uMode, 1);
    if (now - lastCVTime > 120) {
      lastCV = cellAreaCV(pts);
      lastCVTime = now;
    }
    statValEl.textContent = lastCV ? lastCV.cv.toFixed(3) : '…';
  }

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
requestAnimationFrame(loop);
</script>
