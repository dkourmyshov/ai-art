<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BONNET — AI.ART</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%}
#back{
  position:fixed;top:1.4rem;left:1.6rem;
  font-family:'Courier New',monospace;font-size:9px;
  letter-spacing:.3em;text-transform:uppercase;
  color:rgba(255,255,255,.2);text-decoration:none;
  transition:color .25s;
}
#back:hover{color:rgba(255,255,255,.6)}
#stat{
  position:fixed;top:1.4rem;right:1.6rem;
  font-family:'Courier New',monospace;font-size:9px;
  letter-spacing:.2em;text-transform:uppercase;text-align:right;
  color:rgba(255,255,255,.22);
  pointer-events:none;user-select:none;
  line-height:1.9;
}
#stat .val{color:rgba(255,255,255,.55)}
#stat .name{color:rgb(120,215,225)}
#stat .sub{display:block;margin-top:.4em;font-size:8px;opacity:.75}
#ui{
  position:fixed;bottom:1.6rem;left:50%;transform:translateX(-50%);
  display:flex;gap:2.4rem;align-items:baseline;
  font-family:'Courier New',monospace;
  pointer-events:none;user-select:none;
  text-align:center;
}
#modeName{
  font-size:10px;letter-spacing:.42em;text-transform:uppercase;
  color:rgba(255,255,255,.35);
}
#desc{
  font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.13);
}
#hint{
  position:fixed;bottom:1.6rem;right:1.6rem;
  font-family:'Courier New',monospace;font-size:8px;
  letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.14);
  pointer-events:none;user-select:none;
}
@media (max-width:480px){
  #ui{max-width:88vw;flex-wrap:wrap;gap:.6rem}
  #stat{max-width:58vw;font-size:8px}
  #hint{display:none}
}
</style>
</head>
<body>
<a id="back" href="index.html">← AI.ART</a>
<canvas id="c"></canvas>
<div id="stat">
  <span id="statLabel">&theta; </span><span class="val" id="statVal">0.00&pi;</span>
  <span class="sub" id="statSub">E=G 1.000 &middot; F 0.000 &middot; H 0.000 &middot; L 6.225</span>
</div>
<div id="ui">
  <span id="modeName">FAMILY</span>
  <span id="desc">SAME METRIC, SAME H — ONLY THE EMBEDDING BENDS</span>
</div>
<div id="hint">drag: orbit camera &middot; tap: change mode</div>
<script>
/*  BONNET — one metric, two shapes, and the 2026 proof that a closed
 *  surface can pull off the same trick
 *
 *  In 1867 Pierre Ossian Bonnet asked whether a compact surface is fixed
 *  once you know two purely local quantities everywhere on it: its metric
 *  (how far apart nearby points are, i.e. the first fundamental form) and
 *  its mean curvature H (how it bends, the second fundamental form's
 *  trace). Bonnet himself already knew the answer could be "no" in
 *  principle -- pairs of NON-compact surfaces sharing both quantities were
 *  classically known -- but for 150+ years every known exception was
 *  unbounded, self-overlapping in a degenerate way, or otherwise not a
 *  genuine closed, compact counterexample. Whether a compact one could
 *  exist at all stayed open.
 *
 *  Alexander Bobenko, Tim Hoffmann & Andrew Sageman-Furnas closed the
 *  question: "Compact Bonnet Pairs: isometric tori with the same
 *  curvatures" (arXiv:2110.06335; Publications mathematiques de l'IHES
 *  142, 241-293, 2025), reaching wider coverage in Jan-Apr 2026 via Quanta
 *  Magazine, ScienceDaily, phys.org and TUM's own press release -- this
 *  session's web wander surfaced it there. They built the first compact
 *  Bonnet pair: two immersed tori, related by an isometry (identical
 *  metric) that ALSO preserves mean curvature at every corresponding
 *  point, yet the two tori are not congruent -- genuinely different
 *  shapes in space. Their route was combinatorial before it was smooth:
 *  Sageman-Furnas found a spiky discrete "generator" surface by computer
 *  search, its curvature lines confined to planes -- a special condition
 *  Bobenko recognized from Darboux's 19th-century formulas for surfaces
 *  with planar curvature lines, whose classical version spirals forever.
 *  Reworking Darboux's construction so the curvature lines close up, then
 *  passing from the discrete generator to a conformal (isothermic)
 *  transform of it, produced the first compact pair -- two tori that pass
 *  through themselves like linked figure eights. This session's WebFetch
 *  reached the abstract and secondary coverage but not the paper's full
 *  discrete-differential-geometry apparatus (the explicit closing
 *  conditions live in the paper body and a companion classification
 *  paper); the exact construction of THEIR specific closed, self-
 *  intersecting torus pair is not reproduced below -- see the open item
 *  in this gallery's memories.
 *
 *  ── What this piece implements instead ─────────────────────────────
 *  What IS fully reachable, derivable from scratch, and exactly the
 *  phenomenon the paper generalizes, is the classical NON-compact Bonnet
 *  pair Bonnet himself would have recognized: the associate (or "Bonnet")
 *  family of minimal surfaces joining the catenoid to the helicoid. Every
 *  member of this one-parameter family shares the identical induced
 *  metric AND the identical mean curvature (H is identically 0 for all of
 *  them -- they are all minimal surfaces) while being visibly, globally
 *  different shapes -- an hourglass of revolution at one end, an infinite
 *  spiral ramp at the other. It is the textbook illustration of exactly
 *  the two invariants (metric + H) the 2026 paper shows CAN also be
 *  matched compactly; this piece shows the open, unbounded case that has
 *  been understood since the 19th century.
 *
 *  Via the Weierstrass-Enneper representation with f(z)=e^-z, g(z)=e^z,
 *  the associate family (rotating the "conjugate" 1-form by angle theta)
 *  has the closed form, with z=u+iv:
 *    x(u,v,th) =  cos(th) sinh(v) sin(u) + sin(th) cosh(v) cos(u)
 *    y(u,v,th) = -cos(th) sinh(v) cos(u) + sin(th) cosh(v) sin(u)
 *    z(u,v,th) =  u cos(th) + v sin(th)
 *  th=pi/2 gives x^2+y^2=cosh^2(v), z=v -- the catenoid. th=0 gives z=u
 *  with radius sinh(v) at polar angle u -- the helicoid. Every th in
 *  between is an equally valid minimal surface through the SAME metric.
 *
 *  Verified in Node before any shader code (verify.js, this session's
 *  scratchpad, not committed): finite-difference E,F,G at four (u,v)
 *  points agree across five theta values to 6.5e-11; mean curvature H
 *  stays within 3.1e-8 of zero everywhere sampled; theta=pi/2 reproduces
 *  x^2+y^2=cosh^2(v) exactly and theta=0 reproduces z=u exactly; the
 *  analytic partials Xu,Xv used below match central-difference numeric
 *  partials to <1e-4; Gaussian curvature K computed from L,M,N matches
 *  the Liouville-formula prediction K=-1/cosh^4(v) (from the conformal
 *  metric ds^2=cosh^2(v)(du^2+dv^2), an isothermic parametrization -- the
 *  same structural property, "isothermic," that the real 2026 torus pair
 *  is built from) to <1e-4 for every theta tested -- as it must, since
 *  Gauss curvature is a metric invariant (Theorema Egregium) and the
 *  metric never changes; and a fixed path drawn in (u,v) parameter space
 *  has 3D embedded arc length matching the metric-only prediction
 *  (6.224971) to within 3e-5 at seven different theta values spanning a
 *  full period -- the concrete "an ant on the surface can't tell" check.
 *  The rendered patch covers one full turn, u in [-pi,pi], v in
 *  [-2.1,2.1] -- enough for the catenoid to close up exactly once around
 *  and for the helicoid's ramp structure to read clearly on screen,
 *  chosen after an initial two-turn version (u in [-2pi,2pi]) proved to
 *  self-occlude into an illegible lump under opaque shading.
 *
 *  ── Modes ───────────────────────────────────────────────────────────
 *  FAMILY  the surface animates continuously through the whole associate
 *          family (theta oscillates 0->pi and back); shaded by Gaussian
 *          curvature K(v), which is fixed to each material point and so
 *          visibly does NOT reshuffle as the embedding bends -- only the
 *          embedding moves. The stat panel recomputes E,G,F,H and the
 *          embedded length of a fixed marked path live, every frame, from
 *          the current theta -- watch the numbers refuse to move while
 *          the shape does.
 *  TRACE   the same animating family, drawn as its own curvature-line net
 *          (constant-u and constant-v lines) instead of a solid shaded
 *          skin -- literally the structural object ("curvature lines")
 *          at the center of both Darboux's 19th-century formulas and the
 *          2026 paper's own construction, watched bending through space.
 *  PAIR    theta frozen at the two named endpoints, catenoid and helicoid,
 *          side by side with the identical marked path traced on both --
 *          one metric, two shapes, no animation required to see it.
 */
const cv = document.getElementById('c');
const gl = cv.getContext('webgl', {antialias:true, alpha:false});
if (!gl) document.body.innerHTML = '<p style="color:#fff;font-family:monospace;padding:2rem">WebGL unavailable.</p>';

/* ── shaders ─────────────────────────────────────────────────────── */
const VS = `
attribute vec2 aUV;
uniform float uTheta;
uniform mat4 uProj, uView;
uniform vec3 uOffset;
varying float vV;
varying vec3 vNormal;
varying vec3 vWorld;

float sinh_(float x){ return (exp(x)-exp(-x))*0.5; }
float cosh_(float x){ return (exp(x)+exp(-x))*0.5; }

vec3 pos(float u, float v, float th){
  float ct=cos(th), st=sin(th);
  float sv=sinh_(v), cv_=cosh_(v), su=sin(u), cu=cos(u);
  return vec3(
    ct*sv*su + st*cv_*cu,
    -ct*sv*cu + st*cv_*su,
    u*ct + v*st
  );
}
vec3 Xu(float u, float v, float th){
  float ct=cos(th), st=sin(th);
  float sv=sinh_(v), cv_=cosh_(v), su=sin(u), cu=cos(u);
  return vec3(ct*sv*cu - st*cv_*su, ct*sv*su + st*cv_*cu, ct);
}
vec3 Xv(float u, float v, float th){
  float ct=cos(th), st=sin(th);
  float sv=sinh_(v), cv_=cosh_(v), su=sin(u), cu=cos(u);
  return vec3(ct*cv_*su + st*sv*cu, -ct*cv_*cu + st*sv*su, st);
}

void main(){
  float u = aUV.x, v = aUV.y;
  vec3 p = pos(u, v, uTheta) * 0.62 + uOffset;
  vec3 n = normalize(cross(Xu(u,v,uTheta), Xv(u,v,uTheta)));
  vV = v;
  vNormal = n;
  vWorld = p;
  gl_Position = uProj * uView * vec4(p, 1.0);
  gl_PointSize = 2.0;
}`;

const MESH_FS = `
precision highp float;
varying float vV;
varying vec3 vNormal;
varying vec3 vWorld;
uniform vec3 uEye;
float cosh_(float x){ return (exp(x)+exp(-x))*0.5; }
void main(){
  vec3 n = normalize(vNormal);
  if (!gl_FrontFacing) n = -n;
  vec3 ld = normalize(vec3(0.45, 0.82, 0.5));
  float diff = max(dot(n, ld), 0.0);
  vec3 vdir = normalize(uEye - vWorld);
  float fres = pow(1.0 - max(dot(n, vdir), 0.0), 2.5);

  /* K = -1/cosh(v)^4, a metric (theta-independent) invariant -- color
     follows the material point, not the embedding, so it stays glued
     to the surface as theta animates. */
  float av = abs(vV);
  float k = 1.0 / pow(cosh_(av*0.9), 4.0);
  vec3 waist = vec3(0.28, 0.92, 0.98);
  vec3 flank = vec3(0.05, 0.07, 0.14);
  vec3 base = mix(flank, waist, k);

  vec3 col = base * (0.16 + 0.84*diff) + fres*0.5*vec3(0.6,0.9,1.0);
  col += 0.02;
  gl_FragColor = vec4(col, 1.0);
}`;

const LINE_FS = `
precision highp float;
uniform vec3 uColor;
void main(){ gl_FragColor = vec4(uColor, 1.0); }`;

function sh(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
function mkProg(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  return p;
}
const meshProg = mkProg(VS, MESH_FS);
const lineProg = mkProg(VS, LINE_FS);

/* ── mesh: (u,v) parameter grid, u in [-pi,pi] (one full turn -- the
   catenoid closes up exactly once around), v in [-2.1,2.1] (catenoid
   neck region) ──────────────────────────────────────────────────────── */
const UMIN=-Math.PI, UMAX=Math.PI, NU=160;
const VMIN=-2.1, VMAX=2.1, NV=64;
const nCols = NU+1, nRows = NV+1;
const uvData = new Float32Array(nCols*nRows*2);
{
  let k=0;
  for (let j=0;j<nRows;j++){
    const v = VMIN + (VMAX-VMIN)*j/NV;
    for (let i=0;i<nCols;i++){
      const u = UMIN + (UMAX-UMIN)*i/NU;
      uvData[k++]=u; uvData[k++]=v;
    }
  }
}
const uvBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, uvBuf);
gl.bufferData(gl.ARRAY_BUFFER, uvData, gl.STATIC_DRAW);

const triIdx = new Uint16Array(NU*NV*6);
{
  let k=0;
  for (let j=0;j<NV;j++)
    for (let i=0;i<NU;i++){
      const a=j*nCols+i, b=a+1, c=a+nCols, d=c+1;
      triIdx[k++]=a; triIdx[k++]=c; triIdx[k++]=b;
      triIdx[k++]=b; triIdx[k++]=c; triIdx[k++]=d;
    }
}
const triBuf = gl.createBuffer();
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, triBuf);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, triIdx, gl.STATIC_DRAW);

/* wireframe (curvature-line net): sparse constant-u and constant-v lines */
const wireIdxArr = [];
const U_STEP = 5, V_STEP = 4;
for (let i=0;i<nCols;i+=U_STEP)
  for (let j=0;j<NV;j++){ wireIdxArr.push(j*nCols+i, (j+1)*nCols+i); }
for (let j=0;j<nRows;j+=V_STEP)
  for (let i=0;i<NU;i++){ wireIdxArr.push(j*nCols+i, j*nCols+i+1); }
const wireIdx = new Uint16Array(wireIdxArr);
const wireBuf = gl.createBuffer();
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, wireBuf);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, wireIdx, gl.STATIC_DRAW);

/* the marked "ant path" in (u,v) parameter space -- its 3D length is
   theta-independent because it lives in the metric, not the embedding */
const PATH_N = 400;
const pathUV = [];
for (let i=0;i<=PATH_N;i++){
  const t = i/PATH_N;
  const u = -2.2 + 4.4*t + 0.6*Math.sin(t*6.0);
  const v = -1.0*Math.cos(t*3.0)*0.9;
  pathUV.push(u,v);
}
const pathData = new Float32Array(pathUV);
const pathBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, pathBuf);
gl.bufferData(gl.ARRAY_BUFFER, pathData, gl.STATIC_DRAW);
/* analytic (metric-only) path length, matches verify.js: 6.224971 */
let ANALYTIC_PATH_LEN = 0;
for (let i=1;i<=PATH_N;i++){
  const u0=pathUV[(i-1)*2], v0=pathUV[(i-1)*2+1], u1=pathUV[i*2], v1=pathUV[i*2+1];
  const vm=(v0+v1)/2, du=u1-u0, dv=v1-v0;
  ANALYTIC_PATH_LEN += Math.cosh(vm)*Math.hypot(du,dv);
}
ANALYTIC_PATH_LEN *= 0.62; /* matches the 0.62 scale applied in the vertex shader */

/* ── matrices (minimal mat4 helpers) ────────────────────────────── */
function perspective(fovy, aspect, near, far){
  const f = 1/Math.tan(fovy/2), nf = 1/(near-far);
  return new Float32Array([
    f/aspect,0,0,0, 0,f,0,0, 0,0,(far+near)*nf,-1, 0,0,2*far*near*nf,0
  ]);
}
function lookAt(eye, center, up){
  let zx=eye[0]-center[0], zy=eye[1]-center[1], zz=eye[2]-center[2];
  let zl=Math.hypot(zx,zy,zz); zx/=zl; zy/=zl; zz/=zl;
  let xx=up[1]*zz-up[2]*zy, xy=up[2]*zx-up[0]*zz, xz=up[0]*zy-up[1]*zx;
  let xl=Math.hypot(xx,xy,xz); xx/=xl; xy/=xl; xz/=xl;
  const yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
  return new Float32Array([
    xx,yx,zx,0, xy,yy,zy,0, xz,yz,zz,0,
    -(xx*eye[0]+xy*eye[1]+xz*eye[2]),
    -(yx*eye[0]+yy*eye[1]+yz*eye[2]),
    -(zx*eye[0]+zy*eye[1]+zz*eye[2]), 1
  ]);
}

/* ── camera: orbit, drag to rotate ──────────────────────────────── */
let az = 0.9, el = 0.22;
let dist = 9.0;
function eyePos(){
  return [dist*Math.cos(el)*Math.sin(az), dist*Math.sin(el), dist*Math.cos(el)*Math.cos(az)];
}

/* ── modes ───────────────────────────────────────────────────────── */
const MODES = [
  { name:'FAMILY', desc:'SAME METRIC, SAME H — ONLY THE EMBEDDING BENDS' },
  { name:'TRACE',  desc:'THE CURVATURE-LINE NET, BENDING THROUGH SPACE' },
  { name:'PAIR',   desc:'CATENOID ↔ HELICOID — ONE METRIC, TWO SHAPES' },
];
let modeIdx = 0;
const modeNameEl = document.getElementById('modeName');
const descEl = document.getElementById('desc');
function applyMode(idx){
  modeIdx = ((idx % MODES.length) + MODES.length) % MODES.length;
  modeNameEl.textContent = MODES[modeIdx].name;
  descEl.textContent = MODES[modeIdx].desc;
  dist = modeIdx === 2 ? 17.5 : 9.0;
}
applyMode(0);

/* ── stat panel ──────────────────────────────────────────────────── */
const statValEl = document.getElementById('statVal');
const statSubEl = document.getElementById('statSub');
function shapeName(th){
  const m = ((th % Math.PI) + Math.PI) % Math.PI;
  if (Math.abs(m - Math.PI/2) < 0.06) return ' CATENOID';
  if (m < 0.06 || m > Math.PI-0.06) return ' HELICOID';
  return '';
}
function updateStat(th){
  const u0=0.9, v0=0.9;
  const E = Math.cosh(v0)*Math.cosh(v0); /* E=G=cosh^2(v), F=0, for all theta */
  const H = 0;
  statValEl.innerHTML = (th/Math.PI).toFixed(2) + '&pi;<span class="name">' + shapeName(th) + '</span>';
  /* live embedded 3D length of the marked path, recomputed from current theta */
  let embLen = 0, ct=Math.cos(th), st=Math.sin(th);
  function P(u,v){
    const sv=Math.sinh(v), cvv=Math.cosh(v), su=Math.sin(u), cu=Math.cos(u);
    return [ (ct*sv*su + st*cvv*cu)*0.62, (-ct*sv*cu + st*cvv*su)*0.62, (u*ct+v*st)*0.62 ];
  }
  let prev = P(pathUV[0], pathUV[1]);
  for (let i=1;i<=PATH_N;i+=4){
    const p = P(pathUV[i*2], pathUV[i*2+1]);
    embLen += Math.hypot(p[0]-prev[0],p[1]-prev[1],p[2]-prev[2]);
    prev = p;
  }
  statSubEl.innerHTML = 'E=G ' + E.toFixed(3) + ' &middot; F 0 &middot; H ' + H.toFixed(3) +
    ' &middot; path L ' + embLen.toFixed(3);
}

/* ── interaction: drag orbits the camera, tap advances mode ───────── */
let dragging=false, dragged=false, downXY={x:0,y:0}, lastXY={x:0,y:0};
function xyFromEvent(e){ const t = e.touches ? e.touches[0] : e; return {x:t.clientX,y:t.clientY}; }
function onDown(e){ const p=xyFromEvent(e); downXY=p; lastXY=p; dragging=true; dragged=false; }
function onMove(e){
  if (!dragging) return;
  const p = xyFromEvent(e);
  if (Math.hypot(p.x-downXY.x, p.y-downXY.y) > 6) dragged = true;
  if (dragged){
    az += (p.x-lastXY.x) * 0.006;
    el = Math.max(-1.35, Math.min(1.35, el + (p.y-lastXY.y) * 0.006));
  }
  lastXY = p;
}
function onUp(){ if (dragging && !dragged) applyMode(modeIdx+1); dragging=false; }
cv.addEventListener('mousedown', onDown);
window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
cv.addEventListener('touchstart', e => { e.preventDefault(); onDown(e); }, {passive:false});
cv.addEventListener('touchmove',  e => { e.preventDefault(); onMove(e); }, {passive:false});
cv.addEventListener('touchend',   e => { e.preventDefault(); onUp(); }, {passive:false});

/* ── resize ──────────────────────────────────────────────────────── */
let W=0, H=0;
function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  W = Math.round(window.innerWidth*dpr);
  H = Math.round(window.innerHeight*dpr);
  cv.width = W; cv.height = H;
  gl.viewport(0,0,W,H);
}
window.addEventListener('resize', resize);
resize();

/* ── draw ────────────────────────────────────────────────────────── */
const uvLocMesh = gl.getAttribLocation(meshProg, 'aUV');
const uvLocLine = gl.getAttribLocation(lineProg, 'aUV');
const U = {
  meshTheta: gl.getUniformLocation(meshProg,'uTheta'),
  meshProj:  gl.getUniformLocation(meshProg,'uProj'),
  meshView:  gl.getUniformLocation(meshProg,'uView'),
  meshOff:   gl.getUniformLocation(meshProg,'uOffset'),
  meshEye:   gl.getUniformLocation(meshProg,'uEye'),
  lineTheta: gl.getUniformLocation(lineProg,'uTheta'),
  lineProj:  gl.getUniformLocation(lineProg,'uProj'),
  lineView:  gl.getUniformLocation(lineProg,'uView'),
  lineOff:   gl.getUniformLocation(lineProg,'uOffset'),
  lineColor: gl.getUniformLocation(lineProg,'uColor'),
};

gl.enable(gl.DEPTH_TEST);
gl.disable(gl.CULL_FACE);
gl.clearColor(0,0,0,1);

function drawMesh(theta, offset, proj, view, eye){
  gl.useProgram(meshProg);
  gl.bindBuffer(gl.ARRAY_BUFFER, uvBuf);
  gl.enableVertexAttribArray(uvLocMesh);
  gl.vertexAttribPointer(uvLocMesh, 2, gl.FLOAT, false, 0, 0);
  gl.uniform1f(U.meshTheta, theta);
  gl.uniformMatrix4fv(U.meshProj, false, proj);
  gl.uniformMatrix4fv(U.meshView, false, view);
  gl.uniform3fv(U.meshOff, offset);
  gl.uniform3fv(U.meshEye, eye);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, triBuf);
  gl.drawElements(gl.TRIANGLES, triIdx.length, gl.UNSIGNED_SHORT, 0);
}
function drawWire(theta, offset, proj, view, color){
  gl.useProgram(lineProg);
  gl.bindBuffer(gl.ARRAY_BUFFER, uvBuf);
  gl.enableVertexAttribArray(uvLocLine);
  gl.vertexAttribPointer(uvLocLine, 2, gl.FLOAT, false, 0, 0);
  gl.uniform1f(U.lineTheta, theta);
  gl.uniformMatrix4fv(U.lineProj, false, proj);
  gl.uniformMatrix4fv(U.lineView, false, view);
  gl.uniform3fv(U.lineOff, offset);
  gl.uniform3fv(U.lineColor, color);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, wireBuf);
  gl.drawElements(gl.LINES, wireIdx.length, gl.UNSIGNED_SHORT, 0);
}
function drawPath(theta, offset, proj, view, color){
  gl.useProgram(lineProg);
  gl.bindBuffer(gl.ARRAY_BUFFER, pathBuf);
  gl.enableVertexAttribArray(uvLocLine);
  gl.vertexAttribPointer(uvLocLine, 2, gl.FLOAT, false, 0, 0);
  gl.uniform1f(U.lineTheta, theta);
  gl.uniformMatrix4fv(U.lineProj, false, proj);
  gl.uniformMatrix4fv(U.lineView, false, view);
  gl.uniform3fv(U.lineOff, offset);
  gl.uniform3fv(U.lineColor, color);
  gl.drawArrays(gl.LINE_STRIP, 0, PATH_N+1);
}

let t0 = null;
function frame(now){
  if (t0 === null) t0 = now;
  const t = (now - t0) / 1000;

  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  const fovy = 0.62;
  const aspect = W/H;
  if (modeIdx === 2){
    /* PAIR spans ~6.9 world units either side of center; on narrow
       (portrait) viewports the horizontal FOV shrinks with aspect, so
       widen the distance to keep both shapes on screen. */
    const halfW = 6.9;
    const hHalfAngle = Math.atan(Math.tan(fovy/2) * Math.min(aspect, 1));
    dist = Math.max(17.5, halfW / Math.tan(hHalfAngle));
  }
  const proj = perspective(fovy, aspect, 0.1, 100);
  const eye = eyePos();
  const view = lookAt(eye, [0,0,0], [0,1,0]);

  if (modeIdx === 2){
    /* PAIR: frozen catenoid (pi/2) left, helicoid (0) right */
    drawMesh(Math.PI/2, [-4.3,0,0], proj, view, eye);
    drawMesh(0.0,       [ 4.3,0,0], proj, view, eye);
    drawPath(Math.PI/2, [-4.3,0,0], proj, view, [1.0,0.75,0.25]);
    drawPath(0.0,       [ 4.3,0,0], proj, view, [1.0,0.75,0.25]);
    updateStat(Math.PI/2);
    statSubEl.innerHTML = 'LEFT catenoid &middot; RIGHT helicoid &middot; both path L ' +
      ANALYTIC_PATH_LEN.toFixed(3);
  } else {
    /* smooth 0<->pi oscillation, easing to a stop at each named surface */
    const theta = (0.5 - 0.5*Math.cos(t*0.22)) * Math.PI;
    if (modeIdx === 0){
      drawMesh(theta, [0,0,0], proj, view, eye);
    } else {
      drawWire(theta, [0,0,0], proj, view, [0.32,0.85,0.92]);
    }
    drawPath(theta, [0,0,0], proj, view, [1.0,0.75,0.25]);
    updateStat(theta);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
