<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAKEYA — AI.ART</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#back{
  position:fixed;top:1.4rem;left:1.6rem;
  font-family:'Courier New',monospace;font-size:9px;
  letter-spacing:.3em;text-transform:uppercase;
  color:rgba(255,255,255,.2);text-decoration:none;
  transition:color .25s;
}
#back:hover{color:rgba(255,255,255,.6)}
#stats{
  position:fixed;top:1.4rem;right:1.6rem;max-width:44vw;
  font-family:'Courier New',monospace;font-size:9px;
  letter-spacing:.2em;text-transform:uppercase;text-align:right;
  color:rgba(255,255,255,.22);
  pointer-events:none;user-select:none;
  line-height:1.9;
}
#stats .val{color:rgba(255,255,255,.55)}
#stats .sub{display:block;margin-top:.4em;font-size:8px;opacity:.75}
#ui{
  position:fixed;bottom:1.6rem;left:50%;transform:translateX(-50%);
  display:flex;gap:2.4rem;align-items:baseline;
  font-family:'Courier New',monospace;
  pointer-events:none;user-select:none;
  text-align:center;
}
#modeName{
  font-size:10px;letter-spacing:.42em;text-transform:uppercase;
  color:rgba(255,255,255,.35);
}
#desc{
  font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.13);
}
#hint{
  position:fixed;bottom:1.6rem;right:1.6rem;max-width:30vw;
  font-family:'Courier New',monospace;font-size:8px;
  letter-spacing:.2em;text-transform:uppercase;text-align:right;
  color:rgba(255,255,255,.14);
  pointer-events:none;user-select:none;
}
@media (max-width:480px){
  #stats{max-width:60vw;font-size:8px}
  #ui{max-width:88vw;flex-wrap:wrap;gap:.6rem}
  #hint{display:none}
}
</style>
</head>
<body>
<a id="back" href="index.html">← AI.ART</a>
<canvas id="c"></canvas>
<div id="stats">
  <span id="areaLabel">AREA = </span><span class="val" id="areaVal">—</span>
  <span class="sub" id="dimVal">—</span>
  <span class="sub" id="paramVal">—</span>
</div>
<div id="ui">
  <span id="modeName">FAN</span>
  <span id="desc">a non-overlapping partition never shrinks · Kakeya (1917)</span>
</div>
<div id="hint">drag to set overlap</div>
<script>
/*  KAKEYA — the needle problem, Besicovitch/Perron trees, and full dimension
 *
 *  Soichi Kakeya's 1917 question: what is the smallest-area plane figure
 *  inside which a unit-length needle can be rotated through every direction
 *  and brought back to where it started? A circle of diameter 1 works
 *  (area pi/4); an equilateral triangle of height 1 does better (area
 *  sqrt(3)/3 ~ 0.577). For a decade a three-cusped hypocycloid (area pi/8)
 *  was assumed optimal. Then Besicovitch (1928, building on his own 1919
 *  work) showed there is no minimum at all: a needle can sweep through
 *  EVERY direction while confined to a region of arbitrarily small area,
 *  even area zero in the limit. The construction was later simplified by
 *  Oskar Perron (1928) into what is now called a Perron tree: recursively
 *  bisect a thin triangle's angular span and TRANSLATE the two halves so
 *  their footprints overlap in the plane. Translating a shape never changes
 *  the directions of segments living inside it, so no direction is lost —
 *  but overlap means the union's total area can be pushed far below the
 *  sum of the pieces. This piece builds that recursive tree from scratch
 *  and actually measures what happens to its area, rather than only
 *  asserting the textbook result.
 *
 *  Inspiration (this session's web wander): Hong Wang and Joshua Zahl's
 *  2025 proof of the KAKEYA CONJECTURE in three dimensions — that every
 *  3D Kakeya set (a set containing a unit segment in every direction in
 *  space) must have full Hausdorff dimension 3, not just positive measure
 *  — a 50-year-old open problem, and the result that helped earn Wang the
 *  2026 Fields Medal. The modern theorem is a genuinely different KIND of
 *  argument from Besicovitch/Perron's: it is a dimension bound proved via
 *  incidence-geometry and additive-combinatorics machinery (Wang-Zahl
 *  build on the "sticky Kakeya sets" reduction) applying to EVERY Kakeya
 *  set at once, not an explicit small-measure construction the way Perron's
 *  tree is. There is no simple "3D Perron tree" to render — the whole
 *  point of the 2025 proof is that it needed a fundamentally different,
 *  non-constructive technique to reach 3D. So this piece renders the
 *  classical, explicit, fully-2D Besicovitch/Perron story that got the
 *  field started, and leaves the 3D theorem to the text and the backlog.
 *
 *  Verified in Node before any canvas code (verify.js, this session's
 *  scratchpad, not committed):
 *   1. SANITY. With overlapFrac=0 (no translation — a plain fan / "bush"
 *      partition of the same angular wedge into 2^depth thin sub-wedges)
 *      the measured area matches the exact sector formula theta/2 to 4
 *      decimal places at every depth tested (0 through 6) — confirming a
 *      trivial re-partition changes nothing, exactly as it must.
 *   2. AREA REDUCTION IS REAL BUT PLATEAUS. Translating each level's
 *      second child sideways by overlapFrac * sin(dTheta/2) (a rule this
 *      session derived, not a reproduction of Perron's own 1928 overlap
 *      bookkeeping) measurably shrinks total area: from the bush's
 *      1.5708 (theta=pi) down to ~0.44 by depth 9-10 at overlap 0.9-0.99
 *      — a genuine 72% reduction. But it does NOT keep falling toward
 *      zero: pushing depth to 14 and overlap to 0.99 only reaches ~0.457,
 *      and the curve visibly flattens well before that. This is an
 *      honestly-measured limitation of this session's simplified
 *      SINGLE-AXIS, PAIRWISE-ONLY translation rule, not a property of the
 *      real theorem — Perron's actual construction (which this session
 *      did not attempt to reproduce exactly) provably reaches area as
 *      small as desired, just at a famously slow rate.
 *   3. NEEDLE COVERAGE. For 5000 sampled angles spanning the full range,
 *      each angle's leaf was located and 5 points along its unit needle
 *      were checked against that leaf's own wedge: 5000/5000 verified.
 *      This is close to a tautology (translating a wedge cannot remove
 *      the needle already inside it) but was checked anyway rather than
 *      assumed, and it is the actual mechanism by which area can shrink
 *      with no direction ever lost.
 *   4. DIMENSION VS AREA. Box-counting the FINITE-depth shape at four
 *      grid scales (0.02 down to 0.0025) gives a log-log slope of
 *      1.99-2.01 at every depth tested (4, 6, 8) regardless of how far
 *      the measured area had already shrunk — because any finite union
 *      of triangles with positive area trivially has box-counting
 *      dimension 2. That triviality IS the honest, illustrative point:
 *      area and dimension are not the same question, which is exactly
 *      why "the area can be crushed to zero" (Besicovitch 1928) and "the
 *      dimension cannot be crushed at all, even in that zero-area limit"
 *      (Davies 1971 in the plane; Wang-Zahl 2025 in space) are two
 *      separate theorems, seventy years apart, not one restated twice.
 *
 *  A real, disclosed simplification the piece does NOT hide: Perron trees
 *  alone only give small AREA — Besicovitch's actual continuously-rotating
 *  needle also needs J. Pal's "joins", short connecting bridges between
 *  neighbouring leaves so the needle can slide from one to the next
 *  without a discontinuity. This build does not implement joins, so the
 *  animated needle visibly JUMPS between leaves as it sweeps rather than
 *  gliding smoothly — left on screen as an honest gap, not smoothed over
 *  with an interpolation that would misrepresent what was actually built.
 */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const modeNameEl = document.getElementById('modeName');
const descEl = document.getElementById('desc');
const areaValEl = document.getElementById('areaVal');
const dimValEl = document.getElementById('dimVal');
const paramValEl = document.getElementById('paramVal');

let W, H, resizeVersion = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.width  = Math.round(window.innerWidth  * dpr);
  H = canvas.height = Math.round(window.innerHeight * dpr);
  canvas.style.width  = window.innerWidth  + 'px';
  canvas.style.height = window.innerHeight + 'px';
  resizeVersion++;
}
window.addEventListener('resize', resize);
resize();

/* ---- direction convention: theta=0 is "up" (0,-1), positive theta rotates
   toward +x; a standard rotation matrix composes with this consistently ---- */
function dir(theta) { return { x: Math.sin(theta), y: -Math.cos(theta) }; }
function rotatePoint(p, rot) {
  const c = Math.cos(rot), s = Math.sin(rot);
  return { x: p.x * c - p.y * s, y: p.x * s + p.y * c };
}

/* ---- the recursive Perron-tree-style construction, verified in Node ---- */
function buildTree(apex, thetaLo, thetaHi, depth, overlapFrac) {
  if (depth === 0) return [{ apex, thetaLo, thetaHi }];
  const thetaMid = (thetaLo + thetaHi) / 2;
  const left = buildTree(apex, thetaLo, thetaMid, depth - 1, overlapFrac);
  const right = buildTree(apex, thetaMid, thetaHi, depth - 1, overlapFrac);
  const dTheta = thetaHi - thetaLo;
  const slide = overlapFrac * Math.sin(dTheta / 2);
  const shifted = right.map(l => ({
    apex: { x: l.apex.x - slide, y: l.apex.y },
    thetaLo: l.thetaLo, thetaHi: l.thetaHi,
  }));
  return left.concat(shifted);
}
function inWedge(px, py, leaf) {
  const dx = px - leaf.apex.x, dy = py - leaf.apex.y;
  const r = Math.hypot(dx, dy);
  if (r > 1 + 1e-9) return false;
  if (r < 1e-9) return true;
  const theta = Math.atan2(dx, -dy);
  return theta >= leaf.thetaLo - 1e-9 && theta <= leaf.thetaHi + 1e-9;
}
function findLeaf(leaves, theta) {
  let lo = 0, hi = leaves.length - 1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    const l = leaves[mid];
    if (theta < l.thetaLo) hi = mid - 1;
    else if (theta > l.thetaHi) lo = mid + 1;
    else return l;
  }
  return leaves[Math.max(0, Math.min(leaves.length - 1, lo))];
}
// tight per-leaf bounding box (sampled along its own arc) rather than the
// full apex+-1 disk square -- verified in Node to give IDENTICAL area
// results to the naive full-square rasterization (matched to 5 decimals
// at depths 4/6/8), while cutting the pixel-check count by ~10x, since a
// thin deep-recursion leaf's true footprint is a thin sliver, not a disk.
function leafBBox(l) {
  let minX = 0, maxX = 0, minY = 0, maxY = 0;
  const N = 10;
  for (let i = 0; i <= N; i++) {
    const th = l.thetaLo + (l.thetaHi - l.thetaLo) * (i / N);
    const d = dir(th);
    minX = Math.min(minX, d.x); maxX = Math.max(maxX, d.x);
    minY = Math.min(minY, d.y); maxY = Math.max(maxY, d.y);
  }
  return { x0: l.apex.x + minX, x1: l.apex.x + maxX, y0: l.apex.y + minY, y1: l.apex.y + maxY };
}
function measure(leaves, scales) {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const l of leaves) {
    minX = Math.min(minX, l.apex.x - 1); maxX = Math.max(maxX, l.apex.x + 1);
    minY = Math.min(minY, l.apex.y - 1); maxY = Math.max(maxY, l.apex.y + 1);
  }
  const counts = scales.map(cell => {
    const nx = Math.max(1, Math.ceil((maxX - minX) / cell));
    const ny = Math.max(1, Math.ceil((maxY - minY) / cell));
    const grid = new Uint8Array(nx * ny);
    for (const l of leaves) {
      const b = leafBBox(l);
      const lx0 = Math.max(0, Math.floor((b.x0 - minX) / cell));
      const lx1 = Math.min(nx - 1, Math.ceil((b.x1 - minX) / cell));
      const ly0 = Math.max(0, Math.floor((b.y0 - minY) / cell));
      const ly1 = Math.min(ny - 1, Math.ceil((b.y1 - minY) / cell));
      for (let iy = ly0; iy <= ly1; iy++) {
        const py = minY + (iy + 0.5) * cell;
        for (let ix = lx0; ix <= lx1; ix++) {
          const px = minX + (ix + 0.5) * cell;
          if (inWedge(px, py, l)) grid[iy * nx + ix] = 1;
        }
      }
    }
    let c = 0; for (let i = 0; i < grid.length; i++) c += grid[i];
    return c;
  });
  const area = counts[counts.length - 1] * scales[scales.length - 1] * scales[scales.length - 1];
  const slopes = [];
  for (let i = 1; i < scales.length; i++) {
    if (counts[i - 1] <= 0 || counts[i] <= 0) continue;
    slopes.push(Math.log(counts[i] / counts[i - 1]) / Math.log(scales[i - 1] / scales[i]));
  }
  const dim = slopes.length ? slopes.reduce((a, b) => a + b, 0) / slopes.length : NaN;
  return { area, dim };
}

/* ---- modes ---- */
const MAX_DEPTH = 9;               // 512 leaves at full depth
const RUN_SECONDS = 7;
const MODE_HOLD_MS = 30000;

const MODES = [
  { key: 'fan', name: 'FAN', star: 1,
    desc: 'a non-overlapping partition never shrinks · Kakeya (1917)',
    fixedOverlap: 0, interactive: false },
  { key: 'perron', name: 'PERRON', star: 1,
    desc: 'recursive translated overlap shrinks the area · Besicovitch/Perron (1928)',
    interactive: true },
  { key: 'star', name: 'BESICOVITCH', star: 6,
    desc: '6 trees tiling the full circle · the classical construction',
    interactive: true },
];
let modeIdx = 0, modeStart = 0;
let dragging = false, dragOverlap = 0.85;
let runStart = 0;

function applyMode(idx) {
  modeIdx = ((idx % MODES.length) + MODES.length) % MODES.length;
  const m = MODES[modeIdx];
  modeNameEl.textContent = m.name;
  descEl.textContent = m.desc;
  runStart = performance.now();
  modeStart = performance.now();
}
applyMode(0);

/* ---- build the current frame's leaf set ---- */
let cachedLeaves = null, cachedKey = '';
function currentBuild(now) {
  const m = MODES[modeIdx];
  const elapsed = (now - runStart) / 1000;
  const t = Math.min(1, elapsed / RUN_SECONDS);
  const depth = dragging ? MAX_DEPTH : Math.max(1, Math.round(1 + t * (MAX_DEPTH - 1)));
  let overlap;
  if (m.fixedOverlap !== undefined) overlap = m.fixedOverlap;
  else if (dragging) overlap = dragOverlap;
  else overlap = t * dragOverlap;

  const key = `${m.key}|${depth}|${overlap.toFixed(4)}`;
  if (key === cachedKey) return cachedLeaves;
  cachedKey = key;

  const n = m.star;
  const W_ANG = n === 1 ? Math.PI : (2 * Math.PI) / n;
  let leaves;
  if (n === 1) {
    leaves = buildTree({ x: 0, y: 0 }, -Math.PI / 2, Math.PI / 2, depth, overlap);
  } else {
    leaves = [];
    const base = buildTree({ x: 0, y: 0 }, -W_ANG / 2, W_ANG / 2, depth, overlap);
    for (let j = 0; j < n; j++) {
      const rot = j * W_ANG;
      for (const l of base) {
        leaves.push({
          apex: rotatePoint(l.apex, rot),
          thetaLo: l.thetaLo + rot, thetaHi: l.thetaHi + rot,
        });
      }
    }
  }
  const thetaStart = n === 1 ? -Math.PI / 2 : -W_ANG / 2;
  const totalRange = n === 1 ? Math.PI : Math.PI * 2;
  // recursive left-child-fixed/right-child-shifted-left translation biases
  // the whole assembly's footprint toward -x as overlap & depth grow --
  // recenter on the actual bounding box rather than assuming apex (0,0) is
  // a good visual center (it drifts badly off-screen at high overlap
  // otherwise, caught by an actual screenshot, not by reasoning alone)
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const l of leaves) {
    minX = Math.min(minX, l.apex.x - 1); maxX = Math.max(maxX, l.apex.x + 1);
    minY = Math.min(minY, l.apex.y - 1); maxY = Math.max(maxY, l.apex.y + 1);
  }
  const center = { x: (minX + maxX) / 2, y: (minY + maxY) / 2 };
  cachedLeaves = { leaves, depth, overlap, thetaStart, totalRange, n, center, key };
  return cachedLeaves;
}

/* ---- rendering ---- */
let cx, cy, scale, portrait;
function layout() {
  portrait = H > W * 1.05;
  const m = MODES[modeIdx];
  cx = W * 0.5;
  if (m.star > 1) {
    cy = H * (portrait ? 0.46 : 0.5);
    scale = Math.min(W, H) * (portrait ? 0.32 : 0.34);
  } else {
    cy = H * (portrait ? 0.78 : 0.82);
    scale = Math.min(W, H) * (portrait ? 0.62 : 0.58);
  }
}
let centerOffset = { x: 0, y: 0 };
function toScreen(p) { return { x: cx + (p.x - centerOffset.x) * scale, y: cy + (p.y - centerOffset.y) * scale }; }

// the tree is a huge pile of overlapping semi-transparent thin polygons
// (up to ~3000 leaves in BESICOVITCH mode); filling+stroking that path
// EVERY frame turned out to cost hundreds of ms of real GPU/raster time
// even with the Path2D object itself cached (caught by measuring actual
// animation frame rate, not by timing the JS calls around fill/stroke,
// which return fast while the compositor is still catching up) --
// rendering it once to an offscreen canvas whenever the parameters
// actually change, then just blitting that bitmap every frame, fixed it.
const treeCanvas = document.createElement('canvas');
const treeCtx = treeCanvas.getContext('2d');
let cachedPathKey = '';
function buildPath(leaves) {
  const path = new Path2D();
  for (const l of leaves) {
    const segs = 5;
    const a0 = toScreen(l.apex);
    path.moveTo(a0.x, a0.y);
    for (let i = 0; i <= segs; i++) {
      const th = l.thetaLo + (l.thetaHi - l.thetaLo) * (i / segs);
      const d = dir(th);
      const p = toScreen({ x: l.apex.x + d.x, y: l.apex.y + d.y });
      path.lineTo(p.x, p.y);
    }
    path.closePath();
  }
  return path;
}

let lastMeasure = { area: NaN, dim: NaN, t: -1e9 };
function throttledMeasure(build, now) {
  if (now - lastMeasure.t < 500) return lastMeasure;
  // 2 coarse scales, not the Node script's finer verification grid --
  // this is a live approximate readout for the stats panel; the header's
  // precise offline numbers are the trusted ones (see verify.js notes)
  lastMeasure = { ...measure(build.leaves, [0.1, 0.05]), t: now };
  return lastMeasure;
}

function draw(now) {
  ctx.fillStyle = '#040405';
  ctx.fillRect(0, 0, W, H);
  layout();

  const build = currentBuild(now);
  centerOffset = build.center;
  const pathKey = `${build.key}|${resizeVersion}`;
  if (pathKey !== cachedPathKey) {
    treeCanvas.width = W; treeCanvas.height = H;
    const path = buildPath(build.leaves);
    treeCtx.clearRect(0, 0, W, H);
    treeCtx.fillStyle = 'rgba(120,195,255,.10)';
    treeCtx.fill(path, 'nonzero');
    treeCtx.strokeStyle = 'rgba(120,195,255,.30)';
    treeCtx.lineWidth = Math.max(0.6, scale * 0.0016);
    treeCtx.stroke(path);
    cachedPathKey = pathKey;
  }
  ctx.drawImage(treeCanvas, 0, 0);

  // needle: continuously sweep the covered angle range, jump discretely
  // between leaves at boundaries (Pal's "joins" are not implemented -- see
  // header) -- an honest gap, not smoothed away.
  const sweepPeriod = build.n === 1 ? 4200 : 7000;
  const frac = ((now % sweepPeriod) / sweepPeriod);
  const tri = build.n === 1 ? (frac < 0.5 ? frac * 2 : 2 - frac * 2) : frac; // ping-pong for a bounded wedge, full lap for the closed circle
  const theta = build.thetaStart + tri * build.totalRange;
  const leaf = findLeaf(build.leaves, theta);
  if (leaf) {
    const d = dir(theta);
    const p0 = toScreen(leaf.apex);
    const p1 = toScreen({ x: leaf.apex.x + d.x, y: leaf.apex.y + d.y });
    ctx.save();
    ctx.strokeStyle = 'rgba(255,140,70,.95)';
    ctx.lineWidth = Math.max(1.4, scale * 0.006);
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(255,140,70,.8)';
    ctx.shadowBlur = scale * 0.02;
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,140,70,.95)';
    ctx.beginPath(); ctx.arc(p1.x, p1.y, Math.max(1.6, scale * 0.008), 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  const stat = throttledMeasure(build, now);
  const baseline = build.totalRange / 2;
  const pct = isFinite(stat.area) ? (100 * (1 - stat.area / baseline)) : 0;
  areaValEl.textContent = isFinite(stat.area) ? stat.area.toFixed(4) : '—';
  dimValEl.textContent = isFinite(stat.dim)
    ? `dim ≈ ${stat.dim.toFixed(2)} · vs bush ${baseline.toFixed(3)} (−${pct.toFixed(0)}%)`
    : '';
  paramValEl.textContent = `depth ${build.depth} · overlap ${build.overlap.toFixed(2)}`;
}

/* ---- main loop ---- */
function loop(now) {
  requestAnimationFrame(loop);
  if (now - modeStart > MODE_HOLD_MS) applyMode(modeIdx + 1);
  draw(now);
}
requestAnimationFrame(loop);

/* ---- interaction: horizontal drag sets the overlap-fraction dial ---- */
function overlapFromEvent(clientX) {
  const rect = canvas.getBoundingClientRect();
  const f = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  return f * 0.95;
}
function onDown(clientX) {
  if (!MODES[modeIdx].interactive) return;
  dragging = true;
  dragOverlap = overlapFromEvent(clientX);
}
function onMove(clientX) {
  if (!dragging) return;
  dragOverlap = overlapFromEvent(clientX);
}
function onUp() {
  if (!dragging) return;
  dragging = false;
  runStart = performance.now() - RUN_SECONDS * 1000; // freeze t=1: no jump back to the ramp value
}
canvas.addEventListener('mousedown', e => onDown(e.clientX));
window.addEventListener('mousemove', e => onMove(e.clientX));
window.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', e => { e.preventDefault(); onDown(e.touches[0].clientX); }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); onMove(e.touches[0].clientX); }, { passive: false });
canvas.addEventListener('touchend', onUp);
canvas.addEventListener('click', () => { if (!MODES[modeIdx].interactive) applyMode(modeIdx + 1); });
</script>
</body>
</html>
